<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>DEADZONE</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: radial-gradient(circle at 50% 30%, #14141a 0%, #06060a 80%);
    color: #eee; font-family: -apple-system, system-ui, sans-serif; overflow: hidden;
    user-select: none;
  }
  #wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px; height: calc(100% - 28px); }
  h1 { margin: 0; font-size: 18px; letter-spacing: 4px; }
  .sub { font-size: 11px; opacity: 0.55; }
  canvas { display: block; cursor: crosshair; background: #0d0e12; border-radius: 6px; box-shadow: 0 0 0 1px #2a2a33, 0 12px 40px rgba(0,0,0,0.5); }
  kbd { background: #222; padding: 1px 5px; border-radius: 4px; font-family: ui-monospace, monospace; font-size: 10px; }
</style>
</head>
<body>
<div id="wrap">
  <h1>D E A D Z O N E</h1>
  <div class="sub"><kbd>WASD</kbd> move · <kbd>mouse</kbd> aim · <kbd>hold LMB</kbd> shoot · stand in the shop to see upgrades · press <kbd>1-9</kbd> to buy · <kbd>R</kbd> reset</div>
  <canvas id="c" width="1200" height="680"></canvas>
</div>

<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const W = c.width, H = c.height;

// ---------- Player ----------
const SPAWN = { x: 90, y: H / 2 };
const player = {
  x: SPAWN.x, y: SPAWN.y,
  r: 11,
  hp: 100, maxHp: 100,
  money: 0,
  speed: 220,           // px/s
  damage: 10,
  fireRate: 4,          // shots/s
  bulletSpeed: 700,
  pierce: 0,
  lastShot: 0,
  invuln: 0,            // seconds
  weapon: 'pistol',
  buffs: { triple: 0, rapid: 0, fast: 0, shield: 0 },
  // Stacked perk effects picked from the post-wave card draw.
  // Effective values; parallel specialLevels tracks pick counts for display.
  special: {},
  specialLevels: {},
};

// Weapon definitions. Multipliers stack on top of player base stats.
// shots/spread/damage/fireRate/bulletSpeed are multipliers (or extras for shots).
const WEAPONS = {
  pistol:  { name: 'Pistol',   shots: 1, spread: 0.00, damage: 1.0, fireRate: 1.0, bulletSpeed: 1.0, pierce: 0, life: 1.4, color: '#ffe066', tag: 'P' },
  shotgun: { name: 'Shotgun',  shots: 5, spread: 0.20, damage: 0.55, fireRate: 0.55, bulletSpeed: 0.95, pierce: 0, life: 0.55, color: '#ff9d3a', tag: 'S' },
  smg:     { name: 'SMG',      shots: 1, spread: 0.08, damage: 0.55, fireRate: 2.6, bulletSpeed: 1.05, pierce: 0, life: 1.2, color: '#7ec8ff', tag: 'M' },
  rifle:   { name: 'Rifle',    shots: 1, spread: 0.00, damage: 2.6,  fireRate: 0.55, bulletSpeed: 1.55, pierce: 2, life: 1.6, color: '#9bf07a', tag: 'R' },
  rocket:  { name: 'Rocket',   shots: 1, spread: 0.00, damage: 1.5, fireRate: 0.45, bulletSpeed: 0.75, pierce: 0, life: 1.6, color: '#ff5050', tag: 'X', explosive: true, blastR: 70, blastDmg: 30 },
  // Gag weapons
  chicken: { name: 'Chicken Launcher', shots: 1, spread: 0.05, damage: 1.2, fireRate: 0.5, bulletSpeed: 0.55, pierce: 0, life: 1.8, color: '#ffe066', tag: 'C',
             explosive: true, blastR: 70, blastDmg: 18, bulletKind: 'chicken', spawnChicks: 6 },
  banana:  { name: 'Banana Cannon',    shots: 1, spread: 0.06, damage: 0.85, fireRate: 1.5, bulletSpeed: 1.0, pierce: 3, life: 1.4, color: '#ffd942', tag: 'B',
             bulletKind: 'banana', leavesSlick: true },
  duck:    { name: 'Rubber Duck',      shots: 1, spread: 0.04, damage: 0.9, fireRate: 1.6, bulletSpeed: 1.05, pierce: 0, life: 2.0, color: '#ffcc66', tag: 'D',
             bulletKind: 'duck', bounces: 3 },
};
const DROPPABLE_WEAPONS = ['shotgun', 'smg', 'rifle', 'rocket', 'chicken', 'banana', 'duck'];

// ---------- World ----------
const bullets = [];
const zombies = [];
const coins = [];
const particles = [];
const guns    = []; // { x, y, weapon, life }
const crates  = []; // { x, y, value, life }
const pickups = []; // { x, y, type, life }
const slicks  = []; // banana peels — { x, y, r, life, max, ang }
const chests  = []; // boss-drop reward chests — { x, y }
const floaters= []; // floating reward text — { x, y, text, life, color }
const decals  = []; // blood splats on the floor

// Random pickup definitions. apply() runs when the player walks over one.
const PICKUP_TYPES = {
  health: { name: 'Health',     symbol: '+', color: '#5cd86b',
    apply() { player.hp = Math.min(player.maxHp, player.hp + 40); } },
  shield: { name: 'Shield',     symbol: 'S', color: '#7ec8ff',
    apply() { player.buffs.shield = 1; } },
  triple: { name: 'Triple',     symbol: '3', color: '#c47eff',
    apply() { player.buffs.triple = 10; } },
  rapid:  { name: 'Rapid Fire', symbol: 'F', color: '#ffe066',
    apply() { player.buffs.rapid = 10; } },
  speed:  { name: 'Speed',      symbol: '»', color: '#5cffec',
    apply() { player.buffs.fast = 10; } },
  bomb:   { name: 'Bomb',       symbol: 'X', color: '#ff8040',
    apply() { detonateNuke(player.x, player.y); } },
};
const PICKUP_KEYS = Object.keys(PICKUP_TYPES);

// Post-wave perk cards. Player picks one of three to add a stacking effect.
const SPECIAL_UPGRADES = {
  lifesteal:  { name: 'Lifesteal',     desc: 'Heal 10% of damage dealt',     color: '#d63030',
                apply() { player.special.lifesteal = (player.special.lifesteal || 0) + 0.10; } },
  vampire:    { name: 'Vampire',       desc: '+3 HP per zombie kill',        color: '#a02828',
                apply() { player.special.vampire = (player.special.vampire || 0) + 3; } },
  crit:       { name: 'Critical Eye',  desc: '+12% crit chance (x2 dmg)',    color: '#ffce44',
                apply() { player.special.crit = (player.special.crit || 0) + 0.12; } },
  thorns:     { name: 'Thorns',        desc: '8 dmg/s to zombies on contact', color: '#7ec8ff',
                apply() { player.special.thorns = (player.special.thorns || 0) + 8; } },
  greed:      { name: 'Greed',         desc: '+25% money from kills',        color: '#ffd166',
                apply() { player.special.greed = (player.special.greed || 0) + 0.25; } },
  magnet:     { name: 'Magnet',        desc: '+40% coin pickup range',       color: '#c47eff',
                apply() { player.special.magnet = (player.special.magnet || 0) + 0.4; } },
  regen:      { name: 'Regeneration',  desc: '+1.5 HP per second',           color: '#5cd86b',
                apply() { player.special.regen = (player.special.regen || 0) + 1.5; } },
  glass:      { name: 'Glass Cannon',  desc: '+40% dmg, -15 Max HP',         color: '#ff7070',
                apply() {
                  player.special.glassCannon = (player.special.glassCannon || 0) + 0.4;
                  player.maxHp = Math.max(20, player.maxHp - 15);
                  player.hp = Math.min(player.maxHp, player.hp);
                } },
  berserk:    { name: 'Berserker',     desc: '+30% dmg below 30% HP',        color: '#ff5050',
                apply() { player.special.berserk = (player.special.berserk || 0) + 0.3; } },
  multishot:  { name: 'Multishot',     desc: '+15% chance for bonus shot',   color: '#7ec8ff',
                apply() { player.special.multishot = (player.special.multishot || 0) + 0.15; } },
  slow:       { name: 'Cold Bullets',  desc: 'Hits slow zombies for 1s',     color: '#5cffec',
                apply() { player.special.slow = (player.special.slow || 0) + 1.0; } },
  juggernaut: { name: 'Juggernaut',    desc: '+25 Max HP, heals to full',    color: '#5cb85c',
                apply() { player.maxHp += 25; player.hp = player.maxHp; } },
};
const SPECIAL_KEYS = Object.keys(SPECIAL_UPGRADES);

// Card picker state — populated when a wave ends, cleared on pick.
let pendingCards = null;            // array of 3 upgrade keys, or null
let cardRects = [null, null, null]; // cached for click hit-test

// Visual / interaction state
let nearbyGun = null;     // gun pickup the player is hovering over
let shakeAmt  = 0;        // current screen shake amplitude
let flashRed  = 0;        // 0..1 red overlay alpha (decays)
const swapBtn = { x: 0, y: 0, w: 140, h: 32 };  // positioned during draw

// ---------- Cheats panel ----------
// Hidden until the player types the unlock code (CHEAT_CODE) outside the shop.
const CHEAT_CODE = '1234';
let cheatsUnlocked = false;
let cheatBuffer = '';
let cheatsOpen = false;
let godMode    = false;
let cheatsHeaderRect = null;

// Each cheat: label (string or () => string) + run() to execute.
// Optional toggle() returns on/off state for boolean cheats.
const cheats = [
  { label: '+$500', run() { player.money += 500; } },
  { label: 'Full Heal', run() { player.hp = player.maxHp; } },
  { label: 'Kill All', run() {
      for (const z of zombies) {
        kills++;
        spawnDeathParticles(z.x, z.y, z.color);
        addBlood(z.x, z.y, z.isBoss ? 2 : 1);
        dropCoinsFor(z);
      }
      zombies.length = 0;
    } },
  { label: '+5 Waves', run() {
      zombies.length = 0; bullets.length = 0;
      wave = wave + 4;
      intermission = 0;
      beginNextWave();
    } },
  { label: 'Spawn Boss', run() { spawnBoss(); } },
  { label: '+Pickup', run() {
      const type = PICKUP_KEYS[Math.floor(Math.random() * PICKUP_KEYS.length)];
      const a = Math.random() * Math.PI * 2;
      spawnPickupAt(player.x + Math.cos(a) * 50, player.y + Math.sin(a) * 50, type);
    } },
  { label: () => `Gun: ${WEAPONS[player.weapon].name}`,
    run() {
      const ks = Object.keys(WEAPONS);
      const i = ks.indexOf(player.weapon);
      player.weapon = ks[(i + 1) % ks.length];
    } },
  { label: 'Max Upgrades', run() {
      for (const u of upgrades) if (u.type === 'perm') u.buy();
      player.hp = player.maxHp;
    } },
  { label: 'God Mode', toggle: () => godMode, run() { godMode = !godMode; } },
];

const shop = { x: W - 220, y: 60, w: 180, h: 200 };

let gameTime = 0;
let kills = 0;
let deaths = 0;
let bestKills = 0;

// Wave state. wave=0 + intermission>0 means "before wave 1 starts."
let wave = 0;
let isBossWave = false;
let waveZombiesToSpawn = 0;
let waveSpawnTimer = 0;
let intermission = 3;            // seconds of safe prep before next wave
let bestWave = 0;

// ---------- Input ----------
const keys = Object.create(null);
const mouse = { x: W / 2, y: H / 2, down: false };

const skipBtn = { x: W / 2 - 80, y: H / 2 - 28, w: 160, h: 40 };
function pointInRect(p, r) { return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }

// Draw a weapon at the local origin, pointing along +x. Caller handles transform.
function drawGun(weapon, r) {
  const w = WEAPONS[weapon] || WEAPONS.pistol;
  const x0 = r * 0.55;
  ctx.strokeStyle = '#15151a';
  ctx.lineWidth = 1;

  switch (weapon) {
    case 'shotgun': {
      // double-barrel feel: thick body + wood stock at the back + colored muzzle
      ctx.fillStyle = '#3a2a1a';                            // wood stock
      ctx.fillRect(x0 - r * 0.45, -3, r * 0.45, 6);
      ctx.fillStyle = '#222a32';                            // receiver
      ctx.fillRect(x0, -5, r * 1.5, 10);
      ctx.strokeRect(x0, -5, r * 1.5, 10);
      ctx.fillStyle = '#0d0f14';                            // barrel split
      ctx.fillRect(x0 + r * 0.4, -1, r * 1.1, 2);
      ctx.fillStyle = '#5a4030';                            // pump grip
      ctx.fillRect(x0 + r * 0.4, 5, r * 0.45, 3);
      ctx.fillStyle = w.color;
      ctx.fillRect(x0 + r * 1.5, -4, 5, 8);                 // muzzle
      break;
    }
    case 'smg': {
      // boxy receiver, mag underneath, stub stock
      ctx.fillStyle = '#2c2c34';                            // stock
      ctx.fillRect(x0 - r * 0.35, -2.5, r * 0.35, 5);
      ctx.fillStyle = '#1e2230';                            // receiver
      ctx.fillRect(x0, -4, r * 1.05, 8);
      ctx.strokeRect(x0, -4, r * 1.05, 8);
      ctx.fillStyle = '#2c2c34';                            // magazine
      ctx.fillRect(x0 + r * 0.2, 4, 5, 8);
      ctx.strokeRect(x0 + r * 0.2, 4, 5, 8);
      ctx.fillStyle = '#1a1a22';                            // short thin barrel
      ctx.fillRect(x0 + r * 1.05, -1.5, r * 0.5, 3);
      ctx.fillStyle = w.color;
      ctx.fillRect(x0 + r * 1.55, -2, 4, 4);                // muzzle
      break;
    }
    case 'rifle': {
      // long body, scope on top, stock at rear
      ctx.fillStyle = '#3a2a1a';                            // wood stock
      ctx.fillRect(x0 - r * 0.55, -3, r * 0.55, 6);
      ctx.fillStyle = '#1f2418';                            // receiver
      ctx.fillRect(x0, -3, r * 1.7, 6);
      ctx.strokeRect(x0, -3, r * 1.7, 6);
      ctx.fillStyle = '#1a1a1a';                            // scope tube
      ctx.fillRect(x0 + r * 0.45, -7, r * 0.6, 4);
      ctx.strokeRect(x0 + r * 0.45, -7, r * 0.6, 4);
      ctx.fillStyle = '#1a1a22';                            // long thin barrel
      ctx.fillRect(x0 + r * 1.7, -1.5, r * 0.55, 3);
      ctx.fillStyle = w.color;
      ctx.fillRect(x0 + r * 2.25, -2, 5, 4);                // muzzle
      break;
    }
    case 'rocket': {
      // fat tube + protruding rocket tip
      ctx.fillStyle = '#2a2a2a';
      ctx.fillRect(x0, -6, r * 1.35, 12);
      ctx.strokeRect(x0, -6, r * 1.35, 12);
      // bore
      ctx.fillStyle = '#0a0a0a';
      ctx.beginPath();
      ctx.arc(x0 + 3, 0, 4, 0, Math.PI * 2);
      ctx.fill();
      // top sight
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(x0 + r * 0.4, -8, 4, 2);
      // protruding rocket tip
      ctx.fillStyle = w.color;
      ctx.beginPath();
      ctx.moveTo(x0 + r * 1.35, -5);
      ctx.lineTo(x0 + r * 1.35 + 9, 0);
      ctx.lineTo(x0 + r * 1.35, 5);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      // tiny fin
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(x0 + r * 1.2, -7, 3, 2);
      ctx.fillRect(x0 + r * 1.2, 5, 3, 2);
      break;
    }
    case 'chicken': {
      // wide tube launcher with a chicken head peeking out the muzzle
      ctx.fillStyle = '#2a2a2a';
      ctx.fillRect(x0, -7, r * 1.45, 14);
      ctx.strokeRect(x0, -7, r * 1.45, 14);
      // bore
      ctx.fillStyle = '#0a0a0a';
      ctx.beginPath(); ctx.arc(x0 + 4, 0, 4.5, 0, Math.PI * 2); ctx.fill();
      // chicken head
      ctx.fillStyle = '#fff5b8';
      ctx.beginPath(); ctx.arc(x0 + r * 1.55, 0, 5, 0, Math.PI * 2); ctx.fill();
      ctx.stroke();
      // red comb
      ctx.fillStyle = '#d63030';
      ctx.beginPath();
      ctx.arc(x0 + r * 1.55 - 1, -5, 1.5, 0, Math.PI * 2);
      ctx.arc(x0 + r * 1.55 + 1, -5, 1.5, 0, Math.PI * 2);
      ctx.fill();
      // beak
      ctx.fillStyle = '#ff9d3a';
      ctx.beginPath();
      ctx.moveTo(x0 + r * 1.55 + 5, -1);
      ctx.lineTo(x0 + r * 1.55 + 10, 0);
      ctx.lineTo(x0 + r * 1.55 + 5, 2);
      ctx.closePath(); ctx.fill();
      // eye
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath(); ctx.arc(x0 + r * 1.55 + 1.5, -0.5, 0.9, 0, Math.PI * 2); ctx.fill();
      break;
    }
    case 'banana': {
      // bright yellow curved body — the gun IS a banana
      ctx.fillStyle = '#ffd942';
      ctx.beginPath();
      ctx.moveTo(x0 - r * 0.3, 4);
      ctx.quadraticCurveTo(x0 + r * 0.6, -10, x0 + r * 1.7, -2);
      ctx.quadraticCurveTo(x0 + r * 1.85, 3, x0 + r * 1.6, 5);
      ctx.quadraticCurveTo(x0 + r * 0.6, -3, x0 - r * 0.2, 7);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      // tip
      ctx.fillStyle = '#6a4a0a';
      ctx.fillRect(x0 + r * 1.7, -3, 3, 3);
      break;
    }
    case 'duck': {
      // small body with a duck riding on top
      ctx.fillStyle = '#2e2e36';
      ctx.fillRect(x0, -3, r * 0.85, 6);
      ctx.strokeRect(x0, -3, r * 0.85, 6);
      ctx.fillStyle = w.color;
      ctx.fillRect(x0 + r * 0.85, -2, 4, 4); // muzzle
      // duck body on top
      ctx.fillStyle = '#ffe066';
      ctx.beginPath(); ctx.arc(x0 + r * 0.5, -6, 4.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      // duck head
      ctx.beginPath(); ctx.arc(x0 + r * 0.95, -8, 3, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      // beak
      ctx.fillStyle = '#ff9d3a';
      ctx.beginPath();
      ctx.moveTo(x0 + r * 0.95 + 2, -8);
      ctx.lineTo(x0 + r * 0.95 + 6, -7.5);
      ctx.lineTo(x0 + r * 0.95 + 2, -7);
      ctx.closePath(); ctx.fill();
      // eye
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath(); ctx.arc(x0 + r * 0.95 + 0.5, -8.5, 0.6, 0, Math.PI * 2); ctx.fill();
      break;
    }
    default: { // pistol — short, with grip below
      ctx.fillStyle = '#2e2e36';
      ctx.fillRect(x0, -3.5, r * 0.95, 7);
      ctx.strokeRect(x0, -3.5, r * 0.95, 7);
      // grip
      ctx.fillStyle = '#2a2a32';
      ctx.fillRect(x0 + r * 0.05, 3.5, 4, 6);
      ctx.strokeRect(x0 + r * 0.05, 3.5, 4, 6);
      // muzzle
      ctx.fillStyle = w.color;
      ctx.fillRect(x0 + r * 0.95, -2, 4, 4);
      break;
    }
  }
}

// Dispatch bullet drawing to a gag-specific shape, falling back to a plain disc.
function drawBullet(b) {
  if (b.bulletKind === 'chicken') {
    const ang = Math.atan2(b.vy, b.vx);
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(ang);
    // body
    ctx.fillStyle = '#fff5b8';
    ctx.beginPath(); ctx.ellipse(0, 0, 7, 5.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#15151a';
    ctx.lineWidth = 1;
    ctx.stroke();
    // comb
    ctx.fillStyle = '#d63030';
    ctx.beginPath(); ctx.arc(-1, -5, 1.5, 0, Math.PI*2);
    ctx.arc(1, -5, 1.5, 0, Math.PI*2); ctx.fill();
    // beak (forward = +x)
    ctx.fillStyle = '#ff9d3a';
    ctx.beginPath();
    ctx.moveTo(6, -1); ctx.lineTo(11, 0); ctx.lineTo(6, 2); ctx.closePath();
    ctx.fill();
    // eye
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.arc(3, -1, 0.9, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    return;
  }
  if (b.bulletKind === 'chick') {
    const ang = Math.atan2(b.vy, b.vx);
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(ang);
    ctx.fillStyle = '#ffe066';
    ctx.beginPath(); ctx.arc(0, 0, 3.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ff9d3a';
    ctx.beginPath();
    ctx.moveTo(2.8, 0); ctx.lineTo(5.5, 0.7); ctx.lineTo(2.8, 1.2); ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.arc(1.4, -1, 0.6, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    return;
  }
  if (b.bulletKind === 'banana') {
    const ang = Math.atan2(b.vy, b.vx);
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(ang);
    ctx.fillStyle = '#ffd942';
    ctx.beginPath();
    ctx.moveTo(-6, 3);
    ctx.quadraticCurveTo(0, -6, 7, -1);
    ctx.quadraticCurveTo(8, 2, 6, 3);
    ctx.quadraticCurveTo(0, -2, -5, 5);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#a07e1c';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = '#6a4a0a';
    ctx.fillRect(6, -2, 2.5, 2.5);
    ctx.restore();
    return;
  }
  if (b.bulletKind === 'duck') {
    const ang = Math.atan2(b.vy, b.vx);
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(ang);
    // body
    ctx.fillStyle = '#ffe066';
    ctx.beginPath(); ctx.ellipse(-1, 1, 6, 4.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#15151a';
    ctx.lineWidth = 1;
    ctx.stroke();
    // head
    ctx.fillStyle = '#ffe066';
    ctx.beginPath(); ctx.arc(4, -2, 3.2, 0, Math.PI*2); ctx.fill();
    ctx.stroke();
    // beak
    ctx.fillStyle = '#ff9d3a';
    ctx.beginPath();
    ctx.moveTo(6.5, -2); ctx.lineTo(11, -1.5); ctx.lineTo(6.5, -0.5); ctx.closePath();
    ctx.fill();
    // eye
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.arc(5, -2.7, 0.7, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    return;
  }
  // default — plain circle (explosive rockets render larger)
  ctx.fillStyle = b.color || '#ffe066';
  ctx.beginPath(); ctx.arc(b.x, b.y, b.explosive ? 5 : 3, 0, Math.PI*2); ctx.fill();
}

// Draw a distinctive icon for a pickup type, centered at (x, y).
// All icons are drawn in dark ink so they read against the colored pickup body.
function drawPickupIcon(type, x, y, s) {
  ctx.save();
  ctx.fillStyle = '#15151a';
  ctx.strokeStyle = '#15151a';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  switch (type) {
    case 'health': { // medical + cross
      const t = Math.max(2, s * 0.28);
      ctx.fillRect(x - t/2, y - s*0.6, t, s*1.2);
      ctx.fillRect(x - s*0.6, y - t/2, s*1.2, t);
      break;
    }
    case 'shield': { // shield outline
      ctx.beginPath();
      ctx.moveTo(x, y - s*0.7);
      ctx.lineTo(x + s*0.55, y - s*0.35);
      ctx.lineTo(x + s*0.5,  y + s*0.25);
      ctx.lineTo(x,          y + s*0.7);
      ctx.lineTo(x - s*0.5,  y + s*0.25);
      ctx.lineTo(x - s*0.55, y - s*0.35);
      ctx.closePath();
      ctx.stroke();
      break;
    }
    case 'triple': { // three pellets in a triangle
      const r = Math.max(1.6, s * 0.18);
      ctx.beginPath(); ctx.arc(x,            y - s*0.4, r, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x - s*0.4,    y + s*0.3, r, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + s*0.4,    y + s*0.3, r, 0, Math.PI*2); ctx.fill();
      break;
    }
    case 'rapid': { // lightning bolt
      ctx.beginPath();
      ctx.moveTo(x - s*0.15, y - s*0.7);
      ctx.lineTo(x + s*0.35, y - s*0.05);
      ctx.lineTo(x + s*0.05, y + s*0.05);
      ctx.lineTo(x + s*0.2,  y + s*0.7);
      ctx.lineTo(x - s*0.35, y + s*0.05);
      ctx.lineTo(x - s*0.05, y - s*0.05);
      ctx.closePath();
      ctx.fill();
      break;
    }
    case 'speed': { // double chevron »
      ctx.beginPath();
      ctx.moveTo(x - s*0.5, y - s*0.45);
      ctx.lineTo(x - s*0.05, y);
      ctx.lineTo(x - s*0.5, y + s*0.45);
      ctx.moveTo(x + s*0.05, y - s*0.45);
      ctx.lineTo(x + s*0.5, y);
      ctx.lineTo(x + s*0.05, y + s*0.45);
      ctx.stroke();
      break;
    }
    case 'bomb': { // round bomb with fuse + spark
      ctx.beginPath(); ctx.arc(x, y + s*0.15, s*0.55, 0, Math.PI*2); ctx.fill();
      // collar
      ctx.fillRect(x - s*0.18, y - s*0.42, s*0.36, s*0.16);
      // fuse
      ctx.beginPath();
      ctx.moveTo(x + s*0.05, y - s*0.35);
      ctx.quadraticCurveTo(x + s*0.45, y - s*0.55, x + s*0.55, y - s*0.85);
      ctx.stroke();
      // spark
      ctx.fillStyle = '#ffce44';
      ctx.beginPath(); ctx.arc(x + s*0.55, y - s*0.85, 2.5, 0, Math.PI*2); ctx.fill();
      break;
    }
  }
  ctx.restore();
}

function darken(hex, amount = 0.4) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  const f = 1 - amount;
  return '#' + [r, g, b].map(c => Math.max(0, Math.round(c * f)).toString(16).padStart(2, '0')).join('');
}

addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyR') hardReset();
  // card pick takes priority over everything else digit-related
  if (pendingCards) {
    if (e.code === 'Digit1') { pickCard(0); return; }
    if (e.code === 'Digit2') { pickCard(1); return; }
    if (e.code === 'Digit3') { pickCard(2); return; }
    return;
  }
  if (e.code === 'Space' && intermission > 0) {
    intermission = 0;
    beginNextWave();
    e.preventDefault();
  }
  if (e.code === 'KeyE' && nearbyGun) doSwapWeapon();
  // shop buying — or cheat-code entry when standing outside the shop
  if (inShop()) {
    const idx = ['Digit1','Digit2','Digit3','Digit4','Digit5','Digit6','Digit7','Digit8','Digit9'].indexOf(e.code);
    if (idx >= 0 && idx < upgrades.length) tryBuy(idx);
  } else if (!cheatsUnlocked && e.code.startsWith('Digit')) {
    cheatBuffer = (cheatBuffer + e.code.slice(5)).slice(-CHEAT_CODE.length);
    if (cheatBuffer === CHEAT_CODE) {
      cheatsUnlocked = true;
      cheatsOpen = true;
      floaters.push({ x: 98, y: 200, text: 'CHEATS UNLOCKED', life: 2.8, color: '#8be08b' });
      shake(6);
    }
  }
});
addEventListener('keyup', e => { keys[e.code] = false; });

c.addEventListener('mousemove', e => {
  const r = c.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (W / r.width);
  mouse.y = (e.clientY - r.top)  * (H / r.height);
});
c.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  // card picker eats clicks while open
  if (pendingCards) {
    for (let i = 0; i < 3; i++) {
      if (cardRects[i] && pointInRect(mouse, cardRects[i])) { pickCard(i); return; }
    }
    return;
  }
  // cheats panel takes priority
  if (cheatsHeaderRect && pointInRect(mouse, cheatsHeaderRect)) {
    cheatsOpen = !cheatsOpen;
    return;
  }
  if (cheatsOpen) {
    for (const c of cheats) {
      if (c.rect && pointInRect(mouse, c.rect)) { c.run(); return; }
    }
  }
  if (intermission > 0 && pointInRect(mouse, skipBtn)) {
    intermission = 0;
    beginNextWave();
    return;
  }
  if (nearbyGun && nearbyGun.weapon !== player.weapon && pointInRect(mouse, swapBtn)) {
    doSwapWeapon();
    return;
  }
  mouse.down = true;
});
addEventListener('mouseup', e => { if (e.button === 0) mouse.down = false; });
addEventListener('contextmenu', e => e.preventDefault());

// ---------- Shop / Upgrades ----------
const upgrades = [
  { name: 'Max HP +20',     type: 'perm', cost: 25,
    buy() { player.maxHp += 20; player.hp = Math.min(player.maxHp, player.hp + 20); this.cost = Math.ceil(this.cost * 1.5); } },
  { name: 'Move Speed +25', type: 'perm', cost: 35,
    buy() { player.speed += 25; this.cost = Math.ceil(this.cost * 1.5); } },
  { name: 'Damage +5',      type: 'perm', cost: 45,
    buy() { player.damage += 5; this.cost = Math.ceil(this.cost * 1.5); } },
  { name: 'Fire Rate +1',   type: 'perm', cost: 55,
    buy() { player.fireRate += 1; this.cost = Math.ceil(this.cost * 1.5); } },
  { name: 'Pierce +1',      type: 'perm', cost: 90,
    buy() { player.pierce += 1; this.cost = Math.ceil(this.cost * 1.8); } },
  { name: 'Full Heal',      type: 'temp', cost: 18,
    buy() { player.hp = player.maxHp; } },
  { name: 'Triple Shot 15s', type: 'temp', cost: 28,
    buy() { player.buffs.triple = 15; } },
  { name: 'Rapid Fire 15s', type: 'temp', cost: 32,
    buy() { player.buffs.rapid = 15; } },
  { name: 'Nuke (clear)',   type: 'temp', cost: 70,
    buy() { detonateNuke(player.x, player.y); } },
];

function inShop() {
  return player.x > shop.x && player.x < shop.x + shop.w
      && player.y > shop.y && player.y < shop.y + shop.h;
}

function tryBuy(i) {
  const u = upgrades[i];
  if (player.money < u.cost) return;
  player.money -= u.cost;
  u.buy();
}

// ---------- Game logic ----------
function shake(amt) { shakeAmt = Math.max(shakeAmt, amt); }

function addBlood(x, y, scale = 1) {
  decals.push({ x, y, r: 8 * scale + Math.random()*3, color: 'rgba(115, 18, 18, 0.55)', life: 14, max: 14 });
  for (let i = 0; i < 4; i++) {
    const a = Math.random() * Math.PI * 2;
    const d = (4 + Math.random() * 9) * scale;
    decals.push({
      x: x + Math.cos(a)*d, y: y + Math.sin(a)*d,
      r: 3 * scale + Math.random()*2.5,
      color: 'rgba(90, 12, 12, 0.45)',
      life: 10 + Math.random()*3, max: 13,
    });
  }
}

function updateDecals(dt) {
  for (let i = decals.length - 1; i >= 0; i--) {
    decals[i].life -= dt;
    if (decals[i].life <= 0) decals.splice(i, 1);
  }
}

function muzzleFlash(x, y, ang) {
  for (let i = 0; i < 4; i++) {
    const a = ang + (Math.random() - 0.5) * 0.4;
    const s = 240 + Math.random() * 160;
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.07 + Math.random()*0.05, color: '#fff4a8' });
  }
}

function spawnDeathParticles(x, y, col) {
  for (let i = 0; i < 8; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 60 + Math.random() * 180;
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.4 + Math.random()*0.3, color: col });
  }
}

// A short outward burst in the given color — used whenever a loot drop appears,
// so the player's eye is drawn to it.
function dropBurst(x, y, color, n = 14) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 90 + Math.random() * 180;
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.45 + Math.random()*0.2, color });
  }
}

function dropCoinsFor(z) {
  // greed perk inflates the drop value
  const total = Math.round(z.money * (1 + (player.special.greed || 0)));
  const n = Math.min(6, Math.ceil(total / 3));
  const per = Math.max(1, Math.round(total / n));
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 60 + Math.random() * 100;
    coins.push({ x: z.x, y: z.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, value: per, life: 9 });
  }
  dropBurst(z.x, z.y, '#ffce44', 10);
}

function edgeSpawnPoint() {
  const edge = Math.floor(Math.random() * 4);
  if (edge === 0) return { x: Math.random() * W,  y: -20 };
  if (edge === 1) return { x: W + 20,             y: Math.random() * H };
  if (edge === 2) return { x: Math.random() * W,  y: H + 20 };
  return            { x: -20,             y: Math.random() * H };
}

// Pick a zombie type given the current wave. Tougher mixes show up later.
function rollType() {
  const r = Math.random();
  const tankChance = Math.min(0.28, 0.02 + wave * 0.014);
  const fastChance = Math.min(0.42, 0.06 + wave * 0.020);
  if (wave >= 4 && r < tankChance)               return 'tank';
  if (wave >= 2 && r < tankChance + fastChance)  return 'fast';
  return 'normal';
}

function spawnZombie() {
  if (zombies.length >= 100) return;
  const { x, y } = edgeSpawnPoint();
  const type = rollType();
  const base = {
    normal: { hp: 22, speed: 62,  damage: 14, r: 12, color: '#5e8c4a', money: 3 },
    fast:   { hp: 14, speed: 120, damage: 10, r: 9,  color: '#a85040', money: 5 },
    tank:   { hp: 75, speed: 38,  damage: 26, r: 19, color: '#374827', money: 14 },
  }[type];
  // wave scaling
  const hpMul   = 1 + wave * 0.09;
  const dmgMul  = 1 + wave * 0.025;
  const moneyMul = 1 + wave * 0.04;
  const hp = Math.ceil(base.hp * hpMul);
  zombies.push({
    x, y, type,
    r: base.r, color: base.color, speed: base.speed,
    hp, hpMax: hp,
    damage: base.damage * dmgMul,
    money: Math.ceil(base.money * moneyMul),
    phase: Math.random() * Math.PI * 2,
  });
}

function spawnBoss() {
  const bossNum = Math.max(1, Math.floor(wave / 20));
  const { x, y } = edgeSpawnPoint();
  const hp = 400 + bossNum * 400;
  zombies.push({
    x, y, type: 'boss', isBoss: true,
    r: 32 + bossNum * 3,
    color: '#9a2828',
    speed: 45 + bossNum * 6,
    hp, hpMax: hp,
    damage: 32 + bossNum * 8,
    money: 150 + bossNum * 90,
    minionTimer: 4 + Math.random() * 1.5,
    phase: Math.random() * Math.PI * 2,
  });
}

function spawnBossMinions(boss, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const dist = boss.r + 12;
    const x = boss.x + Math.cos(a) * dist;
    const y = boss.y + Math.sin(a) * dist;
    const hp = Math.ceil(16 + wave * 0.6);
    zombies.push({
      x, y, type: 'minion',
      r: 9, color: '#8b3a3a', speed: 115,
      hp, hpMax: hp, damage: 12, money: 3,
      phase: Math.random() * Math.PI * 2,
    });
  }
}

function beginNextWave() {
  wave++;
  bestWave = Math.max(bestWave, wave);
  isBossWave = (wave % 20 === 0);
  if (isBossWave) {
    waveZombiesToSpawn = 0;
    spawnBoss();
  } else {
    waveZombiesToSpawn = 5 + Math.floor(wave * 1.8);
    waveSpawnTimer = 0.4;
  }
  // each wave gets a free money crate somewhere in the arena
  spawnMoneyCrate();
  if (wave > 0 && wave % 5 === 0) spawnMoneyCrate(); // bonus every 5 waves
  // ...and a random pickup
  spawnRandomPickup();
  if (wave > 0 && wave % 5 === 0) spawnRandomPickup(); // bonus every 5 waves
}

function endCurrentWave() {
  player.money += 8 + wave * 3;
  intermission = isBossWave ? 12 : 7; // longer breather after a boss
  // every wave offers 3 random perks to pick from
  pendingCards = pickThreeUpgrades();
}

function pickThreeUpgrades() {
  // Fisher–Yates shuffle, take first 3 — guarantees distinct cards in one offer.
  const arr = SPECIAL_KEYS.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr.slice(0, 3);
}

function pickCard(idx) {
  if (!pendingCards) return;
  const key = pendingCards[idx];
  if (!key) return;
  const def = SPECIAL_UPGRADES[key];
  def.apply();
  player.specialLevels[key] = (player.specialLevels[key] || 0) + 1;
  // celebratory burst at the picked card
  const r = cardRects[idx];
  if (r) {
    const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
    for (let i = 0; i < 32; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 100 + Math.random() * 280;
      particles.push({ x: cx, y: cy, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.7 + Math.random()*0.3, color: def.color });
    }
    floaters.push({ x: cx, y: cy - 30, text: def.name + (player.specialLevels[key] > 1 ? ` LV ${player.specialLevels[key]}` : ''), life: 2.2, color: def.color });
  }
  shake(6);
  pendingCards = null;
  cardRects = [null, null, null];
}

function updateWave(dt) {
  // Card pick blocks the wave from starting — perk first, then countdown.
  if (pendingCards) return;
  if (intermission > 0) {
    intermission -= dt;
    if (intermission <= 0) {
      intermission = 0;
      beginNextWave();
    }
    return;
  }
  // spawn remaining zombies for this wave (boss waves spawn 0)
  if (waveZombiesToSpawn > 0) {
    waveSpawnTimer -= dt;
    while (waveSpawnTimer <= 0 && waveZombiesToSpawn > 0) {
      spawnZombie();
      waveZombiesToSpawn--;
      waveSpawnTimer += Math.max(0.16, 0.85 - wave * 0.013);
    }
  } else if (zombies.length === 0 && wave > 0) {
    endCurrentWave();
  }
}

function tryShoot(nowSec) {
  const w = WEAPONS[player.weapon] || WEAPONS.pistol;
  const fr = player.fireRate * w.fireRate * (player.buffs.rapid > 0 ? 2 : 1);
  const interval = 1 / fr;
  if (nowSec - player.lastShot < interval) return;
  player.lastShot = nowSec;

  const dx = mouse.x - player.x, dy = mouse.y - player.y;
  const baseAng = Math.atan2(dy, dx);
  const extra = player.buffs.triple > 0 ? 2 : 0;          // triple buff = +2 spread shots
  // Multishot perk: rolls once per trigger pull to add a bonus shot.
  let shots = w.shots + extra;
  if (player.special.multishot && Math.random() < player.special.multishot) shots += 1;
  const spread = w.spread + (extra > 0 ? 0.16 : 0);

  // Base per-bullet damage, modified by glass-cannon + berserk perks.
  let dmgBase = player.damage * w.damage;
  dmgBase *= 1 + (player.special.glassCannon || 0);
  if (player.special.berserk && player.hp / player.maxHp < 0.3) {
    dmgBase *= 1 + player.special.berserk;
  }
  const bSpeed = player.bulletSpeed * w.bulletSpeed;
  const pierce = w.pierce + player.pierce;

  const muzzleX = player.x + Math.cos(baseAng) * (player.r + 8);
  const muzzleY = player.y + Math.sin(baseAng) * (player.r + 8);
  muzzleFlash(muzzleX, muzzleY, baseAng);
  for (let i = 0; i < shots; i++) {
    const a = baseAng + (shots > 1 ? (i - (shots - 1) / 2) * spread : 0);
    // Crit rolls per-bullet so a single trigger pull can mix crit + normal hits.
    const isCrit = !!(player.special.crit && Math.random() < player.special.crit);
    const dmg = isCrit ? dmgBase * 2 : dmgBase;
    bullets.push({
      x: player.x + Math.cos(a) * (player.r + 4),
      y: player.y + Math.sin(a) * (player.r + 4),
      vx: Math.cos(a) * bSpeed,
      vy: Math.sin(a) * bSpeed,
      damage: dmg, pierce,
      hits: new Set(),
      life: w.life,
      color: isCrit ? '#fff5a8' : w.color,
      explosive: !!w.explosive,
      blastR: w.blastR || 0,
      blastDmg: w.blastDmg || 0,
      bulletKind: w.bulletKind || null,
      bounces: w.bounces || 0,
      leavesSlick: !!w.leavesSlick,
      spawnChicks: w.spawnChicks || 0,
      isCrit,
    });
  }
}

function explode(x, y, radius, dmg) {
  // damage zombies in radius
  for (let j = zombies.length - 1; j >= 0; j--) {
    const z = zombies[j];
    const dx = z.x - x, dy = z.y - y;
    if (dx*dx + dy*dy < radius * radius) {
      const dmgDealt = Math.min(dmg, z.hp);
      z.hp -= dmg;
      if (player.special.lifesteal) {
        player.hp = Math.min(player.maxHp, player.hp + dmgDealt * player.special.lifesteal);
      }
      if (player.special.slow) {
        z.slowTimer = Math.max(z.slowTimer || 0, player.special.slow);
      }
      if (z.hp <= 0) {
        kills++;
        spawnDeathParticles(z.x, z.y, z.color);
        addBlood(z.x, z.y, z.isBoss ? 2 : 1);
        dropCoinsFor(z);
        tryDropGun(z);
        tryDropPickup(z);
        if (player.special.vampire) {
          player.hp = Math.min(player.maxHp, player.hp + player.special.vampire);
        }
        if (z.isBoss) spawnBossChest(z.x, z.y);
        zombies.splice(j, 1);
      }
    }
  }
  for (let i = 0; i < 24; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 120 + Math.random() * 220;
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.5 + Math.random()*0.3, color: '#ff8040' });
  }
  shake(14);
}

function detonateNuke(x, y) {
  for (const z of zombies) {
    kills++;
    spawnDeathParticles(z.x, z.y, z.color);
    addBlood(z.x, z.y, z.isBoss ? 2 : 1);
    dropCoinsFor(z);
  }
  zombies.length = 0;
  for (let i = 0; i < 40; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 200 + Math.random() * 300;
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.6, color: '#ffd166' });
  }
  shake(20);
  flashRed = Math.max(flashRed, 0.25);
}

function spawnPickupAt(x, y, type) {
  const def = PICKUP_TYPES[type];
  if (!def) return;
  pickups.push({ x, y, type, life: 30 });
  dropBurst(x, y, def.color, 16);
}

function spawnRandomPickup() {
  const type = PICKUP_KEYS[Math.floor(Math.random() * PICKUP_KEYS.length)];
  for (let tries = 0; tries < 25; tries++) {
    const x = 80 + Math.random() * (W - 160);
    const y = 80 + Math.random() * (H - 160);
    if (x > shop.x - 20 && x < shop.x + shop.w + 20 &&
        y > shop.y - 20 && y < shop.y + shop.h + 20) continue;
    if (Math.hypot(x - player.x, y - player.y) < 140) continue;
    spawnPickupAt(x, y, type);
    return;
  }
}

function tryDropPickup(z) {
  let chance = 0;
  if (z.isBoss)            chance = 1.0;
  else if (z.type === 'tank') chance = 0.18;
  else if (z.type === 'fast') chance = 0.09;
  else                     chance = 0.05;
  if (Math.random() >= chance) return;
  const type = PICKUP_KEYS[Math.floor(Math.random() * PICKUP_KEYS.length)];
  spawnPickupAt(z.x, z.y, type);
}

function updatePickups(dt) {
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    p.life -= dt;
    if (p.life <= 0) { pickups.splice(i, 1); continue; }
    const def = PICKUP_TYPES[p.type];
    const dx = player.x - p.x, dy = player.y - p.y;
    if (dx*dx + dy*dy < (player.r + 14) * (player.r + 14)) {
      def.apply();
      for (let k = 0; k < 18; k++) {
        const a = Math.random() * Math.PI * 2;
        const s = 100 + Math.random() * 200;
        particles.push({ x: p.x, y: p.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.55, color: def.color });
      }
      pickups.splice(i, 1);
    }
  }
}

function dropGunAt(x, y, weapon, life) {
  guns.push({ x, y, weapon, life });
  dropBurst(x, y, WEAPONS[weapon].color, 16);
}

// Boss-defeat chest. Spawned when a boss dies; opens on contact and grants
// a random permanent upgrade for free.
function spawnBossChest(x, y) {
  chests.push({ x, y });
  dropBurst(x, y, '#ffd166', 28);
  shake(6);
}

function openChest(c) {
  const perms = upgrades.filter(u => u.type === 'perm');
  const pick = perms[Math.floor(Math.random() * perms.length)];
  pick.buy(); // applies effect AND bumps cost — consistent with shop purchases
  floaters.push({ x: c.x, y: c.y - 8, text: pick.name + '  (FREE)', life: 2.4, color: '#ffe066' });
  // celebratory burst
  for (let i = 0; i < 36; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 120 + Math.random() * 240;
    particles.push({ x: c.x, y: c.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.7 + Math.random()*0.4, color: i % 2 ? '#ffd166' : '#fff5b8' });
  }
  shake(10);
  flashRed = Math.max(flashRed, 0); // intentionally no red flash for a reward
}

function updateChests(dt) {
  for (let i = chests.length - 1; i >= 0; i--) {
    const c = chests[i];
    const dx = player.x - c.x, dy = player.y - c.y;
    if (dx*dx + dy*dy < (player.r + 16) * (player.r + 16)) {
      openChest(c);
      chests.splice(i, 1);
    }
  }
}

function updateFloaters(dt) {
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.life -= dt;
    f.y -= 28 * dt;
    if (f.life <= 0) floaters.splice(i, 1);
  }
}

function tryDropGun(z) {
  // bosses always drop, tanks have higher chance, regulars rare
  let chance = 0;
  if (z.isBoss)            chance = 1.0;
  else if (z.type === 'tank') chance = 0.10;
  else if (z.type === 'fast') chance = 0.02;
  else                     chance = 0.012;
  if (Math.random() >= chance) return;
  const weapon = DROPPABLE_WEAPONS[Math.floor(Math.random() * DROPPABLE_WEAPONS.length)];
  dropGunAt(z.x, z.y, weapon, 22);
}

function updatePlayer(dt) {
  let dx = 0, dy = 0;
  if (keys['KeyW'] || keys['ArrowUp'])    dy -= 1;
  if (keys['KeyS'] || keys['ArrowDown'])  dy += 1;
  if (keys['KeyA'] || keys['ArrowLeft'])  dx -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) dx += 1;
  const len = Math.hypot(dx, dy);
  if (len > 0) { dx /= len; dy /= len; }
  const sp = player.speed * (player.buffs.fast > 0 ? 1.5 : 1);
  player.x = Math.max(player.r, Math.min(W - player.r, player.x + dx * sp * dt));
  player.y = Math.max(player.r, Math.min(H - player.r, player.y + dy * sp * dt));

  if (player.invuln > 0) player.invuln -= dt;

  for (const k in player.buffs) {
    if (k === 'shield') continue;
    if (player.buffs[k] > 0) {
      player.buffs[k] -= dt;
      if (player.buffs[k] < 0) player.buffs[k] = 0;
    }
  }

  // Regen perk — passive HP recovery
  if (player.special.regen) {
    player.hp = Math.min(player.maxHp, player.hp + player.special.regen * dt);
  }
}

function zombieCanEnter(x, y, r) {
  return !(x + r > shop.x && x - r < shop.x + shop.w
        && y + r > shop.y && y - r < shop.y + shop.h);
}

function updateZombies(dt) {
  for (let i = zombies.length - 1; i >= 0; i--) {
    const z = zombies[i];
    const dx = player.x - z.x, dy = player.y - z.y;
    const d = Math.hypot(dx, dy) || 1;
    // banana slicks slow whoever's on top of them
    let speedMul = 1;
    for (const s of slicks) {
      const sx = z.x - s.x, sy = z.y - s.y;
      if (sx*sx + sy*sy < s.r * s.r) { speedMul = 0.35; break; }
    }
    // cold-bullets slow timer
    if (z.slowTimer && z.slowTimer > 0) {
      z.slowTimer -= dt;
      speedMul = Math.min(speedMul, 0.45);
    }
    const effSpeed = z.speed * speedMul;
    const nx = z.x + (dx / d) * effSpeed * dt;
    const ny = z.y + (dy / d) * effSpeed * dt;
    if (zombieCanEnter(nx, z.y, z.r)) z.x = nx;
    if (zombieCanEnter(z.x, ny, z.r)) z.y = ny;

    // boss periodically summons minions
    if (z.isBoss) {
      z.minionTimer -= dt;
      if (z.minionTimer <= 0) {
        z.minionTimer = 4 + Math.random() * 2;
        spawnBossMinions(z, 3);
      }
    }

    // contact damage to player + thorns retaliation
    const rr = z.r + player.r;
    const inContact = dx*dx + dy*dy < rr*rr;
    if (inContact && player.invuln <= 0 && !godMode) {
      if (player.buffs.shield > 0) {
        player.buffs.shield = 0;
        const knock = 12 / d;
        player.x -= dx * knock;
        player.y -= dy * knock;
        player.invuln = 0.6;
        shake(8);
      } else {
        player.hp -= z.damage * dt;
        flashRed = Math.max(flashRed, Math.min(0.35, z.damage * dt * 0.03));
      }
    }
    // Thorns hits any zombie touching the player, even through invuln/shield.
    if (inContact && player.special.thorns) {
      z.hp -= player.special.thorns * dt;
      if (z.hp <= 0) {
        kills++;
        spawnDeathParticles(z.x, z.y, z.color);
        addBlood(z.x, z.y, z.isBoss ? 2 : 1);
        dropCoinsFor(z);
        tryDropGun(z);
        tryDropPickup(z);
        if (player.special.vampire) {
          player.hp = Math.min(player.maxHp, player.hp + player.special.vampire);
        }
        if (z.isBoss) spawnBossChest(z.x, z.y);
        zombies.splice(i, 1);
        continue;
      }
    }
  }
}

function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    // homing chicks adjust velocity toward nearest zombie
    if (b.homing) {
      let near = null, bd2 = Infinity;
      for (const z of zombies) {
        const dx = z.x - b.x, dy = z.y - b.y;
        const d2 = dx*dx + dy*dy;
        if (d2 < bd2) { bd2 = d2; near = z; }
      }
      if (near) {
        const tgtA = Math.atan2(near.y - b.y, near.x - b.x);
        const curA = Math.atan2(b.vy, b.vx);
        let da = tgtA - curA;
        while (da >  Math.PI) da -= Math.PI*2;
        while (da < -Math.PI) da += Math.PI*2;
        const turn = Math.sign(da) * Math.min(Math.abs(da), 9 * dt);
        const newA = curA + turn;
        const sp = Math.hypot(b.vx, b.vy);
        b.vx = Math.cos(newA) * sp;
        b.vy = Math.sin(newA) * sp;
      }
    }
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;
    if (b.life <= 0 || b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) {
      // banana drops a slick where it dies
      if (b.leavesSlick && b.x > 0 && b.x < W && b.y > 0 && b.y < H) addSlick(b.x, b.y);
      bullets.splice(i, 1);
      continue;
    }
    let consumed = false;
    for (let j = zombies.length - 1; j >= 0; j--) {
      const z = zombies[j];
      if (b.hits.has(z)) continue;
      const dx = z.x - b.x, dy = z.y - b.y;
      const rr = z.r + 3;
      if (dx*dx + dy*dy < rr*rr) {
        if (b.explosive) {
          explode(b.x, b.y, b.blastR, b.damage + b.blastDmg);
          if (b.spawnChicks > 0) spawnChicks(b.x, b.y, b.spawnChicks, b.damage * 0.5);
          consumed = true;
          break;
        }
        const dmgDealt = Math.min(b.damage, z.hp);
        z.hp -= b.damage;
        b.hits.add(z);
        // lifesteal — heal a fraction of damage actually dealt
        if (player.special.lifesteal) {
          player.hp = Math.min(player.maxHp, player.hp + dmgDealt * player.special.lifesteal);
        }
        // cold bullets — slow the target briefly
        if (player.special.slow) {
          z.slowTimer = Math.max(z.slowTimer || 0, player.special.slow);
        }
        if (z.hp <= 0) {
          kills++;
          spawnDeathParticles(z.x, z.y, z.color);
          addBlood(z.x, z.y, z.isBoss ? 2 : 1);
          dropCoinsFor(z);
          tryDropGun(z);
          tryDropPickup(z);
          if (player.special.vampire) {
            player.hp = Math.min(player.maxHp, player.hp + player.special.vampire);
          }
          if (z.isBoss) { shake(18); spawnBossChest(z.x, z.y); }
          zombies.splice(j, 1);
        }
        // rubber duck: bounce off the zombie instead of being consumed
        if (b.bounces > 0) {
          b.bounces--;
          b.damage *= 0.75;
          b.hits.clear();
          const sp = Math.hypot(b.vx, b.vy);
          const newA = Math.atan2(b.vy, b.vx) + (Math.random() - 0.5) * 1.8 + Math.PI; // mostly reversed + scatter
          b.vx = Math.cos(newA) * sp;
          b.vy = Math.sin(newA) * sp;
          // tiny squeak puff
          for (let k = 0; k < 5; k++) {
            const a = Math.random() * Math.PI * 2;
            const s = 60 + Math.random() * 120;
            particles.push({ x: b.x, y: b.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.3, color: '#fff5b8' });
          }
          break;
        }
        // banana: leave a slick where it lands
        if (b.leavesSlick) {
          addSlick(b.x, b.y);
        }
        if (b.pierce <= 0) { consumed = true; break; }
        b.pierce--;
      }
    }
    if (consumed) bullets.splice(i, 1);
  }
}

function addSlick(x, y) {
  slicks.push({ x, y, r: 24, life: 8, max: 8, ang: Math.random() * Math.PI * 2 });
}

function updateSlicks(dt) {
  for (let i = slicks.length - 1; i >= 0; i--) {
    slicks[i].life -= dt;
    if (slicks[i].life <= 0) slicks.splice(i, 1);
  }
}

// Used by the Chicken Launcher: small homing chicks scatter from the explosion.
function spawnChicks(x, y, n, dmg) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 260 + Math.random() * 120;
    bullets.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      damage: Math.max(4, dmg),
      pierce: 0,
      hits: new Set(),
      life: 0.9,
      color: '#fff5b8',
      explosive: false,
      blastR: 0,
      blastDmg: 0,
      bulletKind: 'chick',
      homing: true,
      bounces: 0,
      leavesSlick: false,
      spawnChicks: 0,
    });
  }
  // burst of feathers
  for (let i = 0; i < 24; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 60 + Math.random() * 200;
    particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 0.7 + Math.random()*0.4, color: i % 2 ? '#fff5b8' : '#ffe066' });
  }
}

function updateGuns(dt) {
  nearbyGun = null;
  let bestD2 = 50 * 50; // hover radius
  for (let i = guns.length - 1; i >= 0; i--) {
    const g = guns[i];
    g.life -= dt;
    if (g.life <= 0) { guns.splice(i, 1); continue; }
    const dx = player.x - g.x, dy = player.y - g.y;
    const d2 = dx*dx + dy*dy;
    if (d2 < bestD2) { nearbyGun = g; bestD2 = d2; }
  }
}

function doSwapWeapon() {
  if (!nearbyGun || nearbyGun.weapon === player.weapon) return;
  const old = player.weapon;
  const gx = nearbyGun.x, gy = nearbyGun.y;
  const newCol = WEAPONS[nearbyGun.weapon].color;
  player.weapon = nearbyGun.weapon;
  const idx = guns.indexOf(nearbyGun);
  if (idx >= 0) guns.splice(idx, 1);
  // drop old weapon at the player's feet (skip pistol — it's infinite ammo default)
  if (old !== 'pistol') {
    dropGunAt(player.x, player.y, old, 30);
  }
  for (let k = 0; k < 16; k++) {
    const a = Math.random() * Math.PI * 2;
    const s = 80 + Math.random() * 160;
    particles.push({ x: gx, y: gy, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.5, color: newCol });
  }
  nearbyGun = null;
}

function updateCrates(dt) {
  for (let i = crates.length - 1; i >= 0; i--) {
    const cr = crates[i];
    const dx = player.x - cr.x, dy = player.y - cr.y;
    if (dx*dx + dy*dy < (player.r + 14) * (player.r + 14)) {
      player.money += cr.value;
      for (let k = 0; k < 14; k++) {
        const a = Math.random() * Math.PI * 2;
        const s = 80 + Math.random() * 180;
        particles.push({ x: cr.x, y: cr.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.6, color: '#ffce44' });
      }
      crates.splice(i, 1);
    }
  }
}

function spawnMoneyCrate() {
  for (let tries = 0; tries < 25; tries++) {
    const x = 80 + Math.random() * (W - 160);
    const y = 80 + Math.random() * (H - 160);
    if (x > shop.x - 20 && x < shop.x + shop.w + 20 &&
        y > shop.y - 20 && y < shop.y + shop.h + 20) continue;
    if (Math.hypot(x - player.x, y - player.y) < 160) continue;
    crates.push({ x, y, value: 20 + Math.floor(Math.random() * 30) + Math.floor(wave * 1.5) });
    dropBurst(x, y, '#ffce44', 18);
    return;
  }
}

function updateCoins(dt) {
  for (let i = coins.length - 1; i >= 0; i--) {
    const k = coins[i];
    // friction
    const f = Math.pow(0.001, dt);
    k.vx *= f; k.vy *= f;
    k.x += k.vx * dt;
    k.y += k.vy * dt;
    k.life -= dt;

    const dx = player.x - k.x, dy = player.y - k.y;
    const d = Math.hypot(dx, dy);
    const magnetR = 80 * (1 + (player.special.magnet || 0));
    if (d < magnetR) {
      // magnetize
      const pull = 280;
      k.x += (dx / d) * pull * dt;
      k.y += (dy / d) * pull * dt;
    }
    if (d < player.r + 5) {
      player.money += k.value;
      coins.splice(i, 1);
    } else if (k.life <= 0) {
      coins.splice(i, 1);
    }
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= Math.pow(0.01, dt);
    p.vy *= Math.pow(0.01, dt);
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function checkDeath() {
  if (player.hp > 0) return;

  deaths++;
  bestKills = Math.max(bestKills, kills);

  // drop weapon (pistol is infinite default, not a real drop)
  if (player.weapon !== 'pistol') {
    dropGunAt(player.x, player.y, player.weapon, 60);
    player.weapon = 'pistol';
  }
  // drop money as a small shower of coins
  const drop = player.money;
  player.money = 0;
  if (drop > 0) {
    dropBurst(player.x, player.y, '#ffce44', 12);
    const n = Math.min(20, Math.max(4, Math.ceil(drop / 10)));
    const per = Math.max(1, Math.round(drop / n));
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 60 + Math.random() * 140;
      coins.push({ x: player.x, y: player.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, value: per, life: 60 });
    }
  }
  addBlood(player.x, player.y, 1.4);

  // reset player state
  player.hp = player.maxHp;
  player.x = SPAWN.x; player.y = SPAWN.y;
  for (const k in player.buffs) player.buffs[k] = 0;
  player.invuln = 2.0;

  // visual feedback
  shake(28);
  flashRed = 0.85;

  // restart the current wave from the beginning
  zombies.length = 0;
  bullets.length = 0;
  if (wave > 0) {
    if (isBossWave) {
      spawnBoss();
      waveZombiesToSpawn = 0;
    } else {
      waveZombiesToSpawn = 5 + Math.floor(wave * 1.8);
      waveSpawnTimer = 1.0;
    }
  }
}

function hardReset() {
  player.x = SPAWN.x; player.y = SPAWN.y;
  player.hp = player.maxHp = 100;
  player.money = 0;
  player.speed = 220;
  player.damage = 10;
  player.fireRate = 4;
  player.bulletSpeed = 700;
  player.pierce = 0;
  player.invuln = 0;
  player.lastShot = 0;
  for (const k in player.buffs) player.buffs[k] = 0;
  player.special = {};
  player.specialLevels = {};
  pendingCards = null;
  cardRects = [null, null, null];
  bullets.length = 0;
  zombies.length = 0;
  coins.length = 0;
  particles.length = 0;
  guns.length = 0;
  crates.length = 0;
  pickups.length = 0;
  slicks.length = 0;
  chests.length = 0;
  floaters.length = 0;
  decals.length = 0;
  shakeAmt = 0; flashRed = 0; nearbyGun = null;
  player.weapon = 'pistol';
  kills = 0; deaths = 0; bestKills = 0; bestWave = 0;
  gameTime = 0;
  wave = 0; isBossWave = false; waveZombiesToSpawn = 0;
  waveSpawnTimer = 0; intermission = 3;
  // restore upgrade costs
  const base = [25, 35, 45, 55, 90, 18, 28, 32, 70];
  upgrades.forEach((u, i) => u.cost = base[i]);
}

// ---------- Render ----------
function render() {
  ctx.clearRect(0, 0, W, H);

  // screen shake offsets the world layer
  const sx = shakeAmt > 0 ? (Math.random() - 0.5) * shakeAmt : 0;
  const sy = shakeAmt > 0 ? (Math.random() - 0.5) * shakeAmt : 0;
  ctx.save();
  ctx.translate(sx, sy);

  // floor grid
  ctx.strokeStyle = '#181a22';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) {
    ctx.beginPath(); ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); ctx.stroke();
  }

  // blood decals (between grid and entities so zombies walk over them)
  for (const d of decals) {
    const a = Math.max(0, Math.min(1, d.life / (d.max || 12)));
    ctx.globalAlpha = a;
    ctx.fillStyle = d.color;
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // banana slicks
  for (const s of slicks) {
    const a = Math.min(1, s.life / 2);
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.ang);
    ctx.globalAlpha = a * 0.85;
    // smear underlayer (slippery sheen)
    ctx.fillStyle = '#ffe98a';
    ctx.beginPath(); ctx.ellipse(0, 0, s.r * 0.95, s.r * 0.55, 0, 0, Math.PI*2); ctx.fill();
    // banana peel shape on top
    ctx.fillStyle = '#ffd942';
    ctx.beginPath();
    ctx.moveTo(-s.r * 0.9, 2);
    ctx.quadraticCurveTo(-s.r * 0.4, -s.r * 0.55, s.r * 0.5, -s.r * 0.3);
    ctx.quadraticCurveTo(s.r * 0.95, 0, s.r * 0.45, s.r * 0.4);
    ctx.quadraticCurveTo(-s.r * 0.4, s.r * 0.55, -s.r * 0.9, 2);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#a07e1c';
    ctx.lineWidth = 1;
    ctx.stroke();
    // little stem
    ctx.fillStyle = '#6a4a0a';
    ctx.fillRect(s.r * 0.55, -3, 4, 3);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // shop zone
  ctx.fillStyle = 'rgba(96, 140, 220, 0.10)';
  ctx.fillRect(shop.x, shop.y, shop.w, shop.h);
  ctx.strokeStyle = '#5a87c4';
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 6]);
  ctx.strokeRect(shop.x, shop.y, shop.w, shop.h);
  ctx.setLineDash([]);
  ctx.fillStyle = '#88aadd';
  ctx.font = 'bold 14px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('SHOP', shop.x + shop.w / 2, shop.y - 8);

  // coins
  for (const k of coins) {
    const a = Math.min(1, k.life / 2);
    const bob = Math.sin(gameTime * 5 + k.x * 0.17) * 0.9;
    const cy = k.y + bob;
    ctx.globalAlpha = a;
    // soft outer glow
    const glow = ctx.createRadialGradient(k.x, cy, 1, k.x, cy, 11);
    glow.addColorStop(0, 'rgba(255, 224, 110, 0.55)');
    glow.addColorStop(1, 'rgba(255, 206, 68, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(k.x, cy, 11, 0, Math.PI*2); ctx.fill();
    // body gradient (top light → bottom dark gives a metallic feel)
    const body = ctx.createRadialGradient(k.x - 1.5, cy - 2, 0.5, k.x, cy, 5);
    body.addColorStop(0, '#fff2a8');
    body.addColorStop(0.6, '#ffce44');
    body.addColorStop(1, '#c69a1a');
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.arc(k.x, cy, 5, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#8a6c12';
    ctx.lineWidth = 1;
    ctx.stroke();
    // $ engraving
    ctx.fillStyle = '#5c4408';
    ctx.font = 'bold 7px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('$', k.x, cy + 2.5);
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
  }

  // particles
  for (const p of particles) {
    const a = Math.max(0, Math.min(1, p.life * 2));
    ctx.fillStyle = p.color;
    ctx.globalAlpha = a;
    ctx.beginPath(); ctx.arc(p.x, p.y, 2.5, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // zombies
  for (const z of zombies) {
    if (z.isBoss) {
      // pulsing aura
      const pulse = 1 + Math.sin(gameTime * 4) * 0.08;
      const grad = ctx.createRadialGradient(z.x, z.y, z.r * 0.6, z.x, z.y, z.r * 2.2 * pulse);
      grad.addColorStop(0, 'rgba(255, 60, 60, 0.35)');
      grad.addColorStop(1, 'rgba(255, 60, 60, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(z.x, z.y, z.r * 2.2 * pulse, 0, Math.PI*2); ctx.fill();
      // body
      ctx.fillStyle = z.color;
      ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, Math.PI*2); ctx.fill();
      // dark core
      ctx.fillStyle = '#3a0f0f';
      ctx.beginPath(); ctx.arc(z.x, z.y, z.r * 0.55, 0, Math.PI*2); ctx.fill();
      // glowing eyes
      ctx.fillStyle = '#ff5050';
      const eo = z.r * 0.35;
      ctx.beginPath(); ctx.arc(z.x - eo, z.y - eo*0.3, 4, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(z.x + eo, z.y - eo*0.3, 4, 0, Math.PI*2); ctx.fill();
    } else {
      ctx.fillStyle = z.color;
      ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#1a1a1a';
      const eo = z.r * 0.3;
      ctx.beginPath(); ctx.arc(z.x - eo, z.y - eo*0.3, 1.5, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(z.x + eo, z.y - eo*0.3, 1.5, 0, Math.PI*2); ctx.fill();
      if (z.hp < z.hpMax) {
        const bw = z.r * 2;
        ctx.fillStyle = '#222';
        ctx.fillRect(z.x - bw/2, z.y - z.r - 7, bw, 3);
        ctx.fillStyle = '#d24';
        ctx.fillRect(z.x - bw/2, z.y - z.r - 7, bw * (z.hp / z.hpMax), 3);
      }
    }
  }

  // bullets
  for (const b of bullets) {
    drawBullet(b);
  }

  // money crates
  for (const cr of crates) {
    const bob = Math.sin(gameTime * 3 + cr.x) * 2;
    const cy = cr.y + bob;
    // aura
    const aura = ctx.createRadialGradient(cr.x, cy, 4, cr.x, cy, 30);
    aura.addColorStop(0, 'rgba(255, 206, 68, 0.55)');
    aura.addColorStop(1, 'rgba(255, 206, 68, 0)');
    ctx.fillStyle = aura;
    ctx.beginPath(); ctx.arc(cr.x, cy, 30, 0, Math.PI*2); ctx.fill();
    // wooden frame
    ctx.fillStyle = '#5a3a14';
    ctx.fillRect(cr.x - 14, cy - 12, 28, 24);
    ctx.strokeStyle = '#2a1808';
    ctx.lineWidth = 1;
    ctx.strokeRect(cr.x - 14, cy - 12, 28, 24);
    // gold face with subtle vertical gradient
    const face = ctx.createLinearGradient(cr.x, cy - 10, cr.x, cy + 10);
    face.addColorStop(0, '#ffe98a');
    face.addColorStop(1, '#d6a020');
    ctx.fillStyle = face;
    ctx.fillRect(cr.x - 12, cy - 10, 24, 20);
    ctx.strokeStyle = '#a07e1c';
    ctx.strokeRect(cr.x - 12, cy - 10, 24, 20);
    // coin stack icon on top of crate
    for (let i = 0; i < 3; i++) {
      const sy = cy - 14 - i * 2;
      ctx.fillStyle = '#ffce44';
      ctx.beginPath(); ctx.ellipse(cr.x, sy, 5, 1.6, 0, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#8a6c12';
      ctx.lineWidth = 0.8;
      ctx.stroke();
    }
    // $ engraving on face
    ctx.fillStyle = '#3a2810';
    ctx.font = 'bold 14px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('$', cr.x, cy + 5);
    ctx.textAlign = 'left';
  }

  // boss-defeat chests
  for (const c of chests) {
    const bob = Math.sin(gameTime * 2.4 + c.x * 0.07) * 1.6;
    const pulse = 1 + Math.sin(gameTime * 5) * 0.12;
    const cy = c.y + bob;
    // strong aura — this is a big reward
    const aura = ctx.createRadialGradient(c.x, cy, 4, c.x, cy, 44 * pulse);
    aura.addColorStop(0, 'rgba(255, 220, 110, 0.6)');
    aura.addColorStop(1, 'rgba(255, 220, 110, 0)');
    ctx.fillStyle = aura;
    ctx.beginPath(); ctx.arc(c.x, cy, 44 * pulse, 0, Math.PI*2); ctx.fill();
    // wooden chest base
    ctx.fillStyle = '#5a3a14';
    ctx.fillRect(c.x - 18, cy - 6, 36, 18);
    ctx.strokeStyle = '#2a1808';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(c.x - 18, cy - 6, 36, 18);
    // lid (rounded)
    ctx.fillStyle = '#7a4e1c';
    ctx.beginPath();
    ctx.moveTo(c.x - 18, cy - 4);
    ctx.quadraticCurveTo(c.x, cy - 16, c.x + 18, cy - 4);
    ctx.lineTo(c.x + 18, cy);
    ctx.lineTo(c.x - 18, cy);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // gold bands
    ctx.fillStyle = '#ffce44';
    ctx.fillRect(c.x - 18, cy - 1, 36, 2);
    ctx.fillRect(c.x - 18, cy + 9, 36, 2);
    // gold lock
    ctx.fillStyle = '#ffe066';
    ctx.fillRect(c.x - 4, cy + 2, 8, 6);
    ctx.strokeStyle = '#8a6c12';
    ctx.lineWidth = 1;
    ctx.strokeRect(c.x - 4, cy + 2, 8, 6);
    // keyhole
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.arc(c.x, cy + 4.5, 1, 0, Math.PI*2); ctx.fill();
    // little sparkle on the lid
    ctx.fillStyle = '#fff5b8';
    const sx = c.x - 6 + Math.sin(gameTime * 2) * 2;
    const sy2 = cy - 8 + Math.cos(gameTime * 2) * 1;
    ctx.beginPath(); ctx.arc(sx, sy2, 1.6, 0, Math.PI*2); ctx.fill();
  }

  // gun pickups
  for (const g of guns) {
    const w = WEAPONS[g.weapon];
    const flash = g.life < 5 && Math.floor(g.life * 6) % 2 === 0;
    const bob = Math.sin(gameTime * 3 + g.x) * 2;
    const highlighted = g === nearbyGun;
    const cy = g.y + bob;
    // aura
    const auraR = highlighted ? 36 : 28;
    const aura = ctx.createRadialGradient(g.x, cy, 4, g.x, cy, auraR);
    aura.addColorStop(0, w.color + 'cc');
    aura.addColorStop(1, w.color + '00');
    ctx.fillStyle = aura;
    ctx.beginPath(); ctx.arc(g.x, cy, auraR, 0, Math.PI*2); ctx.fill();
    // crate-style box
    const bw = 30, bh = 28;
    ctx.fillStyle = flash ? '#fff' : w.color;
    ctx.fillRect(g.x - bw/2, cy - bh/2, bw, bh);
    ctx.strokeStyle = highlighted ? '#fff' : '#1a1a1a';
    ctx.lineWidth = highlighted ? 3 : 2;
    ctx.strokeRect(g.x - bw/2, cy - bh/2, bw, bh);
    // inner darker rim for depth
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 1;
    ctx.strokeRect(g.x - bw/2 + 3, cy - bh/2 + 3, bw - 6, bh - 6);
    // gun silhouette (drawn horizontally, slightly left of center so it fits)
    ctx.save();
    ctx.translate(g.x - 8, cy);
    drawGun(g.weapon, 7);
    ctx.restore();
    // small tag chip in the bottom-right corner
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(g.x + bw/2 - 10, cy + bh/2 - 9, 9, 8);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 8px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(w.tag, g.x + bw/2 - 5.5, cy + bh/2 - 2);
    ctx.textAlign = 'left';
  }

  // random pickups
  for (const p of pickups) {
    const def = PICKUP_TYPES[p.type];
    const flash = p.life < 5 && Math.floor(p.life * 6) % 2 === 0;
    const bob = Math.sin(gameTime * 3.4 + p.x * 0.13) * 2.5;
    const pulse = 1 + Math.sin(gameTime * 4 + p.x) * 0.08;
    const cy = p.y + bob;
    // aura
    const auraR = 24 * pulse;
    const aura = ctx.createRadialGradient(p.x, cy, 3, p.x, cy, auraR);
    aura.addColorStop(0, def.color + 'cc');
    aura.addColorStop(1, def.color + '00');
    ctx.fillStyle = aura;
    ctx.beginPath(); ctx.arc(p.x, cy, auraR, 0, Math.PI*2); ctx.fill();
    // base disc
    ctx.fillStyle = flash ? '#fff' : def.color;
    ctx.beginPath(); ctx.arc(p.x, cy, 12, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = 2;
    ctx.stroke();
    // inner highlight crescent (top-left) for a glassy/coin look
    ctx.save();
    ctx.beginPath(); ctx.arc(p.x, cy, 12, 0, Math.PI*2); ctx.clip();
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(p.x - 4, cy - 4, 7, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    // type-specific icon on top
    drawPickupIcon(p.type, p.x, cy, 9);
  }

  // player
  if (player.invuln > 0 && Math.floor(player.invuln * 12) % 2 === 0) {
    // flicker — skip drawing
  } else {
    const dx = mouse.x - player.x, dy = mouse.y - player.y;
    const m = Math.hypot(dx, dy) || 1;
    const cosA = dx / m, sinA = dy / m;
    const facing = Math.atan2(dy, dx);

    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.32)';
    ctx.beginPath();
    ctx.ellipse(player.x, player.y + player.r * 0.55, player.r * 0.78, player.r * 0.28, 0, 0, Math.PI*2);
    ctx.fill();

    // shield ring
    if (player.buffs.shield > 0) {
      ctx.strokeStyle = '#7ec8ff';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(player.x, player.y, player.r + 6, 0, Math.PI*2); ctx.stroke();
    }

    // body
    ctx.fillStyle = '#ebebef';
    ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#2c2c34';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // eyes facing mouse
    const eyeOff = player.r * 0.36;
    const eyeFwd = player.r * 0.4;
    const ex = player.x + cosA * eyeFwd;
    const ey = player.y + sinA * eyeFwd;
    const epx = -sinA * eyeOff, epy = cosA * eyeOff;
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.arc(ex + epx, ey + epy, 1.8, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(ex - epx, ey - epy, 1.8, 0, Math.PI*2); ctx.fill();

    // gun held out front — model varies per weapon
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(facing);
    drawGun(player.weapon, player.r);
    ctx.restore();
  }

  // floating reward text (above everything in the world)
  for (const f of floaters) {
    const a = Math.max(0, Math.min(1, f.life / 1.2));
    ctx.font = 'bold 13px system-ui';
    ctx.textAlign = 'center';
    ctx.fillStyle = `rgba(0,0,0,${0.7 * a})`;
    ctx.fillText(f.text, f.x + 1, f.y + 1);
    ctx.fillStyle = f.color;
    ctx.globalAlpha = a;
    ctx.fillText(f.text, f.x, f.y);
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }

  // end world (shake) layer
  ctx.restore();

  // vignette — drawn over world, under HUD
  const vg = ctx.createRadialGradient(W/2, H/2, Math.min(W, H) * 0.42, W/2, H/2, Math.max(W, H) * 0.72);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  // red damage flash
  if (flashRed > 0) {
    ctx.fillStyle = `rgba(220, 24, 24, ${flashRed * 0.6})`;
    ctx.fillRect(0, 0, W, H);
  }

  // HUD
  drawHud();
  drawStats();
  drawWaveBanner();
  drawCheats();
  if (nearbyGun && nearbyGun.weapon !== player.weapon) drawSwapPrompt();
  if (inShop()) drawShop();
  drawCardPicker(); // sits on top of everything when active
}

function drawCheats() {
  // hidden until the player enters the unlock code
  if (!cheatsUnlocked) {
    cheatsHeaderRect = null;
    for (const c of cheats) c.rect = null;
    return;
  }
  const x = 14, y = 168;
  const w = 168, btnH = 24, header = 24;
  const h = cheatsOpen ? header + cheats.length * (btnH + 3) + 6 : header;
  ctx.fillStyle = 'rgba(8, 10, 16, 0.92)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = godMode ? '#8be08b' : '#5a87c4';
  ctx.lineWidth = 1;
  ctx.strokeRect(x, y, w, h);

  ctx.fillStyle = '#88aadd';
  ctx.font = 'bold 11px system-ui';
  ctx.textAlign = 'left';
  ctx.fillText('CHEATS', x + 10, y + 16);
  ctx.fillStyle = '#9aa0ab';
  ctx.textAlign = 'right';
  ctx.fillText(cheatsOpen ? '▾' : '▸', x + w - 10, y + 16);
  ctx.textAlign = 'left';

  cheatsHeaderRect = { x, y, w, h: header };

  if (!cheatsOpen) {
    for (const c of cheats) c.rect = null;
    return;
  }

  let by = y + header + 3;
  for (const c of cheats) {
    const isOn = c.toggle ? c.toggle() : false;
    const rect = { x: x + 8, y: by, w: w - 16, h: btnH };
    c.rect = rect;
    const hover = pointInRect(mouse, rect);
    ctx.fillStyle = isOn ? '#2e5a2e' : (hover ? '#262b36' : '#1c1f28');
    ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
    ctx.strokeStyle = isOn ? '#8be08b' : (hover ? '#7ec8ff' : '#33363f');
    ctx.lineWidth = 1;
    ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px system-ui';
    ctx.textAlign = 'center';
    const labelStr = typeof c.label === 'function' ? c.label() : c.label;
    ctx.fillText(
      c.toggle ? `${labelStr}: ${isOn ? 'ON' : 'OFF'}` : labelStr,
      rect.x + rect.w / 2, rect.y + 16);
    by += btnH + 3;
  }
  ctx.textAlign = 'left';
}

function drawSwapPrompt() {
  const cur = WEAPONS[player.weapon];
  const newW = WEAPONS[nearbyGun.weapon];
  const w = 480, h = 150;
  const x = (W - w) / 2, y = H - h - 24;
  ctx.fillStyle = 'rgba(10, 12, 18, 0.92)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = newW.color;
  ctx.lineWidth = 2;
  ctx.strokeRect(x, y, w, h);

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 13px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText('WEAPON FOUND', x + w / 2, y + 22);

  // current weapon (left)
  const drawSlot = (xs, ys, wpn, label, align) => {
    ctx.fillStyle = wpn.color;
    ctx.fillRect(xs, ys, 28, 28);
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = 1;
    ctx.strokeRect(xs, ys, 28, 28);
    ctx.fillStyle = '#1a1a1a';
    ctx.font = 'bold 15px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(wpn.tag, xs + 14, ys + 20);
    ctx.fillStyle = '#888c95';
    ctx.font = '10px system-ui';
    ctx.textAlign = align;
    ctx.fillText(label, align === 'left' ? xs : xs + 28, ys - 4);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px system-ui';
    ctx.fillText(wpn.name, align === 'left' ? xs + 36 : xs - 8, ys + 18);
  };
  drawSlot(x + 24, y + 50, cur, 'CURRENT', 'left');
  drawSlot(x + w - 24 - 28, y + 50, newW, 'NEW', 'right');

  // arrow
  ctx.fillStyle = '#7ec8ff';
  ctx.font = 'bold 22px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText('→', x + w / 2, y + 70);

  // stat compare row
  const stat = (k, a, b) => {
    const better = parseFloat(b) > parseFloat(a);
    const worse  = parseFloat(b) < parseFloat(a);
    return [k, a, b, better ? '#5cb85c' : worse ? '#d36' : '#fff'];
  };
  const rows = [
    stat('Dmg',    (player.damage * cur.damage).toFixed(1),                (player.damage * newW.damage).toFixed(1)),
    stat('Rate',   (player.fireRate * cur.fireRate).toFixed(2),            (player.fireRate * newW.fireRate).toFixed(2)),
    stat('Shots',  cur.shots,                                              newW.shots),
    stat('Pierce', cur.pierce + player.pierce,                             newW.pierce + player.pierce),
  ];
  ctx.font = '11px system-ui';
  let ly = y + 96;
  for (const [k, a, b, col] of rows) {
    ctx.fillStyle = '#888c95';
    ctx.textAlign = 'center';
    ctx.fillText(k, x + w / 2, ly);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'left';
    ctx.fillText(String(a), x + 80, ly);
    ctx.fillStyle = col;
    ctx.textAlign = 'right';
    ctx.fillText(String(b), x + w - 80, ly);
    ly += 13;
  }

  // swap button (positioned dynamically so click hit-test stays in sync)
  swapBtn.w = 130; swapBtn.h = 30;
  swapBtn.x = x + w - swapBtn.w - 14;
  swapBtn.y = y + h - swapBtn.h - 10;
  const hover = pointInRect(mouse, swapBtn);
  ctx.fillStyle = hover ? '#3a7a3a' : '#2a4a2a';
  ctx.fillRect(swapBtn.x, swapBtn.y, swapBtn.w, swapBtn.h);
  ctx.strokeStyle = hover ? '#8be08b' : '#5cb85c';
  ctx.lineWidth = 2;
  ctx.strokeRect(swapBtn.x, swapBtn.y, swapBtn.w, swapBtn.h);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 13px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText('[E] Swap', swapBtn.x + swapBtn.w / 2, swapBtn.y + 20);

  ctx.fillStyle = '#888c95';
  ctx.font = '11px system-ui';
  ctx.textAlign = 'left';
  ctx.fillText('walk away to keep current', x + 14, y + h - 18);

  ctx.textAlign = 'left';
}

function drawStats() {
  const w = WEAPONS[player.weapon] || WEAPONS.pistol;
  const pw = 190, ph = 168;
  const px = W - pw - 14, py = H - ph - 14;
  ctx.fillStyle = 'rgba(10, 12, 18, 0.88)';
  ctx.fillRect(px, py, pw, ph);
  ctx.strokeStyle = '#33363f';
  ctx.lineWidth = 1;
  ctx.strokeRect(px, py, pw, ph);

  // weapon swatch + name
  ctx.fillStyle = w.color;
  ctx.fillRect(px + 12, py + 12, 22, 22);
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 1;
  ctx.strokeRect(px + 12, py + 12, 22, 22);
  ctx.fillStyle = '#1a1a1a';
  ctx.font = 'bold 13px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText(w.tag, px + 23, py + 28);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 15px system-ui';
  ctx.textAlign = 'left';
  ctx.fillText(w.name, px + 44, py + 28);

  // divider
  ctx.fillStyle = '#22252e';
  ctx.fillRect(px + 12, py + 42, pw - 24, 1);

  const rows = [
    ['Damage',    (player.damage * w.damage).toFixed(1)],
    ['Fire Rate', (player.fireRate * w.fireRate).toFixed(1) + '/s'],
    ['Bullet Sp', Math.round(player.bulletSpeed * w.bulletSpeed)],
    ['Pierce',    w.pierce + player.pierce],
    ['Speed',     Math.round(player.speed)],
    ['Max HP',    player.maxHp],
  ];
  ctx.font = '12px system-ui';
  let ly = py + 60;
  for (const [k, v] of rows) {
    ctx.fillStyle = '#888c95';
    ctx.textAlign = 'left';
    ctx.fillText(k, px + 12, ly);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'right';
    ctx.fillText(String(v), px + pw - 12, ly);
    ly += 18;
  }
  ctx.textAlign = 'left';
}

function drawWaveBanner() {
  // Boss HP bar — shown whenever any boss is alive (covers cheat-spawned bosses too)
  {
    const boss = zombies.find(z => z.isBoss);
    if (boss) {
      const bw = 540, bh = 18;
      const bx = (W - bw) / 2, by = 14;
      ctx.fillStyle = 'rgba(20, 5, 5, 0.85)';
      ctx.fillRect(bx, by, bw, bh);
      ctx.fillStyle = '#ff3838';
      ctx.fillRect(bx, by, bw * Math.max(0, boss.hp) / boss.hpMax, bh);
      ctx.strokeStyle = '#ff8080';
      ctx.lineWidth = 2;
      ctx.strokeRect(bx, by, bw, bh);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 12px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText(`BOSS — WAVE ${wave}`, W / 2, by + 13);
      ctx.textAlign = 'left';
    }
  }
  // Intermission countdown — center of screen, big.
  // While a perk pick is pending, the card UI takes over this space, so skip it here.
  if (intermission > 0 && !pendingCards) {
    ctx.fillStyle = 'rgba(0,0,0,0.42)';
    const tw = 400, th = 80;
    ctx.fillRect((W - tw) / 2, H / 2 - th / 2 - 100, tw, th);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 22px system-ui';
    ctx.textAlign = 'center';
    const next = wave + 1;
    const label = (next % 20 === 0) ? `BOSS WAVE ${next}` : `Wave ${next}`;
    ctx.fillText(label, W / 2, H / 2 - 100);
    ctx.fillStyle = '#9aa0ab';
    ctx.font = '13px system-ui';
    ctx.fillText(`Starts in ${intermission.toFixed(1)}s  ·  go to shop`, W / 2, H / 2 - 78);
    ctx.textAlign = 'left';

    // Skip button
    const hovered = pointInRect(mouse, skipBtn);
    ctx.fillStyle = hovered ? '#3a7a3a' : '#2a4a2a';
    ctx.fillRect(skipBtn.x, skipBtn.y, skipBtn.w, skipBtn.h);
    ctx.strokeStyle = hovered ? '#8be08b' : '#5cb85c';
    ctx.lineWidth = 2;
    ctx.strokeRect(skipBtn.x, skipBtn.y, skipBtn.w, skipBtn.h);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('START NOW  ▶', skipBtn.x + skipBtn.w / 2, skipBtn.y + 25);
    ctx.fillStyle = '#9aa0ab';
    ctx.font = '10px system-ui';
    ctx.fillText('click or press Space', W / 2, skipBtn.y + skipBtn.h + 16);
    ctx.textAlign = 'left';
  }
}

function drawHud() {
  // HP
  const hpW = 220, hpH = 14;
  ctx.fillStyle = '#1d1f26';
  ctx.fillRect(14, 14, hpW, hpH);
  const frac = Math.max(0, player.hp / player.maxHp);
  ctx.fillStyle = frac > 0.5 ? '#5cb85c' : frac > 0.25 ? '#e0a233' : '#d33';
  ctx.fillRect(14, 14, hpW * frac, hpH);
  ctx.strokeStyle = '#33363f';
  ctx.strokeRect(14, 14, hpW, hpH);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 11px system-ui';
  ctx.textAlign = 'left';
  ctx.fillText(`${Math.ceil(Math.max(0, player.hp))} / ${player.maxHp}`, 20, 25);

  // Money
  ctx.fillStyle = '#ffce44';
  ctx.font = 'bold 20px system-ui';
  ctx.fillText(`$${player.money}`, 14, 56);

  // Wave line
  ctx.fillStyle = isBossWave ? '#ff7070' : '#7ec8ff';
  ctx.font = 'bold 15px system-ui';
  const waveLabel = wave === 0
    ? 'Get ready'
    : (isBossWave ? `Wave ${wave} — BOSS` : `Wave ${wave}`);
  ctx.fillText(waveLabel, 14, 78);
  ctx.fillStyle = '#9aa0ab';
  ctx.font = '11px system-ui';
  let sub;
  if (intermission > 0)              sub = `Next in ${intermission.toFixed(1)}s`;
  else if (waveZombiesToSpawn > 0)   sub = `${waveZombiesToSpawn + zombies.length} left`;
  else                               sub = `${zombies.length} left`;
  ctx.fillText(sub, 14, 94);

  // Stats line
  ctx.fillStyle = '#9aa0ab';
  ctx.font = '11px system-ui';
  ctx.fillText(
    `Kills ${kills}  ·  Deaths ${deaths}  ·  Best wave ${Math.max(bestWave, wave)}`,
    14, 112);

  // Active buffs
  let by = 132;
  const buffLabels = { triple: 'Triple', rapid: 'Rapid', fast: 'Speed', shield: 'Shield' };
  for (const k of Object.keys(player.buffs)) {
    const v = player.buffs[k];
    if (v > 0) {
      ctx.fillStyle = '#7ec8ff';
      ctx.font = 'bold 11px system-ui';
      const txt = k === 'shield' ? buffLabels[k] : `${buffLabels[k]} ${v.toFixed(1)}s`;
      ctx.fillText(txt, 14, by);
      by += 14;
    }
  }
  // Picked perks (tomes)
  const perkKeys = Object.keys(player.specialLevels).filter(k => player.specialLevels[k] > 0);
  if (perkKeys.length) {
    by += 4;
    ctx.fillStyle = '#c47eff';
    ctx.font = 'bold 10px system-ui';
    ctx.fillText('PERKS', 14, by);
    by += 12;
    for (const k of perkKeys) {
      const def = SPECIAL_UPGRADES[k];
      const lv = player.specialLevels[k];
      ctx.fillStyle = def.color;
      ctx.fillRect(14, by - 8, 8, 8);
      ctx.fillStyle = '#dfe2e8';
      ctx.font = 'bold 11px system-ui';
      ctx.fillText(`${def.name}${lv > 1 ? ' ×' + lv : ''}`, 26, by);
      by += 13;
    }
  }
}

function drawCardPicker() {
  if (!pendingCards) return;

  // dim the world behind the tomes
  ctx.fillStyle = 'rgba(0, 0, 0, 0.62)';
  ctx.fillRect(0, 0, W, H);

  // title (serif, like an arcane proclamation)
  ctx.fillStyle = '#f4e4b5';
  ctx.font = 'bold 28px Georgia, serif';
  ctx.textAlign = 'center';
  ctx.fillText('A T O M E   B E C K O N S', W / 2, 104);
  ctx.fillStyle = '#9aa0ab';
