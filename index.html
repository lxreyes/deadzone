<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>DEADZONE</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: radial-gradient(circle at 50% 30%, #14141a 0%, #06060a 80%);
    color: #eee; font-family: -apple-system, system-ui, sans-serif; overflow: hidden;
    user-select: none;
  }
  #wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px; height: calc(100% - 28px); }
  h1 { margin: 0; font-size: 18px; letter-spacing: 4px; }
  .sub { font-size: 11px; opacity: 0.55; }
  canvas { display: block; cursor: crosshair; background: #0d0e12; border-radius: 6px; box-shadow: 0 0 0 1px #2a2a33, 0 12px 40px rgba(0,0,0,0.5); }
  kbd { background: #222; padding: 1px 5px; border-radius: 4px; font-family: ui-monospace, monospace; font-size: 10px; }
</style>

<body>
<div id="wrap">
  <h1>D E A D Z O N E</h1>
  <div class="sub"><kbd>WASD</kbd> move · <kbd>mouse</kbd> aim · <kbd>hold LMB</kbd> shoot · stand in the shop to see upgrades · press <kbd>1-9</kbd> to buy · <kbd>R</kbd> reset</div>
  <canvas id="c" width="1200" height="680"></canvas>
</div>

<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const W = c.width, H = c.height;

// ---------- Audio (procedural, Web Audio API) ----------
// Sounds are generated at runtime — no audio files needed, single-file kept.
// AudioContext is lazy-init'd on the first user gesture (autoplay policy).
let audioCtx = null;
let masterGain = null;
let soundMuted = false;
const sfxLast = {};

function ensureAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.32;
    masterGain.connect(audioCtx.destination);
    ensureMusic();
  } catch (e) { /* environment lacks Web Audio; sfx becomes a no-op */ }
}

// ----- Background music (procedural ambient drones, two layers crossfaded) -----
let musicMaster = null;
let musicMenuGain = null;   // calm pads layer
let musicCombatGain = null; // tense pulsing layer
let musicTargetState = null;

function ensureMusic() {
  if (musicMaster || !audioCtx) return;
  // Master is kept quiet so the SFX cut through cleanly
  musicMaster = audioCtx.createGain();
  musicMaster.gain.value = 0.18;
  musicMaster.connect(audioCtx.destination);

  // CALM PADS — a soft minor chord with slow LFO detune. Used outside gameplay.
  musicMenuGain = audioCtx.createGain();
  musicMenuGain.gain.value = 0;
  const menuLP = audioCtx.createBiquadFilter();
  menuLP.type = 'lowpass';
  menuLP.frequency.value = 1400;
  menuLP.connect(musicMenuGain);
  musicMenuGain.connect(musicMaster);
  for (const freq of [110, 164.81, 220, 329.63]) { // A2, E3, A3, E4 — open + airy
    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = freq;
    const lfo = audioCtx.createOscillator();
    lfo.type = 'sine';
    lfo.frequency.value = 0.08 + Math.random() * 0.14;
    const lfoAmt = audioCtx.createGain();
    lfoAmt.gain.value = 2.5;
    lfo.connect(lfoAmt);
    lfoAmt.connect(osc.frequency);
    const oscGain = audioCtx.createGain();
    oscGain.gain.value = 0.22;
    osc.connect(oscGain);
    oscGain.connect(menuLP);
    osc.start();
    lfo.start();
  }

  // COMBAT — low sawtooth drone + a heartbeat-pulse sub bass. Used while playing.
  musicCombatGain = audioCtx.createGain();
  musicCombatGain.gain.value = 0;
  const combatLP = audioCtx.createBiquadFilter();
  combatLP.type = 'lowpass';
  combatLP.frequency.value = 520;
  combatLP.connect(musicCombatGain);
  musicCombatGain.connect(musicMaster);
  for (const freq of [55, 82.5, 110, 138.59]) { // A1, E2, A2, C#3
    const osc = audioCtx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.value = freq;
    const oscGain = audioCtx.createGain();
    oscGain.gain.value = 0.18;
    osc.connect(oscGain);
    oscGain.connect(combatLP);
    osc.start();
  }
  // pulsing heartbeat — square wave LFO on a sub-bass gain
  const heart = audioCtx.createOscillator();
  heart.type = 'sine';
  heart.frequency.value = 41.2; // E1
  const heartGain = audioCtx.createGain();
  heartGain.gain.value = 0;
  const pulse = audioCtx.createOscillator();
  pulse.type = 'square';
  pulse.frequency.value = 1.2; // ~72 BPM
  const pulseAmt = audioCtx.createGain();
  pulseAmt.gain.value = 0.18;
  pulse.connect(pulseAmt);
  pulseAmt.connect(heartGain.gain);
  heart.connect(heartGain);
  heartGain.connect(combatLP);
  heart.start();
  pulse.start();
}

// Crossfade between calm/combat layers based on the active game state.
function updateMusicForState() {
  if (!musicMaster) return;
  const inCombat = (gameState === 'playing');
  if (musicTargetState === inCombat) return;
  musicTargetState = inCombat;
  const t = audioCtx.currentTime;
  const fade = 2.2;
  // Defensive: cancel any in-flight ramps and pin current values
  for (const g of [musicMenuGain, musicCombatGain]) {
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(g.gain.value, t);
  }
  musicMenuGain.gain.linearRampToValueAtTime(inCombat ? 0 : 1, t + fade);
  musicCombatGain.gain.linearRampToValueAtTime(inCombat ? 1 : 0, t + fade);
}
function resumeAudio() {
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  // The first user gesture should also wake the music layers.
  if (musicMaster && musicTargetState === null) updateMusicForState();
}

// Keep the music master in sync with the mute toggle. Called whenever the
// mute state changes (M key, settings, cheats).
function applyMusicMute() {
  if (!musicMaster) return;
  const t = audioCtx.currentTime;
  musicMaster.gain.cancelScheduledValues(t);
  musicMaster.gain.setValueAtTime(musicMaster.gain.value, t);
  musicMaster.gain.linearRampToValueAtTime(soundMuted ? 0 : 0.18, t + 0.4);
}
// Quick tone with linear attack + exponential decay; optional pitch sweep.
function tone({ freq = 440, type = 'square', dur = 0.1, vol = 0.3, sweep = 0, delay = 0, attack = 0.005 } = {}) {
  if (!audioCtx || soundMuted) return;
  const t0 = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (sweep) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + sweep), t0 + dur);
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(vol, t0 + attack);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  osc.connect(gain); gain.connect(masterGain);
  osc.start(t0); osc.stop(t0 + dur + 0.05);
}
// White-noise burst through optional low/high-pass filters.
function noise({ dur = 0.15, vol = 0.25, lowpass = 0, hipass = 0, delay = 0 } = {}) {
  if (!audioCtx || soundMuted) return;
  const t0 = audioCtx.currentTime + delay;
  const n = Math.floor(audioCtx.sampleRate * dur);
  const buffer = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < n; i++) data[i] = Math.random() * 2 - 1;
  const source = audioCtx.createBufferSource();
  source.buffer = buffer;
  let node = source;
  if (lowpass) {
    const f = audioCtx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lowpass;
    node.connect(f); node = f;
  }
  if (hipass) {
    const f = audioCtx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hipass;
    node.connect(f); node = f;
  }
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(vol, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  node.connect(gain); gain.connect(masterGain);
  source.start(t0); source.stop(t0 + dur + 0.05);
}
// Throttle rapid-fire sounds (zombieHit, coin) so a crowd doesn't crackle.
function sfxThrottle(name, gapMs) {
  const now = performance.now();
  if (sfxLast[name] && now - sfxLast[name] < gapMs) return false;
  sfxLast[name] = now;
  return true;
}

// Game-event sound dispatch. Each key plays a short composed sound.
const SFX = {
  shoot(weapon) {
    if (weapon === 'shotgun') {
      noise({ dur: 0.18, vol: 0.4, lowpass: 1400 });
      tone({ freq: 110, type: 'square', dur: 0.12, vol: 0.22, sweep: -60 });
    } else if (weapon === 'rifle') {
      noise({ dur: 0.1, vol: 0.32, lowpass: 2400 });
      tone({ freq: 200, type: 'sawtooth', dur: 0.08, vol: 0.22, sweep: -120 });
    } else if (weapon === 'smg') {
      tone({ freq: 760, type: 'square', dur: 0.05, vol: 0.18, sweep: -180 });
      noise({ dur: 0.04, vol: 0.12, lowpass: 2000, hipass: 600 });
    } else if (weapon === 'rocket') {
      tone({ freq: 70, type: 'sawtooth', dur: 0.35, vol: 0.3, sweep: -20 });
      noise({ dur: 0.25, vol: 0.25, lowpass: 600 });
    } else if (weapon === 'chicken') {
      tone({ freq: 320, type: 'triangle', dur: 0.05, vol: 0.25, sweep: 80 });
      tone({ freq: 380, type: 'triangle', dur: 0.05, vol: 0.22, sweep: 60, delay: 0.07 });
    } else if (weapon === 'banana') {
      tone({ freq: 180, type: 'sawtooth', dur: 0.22, vol: 0.22, sweep: 240 });
    } else if (weapon === 'duck') {
      tone({ freq: 520, type: 'square', dur: 0.14, vol: 0.25, sweep: -300 });
    } else if (weapon === 'plus') {
      // bright four-tone chord, evokes "four directions at once"
      tone({ freq: 660, type: 'square', dur: 0.08, vol: 0.18, sweep: -100 });
      tone({ freq: 880, type: 'square', dur: 0.08, vol: 0.18, sweep: -100, delay: 0.02 });
      tone({ freq: 990, type: 'square', dur: 0.08, vol: 0.18, sweep: -100, delay: 0.04 });
    } else if (weapon === 'tesla') {
      // sizzling rising zap
      tone({ freq: 320, type: 'sawtooth', dur: 0.14, vol: 0.22, sweep: 600 });
      noise({ dur: 0.08, vol: 0.18, lowpass: 4000, hipass: 1200 });
    } else if (weapon === 'orbit') {
      // soft ascending shimmer
      tone({ freq: 440, type: 'sine', dur: 0.18, vol: 0.18, sweep: 320 });
      tone({ freq: 660, type: 'sine', dur: 0.18, vol: 0.15, sweep: 320, delay: 0.04 });
    } else if (weapon === 'rail') {
      // charged bzzap, descending sweep
      tone({ freq: 1200, type: 'sawtooth', dur: 0.25, vol: 0.28, sweep: -900 });
      noise({ dur: 0.1, vol: 0.18, lowpass: 3000, hipass: 800 });
    } else if (weapon === 'twin') {
      // double click — two short snaps
      tone({ freq: 540, type: 'square', dur: 0.05, vol: 0.18, sweep: -200 });
      tone({ freq: 580, type: 'square', dur: 0.05, vol: 0.18, sweep: -200, delay: 0.025 });
    } else { // pistol
      tone({ freq: 540, type: 'square', dur: 0.06, vol: 0.22, sweep: -240 });
      noise({ dur: 0.04, vol: 0.16, lowpass: 1800 });
    }
  },
  zombieHit() { if (sfxThrottle('zombieHit', 30)) tone({ freq: 140, type: 'square', dur: 0.05, vol: 0.14, sweep: -40 }); },
  zombieDie() { if (sfxThrottle('zombieDie', 35)) {
    noise({ dur: 0.18, vol: 0.2, lowpass: 400 });
    tone({ freq: 90, type: 'sawtooth', dur: 0.16, vol: 0.14, sweep: -40 });
  } },
  playerHurt() { if (sfxThrottle('playerHurt', 220)) tone({ freq: 240, type: 'sawtooth', dur: 0.22, vol: 0.3, sweep: -80 }); },
  explosion() {
    noise({ dur: 0.45, vol: 0.4, lowpass: 600 });
    tone({ freq: 55, type: 'sawtooth', dur: 0.4, vol: 0.28, sweep: -20 });
  },
  coin() { if (sfxThrottle('coin', 28)) {
    tone({ freq: 1040, type: 'sine', dur: 0.05, vol: 0.12 });
    tone({ freq: 1480, type: 'sine', dur: 0.08, vol: 0.12, delay: 0.04 });
  } },
  pickup() {
    tone({ freq: 520, type: 'sine', dur: 0.08, vol: 0.22, sweep: 500 });
    tone({ freq: 880, type: 'sine', dur: 0.1, vol: 0.18, delay: 0.06 });
  },
  crate() { tone({ freq: 660, type: 'sine', dur: 0.12, vol: 0.22, sweep: 400 }); },
  swap() { tone({ freq: 320, type: 'square', dur: 0.06, vol: 0.2, sweep: 300 }); },
  swing() { noise({ dur: 0.16, vol: 0.22, lowpass: 2400, hipass: 400 }); },
  throwBlade() { tone({ freq: 520, type: 'sawtooth', dur: 0.12, vol: 0.18, sweep: 400 }); },
  chestOpen() {
    tone({ freq: 600, type: 'sine', dur: 0.1, vol: 0.25 });
    tone({ freq: 900, type: 'sine', dur: 0.1, vol: 0.25, delay: 0.07 });
    tone({ freq: 1200, type: 'sine', dur: 0.22, vol: 0.25, delay: 0.14 });
  },
  perkPick() {
    tone({ freq: 440, type: 'triangle', dur: 0.08, vol: 0.22 });
    tone({ freq: 660, type: 'triangle', dur: 0.08, vol: 0.22, delay: 0.06 });
    tone({ freq: 880, type: 'triangle', dur: 0.16, vol: 0.22, delay: 0.12 });
  },
  waveStart() {
    tone({ freq: 200, type: 'sawtooth', dur: 0.25, vol: 0.28, sweep: 80 });
    noise({ dur: 0.12, vol: 0.15, lowpass: 400 });
  },
  bossSpawn() {
    tone({ freq: 60, type: 'sawtooth', dur: 0.55, vol: 0.32 });
    tone({ freq: 80, type: 'sawtooth', dur: 0.55, vol: 0.32, delay: 0.18 });
    tone({ freq: 50, type: 'sawtooth', dur: 0.7,  vol: 0.28, delay: 0.36 });
  },
  uiClick() { tone({ freq: 800, type: 'square', dur: 0.025, vol: 0.12 }); },
  unlock() {
    tone({ freq: 380, type: 'square', dur: 0.08, vol: 0.2 });
    tone({ freq: 570, type: 'square', dur: 0.08, vol: 0.2, delay: 0.07 });
    tone({ freq: 760, type: 'square', dur: 0.14, vol: 0.2, delay: 0.14 });
  },
  death() { tone({ freq: 220, type: 'sawtooth', dur: 0.6, vol: 0.3, sweep: -150 }); },
};

// ---------- Player ----------
const SPAWN = { x: 90, y: H / 2 };
const player = {
  x: SPAWN.x, y: SPAWN.y,
  r: 11,
  hp: 100, maxHp: 100,
  money: 0,
  speed: 220,           // px/s
  damage: 10,
  fireRate: 4,          // shots/s
  bulletSpeed: 700,
  pierce: 0,
  lastShot: 0,
  invuln: 0,            // seconds
  weapon: 'pistol',
  secondary: 'katana',     // active blade slot; null = none
  lastSecondary: -10,      // game-time of last swing/throw for cooldown
  // Dash is a permanent ability now — bound to Shift.
  lastDash: -10,
  dashCooldown: 1.4,
  dashDistance: 170,
  dashInvuln: 0.45,
  buffs: { triple: 0, rapid: 0, fast: 0, shield: 0 },
  // Stacked perk effects picked from the post-wave card draw.
  // Effective values; parallel specialLevels tracks pick counts for display.
  special: {},
  specialLevels: {},
};

// Weapon definitions. Multipliers stack on top of player base stats.
// shots/spread/damage/fireRate/bulletSpeed are multipliers (or extras for shots).
const WEAPONS = {
  pistol:  { name: 'Pistol',   shots: 1, spread: 0.00, damage: 1.0, fireRate: 1.0, bulletSpeed: 1.0, pierce: 0, life: 1.4, color: '#ffe066', tag: 'P' },
  shotgun: { name: 'Shotgun',  shots: 5, spread: 0.20, damage: 0.55, fireRate: 0.55, bulletSpeed: 0.95, pierce: 0, life: 0.55, color: '#ff9d3a', tag: 'S' },
  smg:     { name: 'SMG',      shots: 1, spread: 0.08, damage: 0.55, fireRate: 2.6, bulletSpeed: 1.05, pierce: 0, life: 1.2, color: '#7ec8ff', tag: 'M' },
  rifle:   { name: 'Rifle',    shots: 1, spread: 0.00, damage: 2.6,  fireRate: 0.55, bulletSpeed: 1.55, pierce: 2, life: 1.6, color: '#9bf07a', tag: 'R' },
  rocket:  { name: 'Rocket',   shots: 1, spread: 0.00, damage: 1.5, fireRate: 0.45, bulletSpeed: 0.75, pierce: 0, life: 1.6, color: '#ff5050', tag: 'X', explosive: true, blastR: 70, blastDmg: 30 },
  // Gag weapons
  chicken: { name: 'Chicken Launcher', shots: 1, spread: 0.05, damage: 1.2, fireRate: 0.5, bulletSpeed: 0.55, pierce: 0, life: 1.8, color: '#ffe066', tag: 'C',

             bulletKind: 'banana', leavesSlick: true },

  // Special-ability guns
  plus:    { name: 'Plus Shooter',     shots: 4, spread: 0, damage: 0.9, fireRate: 1.2, bulletSpeed: 1.0, pierce: 1, life: 1.0, color: '#80ffe0', tag: '+',

             pattern: 'twin' },
};
const DROPPABLE_WEAPONS = ['shotgun', 'smg', 'rifle', 'rocket', 'chicken', 'banana', 'duck', 'plus', 'tesla', 'orbit', 'rail', 'twin'];

// Secondary blades — used with right-click or Q. Each has its own attack style.

// Build mode state — toggled by B. While true, the player ghosts a building
// at the cursor and clicks to place if cost + space allow.
let buildMode = false;
let buildSelected = 'wall';

// Random pickup definitions. apply() runs when the player walks over one.
const PICKUP_TYPES = {
  health: { name: 'Health',     symbol: '+', color: '#5cd86b',
    apply() { player.hp = Math.min(player.maxHp, player.hp + 40); } },
  shield: { name: 'Shield',     symbol: 'S', color: '#7ec8ff',

// Draw a weapon at the local origin, pointing along +x. Caller handles transform.
function drawGun(weapon, r) {
  const w = WEAPONS[weapon] || WEAPONS.pistol;
  const x0 = r * 0.55;
  ctx.strokeStyle = '#15151a';
  ctx.lineWidth = 1;

  switch (weapon) {
    case 'shotgun': {
      // double-barrel feel: thick body + wood stock at the back + colored muzzle
      ctx.fillStyle = '#3a2a1a';                            // wood stock
      ctx.fillRect(x0 - r * 0.45, -3, r * 0.45, 6);
      ctx.fillStyle = '#222a32';                            // receiver
      ctx.fillRect(x0, -5, r * 1.5, 10);
      ctx.strokeRect(x0, -5, r * 1.5, 10);
      ctx.fillStyle = '#0d0f14';                            // barrel split
      ctx.fillRect(x0 + r * 0.4, -1, r * 1.1, 2);
      ctx.fillStyle = '#5a4030';                            // pump grip
      ctx.fillRect(x0 + r * 0.4, 5, r * 0.45, 3);
      ctx.fillStyle = w.color;
      ctx.fillRect(x0 + r * 1.5, -4, 5, 8);                 // muzzle
      break;
    }
    case 'smg': {
      // boxy receiver, mag underneath, stub stock
      ctx.fillStyle = '#2c2c34';                            // stock
      ctx.fillRect(x0 - r * 0.35, -2.5, r * 0.35, 5);
      ctx.fillStyle = '#1e2230';                            // receiver
      ctx.fillRect(x0, -4, r * 1.05, 8);
      ctx.strokeRect(x0, -4, r * 1.05, 8);
      ctx.fillStyle = '#2c2c34';                            // magazine
      ctx.fillRect(x0 + r * 0.2, 4, 5, 8);
      ctx.strokeRect(x0 + r * 0.2, 4, 5, 8);
      ctx.fillStyle = '#1a1a22';                            // short thin barrel
      ctx.fillRect(x0 + r * 1.05, -1.5, r * 0.5, 3);
      ctx.fillStyle = w.color;
      ctx.fillRect(x0 + r * 1.55, -2, 4, 4);                // muzzle
      break;
    }
    case 'rifle': {
      // long body, scope on top, stock at rear
      ctx.fillStyle = '#3a2a1a';                            // wood stock
      ctx.fillRect(x0 - r * 0.55, -3, r * 0.55, 6);
      ctx.fillStyle = '#1f2418';                            // receiver
      ctx.fillRect(x0, -3, r * 1.7, 6);
      ctx.strokeRect(x0, -3, r * 1.7, 6);
      ctx.fillStyle = '#1a1a1a';                            // scope tube
      ctx.fillRect(x0 + r * 0.45, -7, r * 0.6, 4);
      ctx.strokeRect(x0 + r * 0.45, -7, r * 0.6, 4);
      ctx.fillStyle = '#1a1a22';                            // long thin barrel
      ctx.fillRect(x0 + r * 1.7, -1.5, r * 0.55, 3);
      ctx.fillStyle = w.color;
      ctx.fillRect(x0 + r * 2.25, -2, 5, 4);                // muzzle
      break;
    }
    case 'rocket': {
      // fat tube + protruding rocket tip
      ctx.fillStyle = '#2a2a2a';
      ctx.fillRect(x0, -6, r * 1.35, 12);
      ctx.strokeRect(x0, -6, r * 1.35, 12);
      // bore
      ctx.fillStyle = '#0a0a0a';
      ctx.beginPath();
      ctx.arc(x0 + 3, 0, 4, 0, Math.PI * 2);
      ctx.fill();
      // top sight
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(x0 + r * 0.4, -8, 4, 2);
      // protruding rocket tip
      ctx.fillStyle = w.color;
      ctx.beginPath();
      ctx.moveTo(x0 + r * 1.35, -5);
      ctx.lineTo(x0 + r * 1.35 + 9, 0);
      ctx.lineTo(x0 + r * 1.35, 5);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      // tiny fin
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(x0 + r * 1.2, -7, 3, 2);
      ctx.fillRect(x0 + r * 1.2, 5, 3, 2);
      break;
    }
    case 'chicken': {
      // wide tube launcher with a chicken head peeking out the muzzle
      ctx.fillStyle = '#2a2a2a';
      ctx.fillRect(x0, -7, r * 1.45, 14);
      ctx.strokeRect(x0, -7, r * 1.45, 14);
      // bore
      ctx.fillStyle = '#0a0a0a';
      ctx.beginPath(); ctx.arc(x0 + 4, 0, 4.5, 0, Math.PI * 2); ctx.fill();
      // chicken head
      ctx.fillStyle = '#fff5b8';
      ctx.beginPath(); ctx.arc(x0 + r * 1.55, 0, 5, 0, Math.PI * 2); ctx.fill();
      ctx.stroke();
      // red comb
      ctx.fillStyle = '#d63030';
      ctx.beginPath();
      ctx.arc(x0 + r * 1.55 - 1, -5, 1.5, 0, Math.PI * 2);
      ctx.arc(x0 + r * 1.55 + 1, -5, 1.5, 0, Math.PI * 2);
      ctx.fill();
      // beak
      ctx.fillStyle = '#ff9d3a';
      ctx.beginPath();
      ctx.moveTo(x0 + r * 1.55 + 5, -1);
      ctx.lineTo(x0 + r * 1.55 + 10, 0);
      ctx.lineTo(x0 + r * 1.55 + 5, 2);
      ctx.closePath(); ctx.fill();
      // eye
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath(); ctx.arc(x0 + r * 1.55 + 1.5, -0.5, 0.9, 0, Math.PI * 2); ctx.fill();
      break;
    }
    case 'banana': {
      // bright yellow curved body — the gun IS a banana
      ctx.fillStyle = '#ffd942';
      ctx.beginPath();
      ctx.moveTo(x0 - r * 0.3, 4);
      ctx.quadraticCurveTo(x0 + r * 0.6, -10, x0 + r * 1.7, -2);
      ctx.quadraticCurveTo(x0 + r * 1.85, 3, x0 + r * 1.6, 5);
      ctx.quadraticCurveTo(x0 + r * 0.6, -3, x0 - r * 0.2, 7);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      // tip
      ctx.fillStyle = '#6a4a0a';
      ctx.fillRect(x0 + r * 1.7, -3, 3, 3);
      break;
    }
    case 'rail': {
      // big slab body with a coil ramping toward a wide muzzle
      ctx.fillStyle = '#1b2230';
      ctx.fillRect(x0, -6, r * 1.6, 12);
      ctx.strokeRect(x0, -6, r * 1.6, 12);
      // emitter ring at the muzzle
      ctx.fillStyle = w.color;
      ctx.beginPath(); ctx.arc(x0 + r * 1.7, 0, 6, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#15151a';
      ctx.lineWidth = 1.2;
      ctx.stroke();
      ctx.fillStyle = '#0a0a0a';
      ctx.beginPath(); ctx.arc(x0 + r * 1.7, 0, 2.5, 0, Math.PI * 2); ctx.fill();
      // diagonal coil lines
      ctx.strokeStyle = w.color;
      ctx.lineWidth = 1;
      for (let k = 0; k < 3; k++) {
        ctx.beginPath();
        ctx.moveTo(x0 + 4 + k * 6, -5);
        ctx.lineTo(x0 + 4 + k * 6 + 5, 5);
        ctx.stroke();
      }
      break;
    }
    case 'twin': {
      // two short pistol bodies stacked vertically
      ctx.fillStyle = '#2e2e36';
      ctx.fillRect(x0, -6, r * 0.9, 5);
      ctx.fillRect(x0, 1, r * 0.9, 5);
      ctx.strokeRect(x0, -6, r * 0.9, 5);
      ctx.strokeRect(x0, 1, r * 0.9, 5);
      ctx.fillStyle = w.color;
      ctx.fillRect(x0 + r * 0.9, -5, 4, 3);
      ctx.fillRect(x0 + r * 0.9, 2, 4, 3);
      break;
    }
    case 'plus': {
      // squat barrel with a + emblem on the side and short cross-vents
      ctx.fillStyle = '#2a3a44';
      ctx.fillRect(x0, -5, r * 1.1, 10);
      ctx.strokeRect(x0, -5, r * 1.1, 10);
      // vertical vents (forming the visual + idea)
      ctx.fillStyle = w.color;
      ctx.fillRect(x0 + r * 0.45, -8, 2.5, 16);
      ctx.fillRect(x0 + r * 0.2, -1.5, r * 0.7, 3);
      // muzzle
      ctx.fillStyle = w.color;
      ctx.fillRect(x0 + r * 1.1, -3, 5, 6);
      break;
    }
    case 'tesla': {
      // coil body with prongs at the muzzle (lightning emitter)
      ctx.fillStyle = '#1c2230';
      ctx.fillRect(x0, -5, r * 1.1, 10);
      ctx.strokeRect(x0, -5, r * 1.1, 10);
      // coil rings
      ctx.strokeStyle = w.color;
      ctx.lineWidth = 1.5;
      for (let k = 0; k < 4; k++) {
        ctx.beginPath();
        ctx.moveTo(x0 + r * 0.1 + k * 3.5, -5);
        ctx.lineTo(x0 + r * 0.1 + k * 3.5, 5);
        ctx.stroke();
      }
      ctx.strokeStyle = '#15151a';
      ctx.lineWidth = 1;
      // prongs
      ctx.fillStyle = w.color;
      ctx.fillRect(x0 + r * 1.1, -6, 3, 4);
      ctx.fillRect(x0 + r * 1.1, 2, 3, 4);
      // arc sparkle
      ctx.beginPath();
      ctx.moveTo(x0 + r * 1.15, -3);
      ctx.lineTo(x0 + r * 1.35, 0);
      ctx.lineTo(x0 + r * 1.15, 3);
      ctx.stroke();
      break;
    }
    case 'orbit': {
      // bulbous emitter with a small orb floating above
      ctx.fillStyle = '#2c1f3a';
      ctx.fillRect(x0, -5, r * 0.9, 10);
      ctx.strokeRect(x0, -5, r * 0.9, 10);
      // muzzle ring
      ctx.fillStyle = w.color;
      ctx.beginPath(); ctx.arc(x0 + r * 0.95, 0, 5, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#15151a';
      ctx.lineWidth = 1.2;
      ctx.stroke();
      // tiny orb above, orbiting visually
      const ob = Math.sin(gameTime * 4) * 2;
      ctx.fillStyle = w.color;
      ctx.beginPath(); ctx.arc(x0 + r * 0.4, -8 + ob, 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff5b8';
      ctx.beginPath(); ctx.arc(x0 + r * 0.4 - 0.6, -8.6 + ob, 1, 0, Math.PI * 2); ctx.fill();
      break;
    }
    case 'duck': {
      // small body with a duck riding on top
      ctx.fillStyle = '#2e2e36';
      ctx.fillRect(x0, -3, r * 0.85, 6);
      ctx.strokeRect(x0, -3, r * 0.85, 6);
      ctx.fillStyle = w.color;
      ctx.fillRect(x0 + r * 0.85, -2, 4, 4); // muzzle
      // duck body on top
      ctx.fillStyle = '#ffe066';
      ctx.beginPath(); ctx.arc(x0 + r * 0.5, -6, 4.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      // duck head
      ctx.beginPath(); ctx.arc(x0 + r * 0.95, -8, 3, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      // beak
      ctx.fillStyle = '#ff9d3a';
      ctx.beginPath();
      ctx.moveTo(x0 + r * 0.95 + 2, -8);
      ctx.lineTo(x0 + r * 0.95 + 6, -7.5);
      ctx.lineTo(x0 + r * 0.95 + 2, -7);
      ctx.closePath(); ctx.fill();
      // eye
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath(); ctx.arc(x0 + r * 0.95 + 0.5, -8.5, 0.6, 0, Math.PI * 2); ctx.fill();
      break;
    }
    default: { // pistol — short, with grip below
      ctx.fillStyle = '#2e2e36';
      ctx.fillRect(x0, -3.5, r * 0.95, 7);
      ctx.strokeRect(x0, -3.5, r * 0.95, 7);
      // grip
      ctx.fillStyle = '#2a2a32';
      ctx.fillRect(x0 + r * 0.05, 3.5, 4, 6);
      ctx.strokeRect(x0 + r * 0.05, 3.5, 4, 6);
      // muzzle
      ctx.fillStyle = w.color;
      ctx.fillRect(x0 + r * 0.95, -2, 4, 4);
      break;
    }
  }
}

// Dispatch bullet drawing to a gag-specific shape, falling back to a plain disc.
function drawBullet(b) {
  if (b.bulletKind === 'chicken') {
    const ang = Math.atan2(b.vy, b.vx);
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(ang);
    // body
    ctx.fillStyle = '#fff5b8';
    ctx.beginPath(); ctx.ellipse(0, 0, 7, 5.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#15151a';
    ctx.lineWidth = 1;
    ctx.stroke();
    // comb
    ctx.fillStyle = '#d63030';
    ctx.beginPath(); ctx.arc(-1, -5, 1.5, 0, Math.PI*2);
    ctx.arc(1, -5, 1.5, 0, Math.PI*2); ctx.fill();
    // beak (forward = +x)
    ctx.fillStyle = '#ff9d3a';
    ctx.beginPath();
    ctx.moveTo(6, -1); ctx.lineTo(11, 0); ctx.lineTo(6, 2); ctx.closePath();
    ctx.fill();
    // eye
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.arc(3, -1, 0.9, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    return;
  }
  if (b.bulletKind === 'chick') {
    const ang = Math.atan2(b.vy, b.vx);
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(ang);
    ctx.fillStyle = '#ffe066';
    ctx.beginPath(); ctx.arc(0, 0, 3.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ff9d3a';
    ctx.beginPath();
    ctx.moveTo(2.8, 0); ctx.lineTo(5.5, 0.7); ctx.lineTo(2.8, 1.2); ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.arc(1.4, -1, 0.6, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    return;
  }
  if (b.bulletKind === 'banana') {
    const ang = Math.atan2(b.vy, b.vx);
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(ang);
    ctx.fillStyle = '#ffd942';
    ctx.beginPath();
    ctx.moveTo(-6, 3);
    ctx.quadraticCurveTo(0, -6, 7, -1);
    ctx.quadraticCurveTo(8, 2, 6, 3);
    ctx.quadraticCurveTo(0, -2, -5, 5);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#a07e1c';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = '#6a4a0a';
    ctx.fillRect(6, -2, 2.5, 2.5);
    ctx.restore();
    return;
  }
  if (b.bulletKind === 'duck') {
    const ang = Math.atan2(b.vy, b.vx);
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(ang);
    // body
    ctx.fillStyle = '#ffe066';
    ctx.beginPath(); ctx.ellipse(-1, 1, 6, 4.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#15151a';
    ctx.lineWidth = 1;
    ctx.stroke();
    // head
    ctx.fillStyle = '#ffe066';
    ctx.beginPath(); ctx.arc(4, -2, 3.2, 0, Math.PI*2); ctx.fill();
    ctx.stroke();
    // beak
    ctx.fillStyle = '#ff9d3a';
    ctx.beginPath();
    ctx.moveTo(6.5, -2); ctx.lineTo(11, -1.5); ctx.lineTo(6.5, -0.5); ctx.closePath();
    ctx.fill();
    // eye
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.arc(5, -2.7, 0.7, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    return;
  }
  if (b.bulletKind === 'kunai') {
    const ang = Math.atan2(b.vy, b.vx);
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(ang);
    // narrow diamond blade
    ctx.fillStyle = b.color || '#9ab0c0';
    ctx.beginPath();
    ctx.moveTo(8, 0); ctx.lineTo(0, 2); ctx.lineTo(-6, 0); ctx.lineTo(0, -2);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#15151a';
    ctx.lineWidth = 1;
    ctx.stroke();
    // wrapped handle
    ctx.fillStyle = '#3a2410';
    ctx.fillRect(-6, -1.5, 4, 3);
    ctx.restore();
    return;
  }
  if (b.bulletKind === 'chakram') {
    const spin = (gameTime * 22) + b.x * 0.13;
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(spin);
    // outer sawblade ring
    ctx.fillStyle = b.color || '#ff8040';
    ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI*2); ctx.fill();
    // serrated teeth
    ctx.fillStyle = '#1a1a1a';
    for (let k = 0; k < 8; k++) {
      const a = (k / 8) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * 8, Math.sin(a) * 8);
      ctx.lineTo(Math.cos(a + 0.18) * 12, Math.sin(a + 0.18) * 12);
      ctx.lineTo(Math.cos(a + 0.36) * 8, Math.sin(a + 0.36) * 8);
      ctx.closePath(); ctx.fill();
    }
    // inner hub
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.arc(0, 0, 3.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = b.color || '#ff8040';
    ctx.beginPath(); ctx.arc(0, 0, 1.5, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    return;
  }
  if (b.bulletKind === 'rail') {
    // long bright streak — render a tapered line behind the bullet
    const ang = Math.atan2(b.vy, b.vx);
    const sp = Math.hypot(b.vx, b.vy);
    const len = Math.min(160, sp * 0.06);
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(ang);
    // outer glow
    const grad = ctx.createLinearGradient(-len, 0, 0, 0);
    grad.addColorStop(0, b.color + '00');
    grad.addColorStop(0.8, b.color);
    grad.addColorStop(1, '#ffffff');
    ctx.fillStyle = grad;
    ctx.fillRect(-len, -3, len, 6);
    // core bolt
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(-len * 0.3, -1, len * 0.3 + 4, 2);
    ctx.restore();
    return;
  }
  if (b.bulletKind === 'lightning') {
    // jittery zigzag bullet
    const ang = Math.atan2(b.vy, b.vx);
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(ang);
    // glow
    const glow = ctx.createRadialGradient(0, 0, 1, 0, 0, 12);
    glow.addColorStop(0, '#ffffff');
    glow.addColorStop(0.5, b.color + 'aa');
    glow.addColorStop(1, b.color + '00');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI*2); ctx.fill();
    // crackling core line
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-5, 0);
    ctx.lineTo(-2, (Math.random() - 0.5) * 4);
    ctx.lineTo(1,  (Math.random() - 0.5) * 4);
    ctx.lineTo(5,  0);
    ctx.stroke();
    ctx.restore();
    return;
  }
  if (b.bulletKind === 'orbit') {
    // glowing orb that pulses
    const pulse = 1 + Math.sin(gameTime * 8 + b.orbitAngle) * 0.15;
    const r = 5 * pulse;
    const glow = ctx.createRadialGradient(b.x, b.y, 1, b.x, b.y, r * 3);
    glow.addColorStop(0, '#ffffff');
    glow.addColorStop(0.4, b.color);
    glow.addColorStop(1, b.color + '00');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(b.x, b.y, r * 3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(b.x, b.y, r * 0.4, 0, Math.PI*2); ctx.fill();
    return;
  }
  // default — plain circle (explosive rockets render larger)
  ctx.fillStyle = b.color || '#ffe066';
  ctx.beginPath(); ctx.arc(b.x, b.y, b.explosive ? 5 : 3, 0, Math.PI*2); ctx.fill();
}

// Draw a distinctive icon for a pickup type, centered at (x, y).
// All icons are drawn in dark ink so they read against the colored pickup body.
function drawPickupIcon(type, x, y, s) {
  ctx.save();
  ctx.fillStyle = '#15151a';
  ctx.strokeStyle = '#15151a';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  switch (type) {
    case 'health': { // medical + cross
      const t = Math.max(2, s * 0.28);
      ctx.fillRect(x - t/2, y - s*0.6, t, s*1.2);
      ctx.fillRect(x - s*0.6, y - t/2, s*1.2, t);
      break;
    }
    case 'shield': { // shield outline
      ctx.beginPath();
      ctx.moveTo(x, y - s*0.7);
      ctx.lineTo(x + s*0.55, y - s*0.35);
      ctx.lineTo(x + s*0.5,  y + s*0.25);
      ctx.lineTo(x,          y + s*0.7);
      ctx.lineTo(x - s*0.5,  y + s*0.25);
      ctx.lineTo(x - s*0.55, y - s*0.35);
      ctx.closePath();
      ctx.stroke();
      break;
    }
    case 'triple': { // three pellets in a triangle
      const r = Math.max(1.6, s * 0.18);
      ctx.beginPath(); ctx.arc(x,            y - s*0.4, r, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x - s*0.4,    y + s*0.3, r, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + s*0.4,    y + s*0.3, r, 0, Math.PI*2); ctx.fill();
      break;
    }
    case 'rapid': { // lightning bolt
      ctx.beginPath();
      ctx.moveTo(x - s*0.15, y - s*0.7);
      ctx.lineTo(x + s*0.35, y - s*0.05);
      ctx.lineTo(x + s*0.05, y + s*0.05);
      ctx.lineTo(x + s*0.2,  y + s*0.7);
      ctx.lineTo(x - s*0.35, y + s*0.05);
      ctx.lineTo(x - s*0.05, y - s*0.05);
      ctx.closePath();
      ctx.fill();
      break;
    }
    case 'speed': { // double chevron »
      ctx.beginPath();
      ctx.moveTo(x - s*0.5, y - s*0.45);
      ctx.lineTo(x - s*0.05, y);
      ctx.lineTo(x - s*0.5, y + s*0.45);
      ctx.moveTo(x + s*0.05, y - s*0.45);
      ctx.lineTo(x + s*0.5, y);
      ctx.lineTo(x + s*0.05, y + s*0.45);
      ctx.stroke();
      break;
    }
    case 'bomb': { // round bomb with fuse + spark
      ctx.beginPath(); ctx.arc(x, y + s*0.15, s*0.55, 0, Math.PI*2); ctx.fill();
      // collar
      ctx.fillRect(x - s*0.18, y - s*0.42, s*0.36, s*0.16);
      // fuse
      ctx.beginPath();
      ctx.moveTo(x + s*0.05, y - s*0.35);
      ctx.quadraticCurveTo(x + s*0.45, y - s*0.55, x + s*0.55, y - s*0.85);
      ctx.stroke();
      // spark
      ctx.fillStyle = '#ffce44';
      ctx.beginPath(); ctx.arc(x + s*0.55, y - s*0.85, 2.5, 0, Math.PI*2); ctx.fill();
      break;
    }
  }
  ctx.restore();
}

function darken(hex, amount = 0.4) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  const f = 1 - amount;
  return '#' + [r, g, b].map(c => Math.max(0, Math.round(c * f)).toString(16).padStart(2, '0')).join('');
}

addEventListener('keydown', e => {
  ensureAudio(); resumeAudio();
  // Global keys that work in every state
  if (e.code === 'KeyM') {
    soundMuted = !soundMuted;
    applyMusicMute();
    if (!soundMuted) SFX.uiClick();
    return;
  }
  // Escape switches game-state — checked before recording the key
  if (e.code === 'Escape') {
    if (buildMode)                     { buildMode = false; SFX.uiClick(); return; }
    if (gameState === 'playing')       { gameState = 'paused'; clearKeys(); SFX.uiClick(); updateMusicForState(); return; }
    if (gameState === 'paused')        { gameState = 'playing'; SFX.uiClick(); updateMusicForState(); return; }
    if (gameState === 'settings')      { gameState = hasGame ? 'paused' : 'menu'; SFX.uiClick(); updateMusicForState(); return; }
    if (gameState === 'menu')          return;
  }
  // While a menu overlay is up, swallow other keys so movement/shoot stay frozen.
  if (gameState !== 'playing') return;

  keys[e.code] = true;
  if (e.code === 'KeyR') hardReset();
  if (e.code === 'KeyB' && !pendingCards) {
    buildMode = !buildMode;
    SFX.uiClick();
  }
  // card pick takes priority over everything else digit-related
  if (pendingCards) {
    if (e.code === 'Digit1') { pickCard(0); return; }
    if (e.code === 'Digit2') { pickCard(1); return; }
    if (e.code === 'Digit3') { pickCard(2); return; }
    return;
  }
  if (e.code === 'Space' && intermission > 0) {
    intermission = 0;
    beginNextWave();
    e.preventDefault();
  }
  if (e.code === 'KeyE' && nearbyGun) doSwapWeapon();
  if (e.code === 'KeyF' && nearbyBladeCrate) doSwapSecondary();
  if (e.code === 'KeyQ' && !inShop() && !pendingCards) useSecondary();
  if ((e.code === 'ShiftLeft' || e.code === 'ShiftRight') && !inShop() && !pendingCards) tryDash();
  // build-mode digit selection takes priority over shop/cheats
  if (buildMode && e.code.startsWith('Digit')) {
    const bi = ['Digit1','Digit2','Digit3'].indexOf(e.code);
    if (bi >= 0 && BUILDING_KEYS[bi]) { buildSelected = BUILDING_KEYS[bi]; SFX.uiClick(); return; }
  }
  // shop buying — or cheat-code entry when standing outside the shop
  if (inShop()) {
    const idx = ['Digit1','Digit2','Digit3','Digit4','Digit5','Digit6','Digit7','Digit8','Digit9'].indexOf(e.code);
    if (idx >= 0 && idx < upgrades.length) tryBuy(idx);
  } else if (!cheatsUnlocked && e.code.startsWith('Digit')) {
    cheatBuffer = (cheatBuffer + e.code.slice(5)).slice(-CHEAT_CODE.length);
    if (cheatBuffer === CHEAT_CODE) {
      cheatsUnlocked = true;
      cheatsOpen = true;
      floaters.push({ x: 98, y: 200, text: 'CHEATS UNLOCKED', life: 2.8, color: '#8be08b' });
      shake(6);
      SFX.unlock();
    }
  }
});
addEventListener('keyup', e => { keys[e.code] = false; });
// Drop any held movement when leaving play so the player doesn't keep walking
// during a paused screen.
function clearKeys() { for (const k in keys) keys[k] = false; mouse.down = false; }

c.addEventListener('mousemove', e => {
  const r = c.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (W / r.width);
  mouse.y = (e.clientY - r.top)  * (H / r.height);
  // dragging the cheats panel
  if (cheatsDrag) {
    cheatsDrag.moved = true;
    cheatsPanel.x = Math.max(0, Math.min(W - cheatsPanel.w, mouse.x - cheatsDrag.offX));
    cheatsPanel.y = Math.max(0, Math.min(H - 30, mouse.y - cheatsDrag.offY));
  }
  // dragging a stat slider
  if (sliderDrag && sliderDrag.slider.rect) {
    sliderDrag.slider.set(sliderValueAt(sliderDrag.slider, mouse.x));
  }
});
c.addEventListener('mousedown', e => {
  ensureAudio(); resumeAudio();
  // Menus take all clicks
  if (gameState !== 'playing') {
    if (e.button === 0) handleMenuClick();
    return;
  }
  // right-click triggers the secondary blade
  if (e.button === 2) {
    if (!pendingCards && !inShop()) useSecondary();
    return;
  }
  if (e.button !== 0) return;
  // build mode absorbs clicks for placement (toolbar handles its own clicks first)
  if (buildMode && !pendingCards) {
    // toolbar slot click handled in drawBuildToolbar via buildToolbarRects;
    // check those before falling through to placement
    if (buildToolbarRects) {
      for (let k = 0; k < BUILDING_KEYS.length; k++) {
        if (pointInRect(mouse, buildToolbarRects[k])) {
          buildSelected = BUILDING_KEYS[k];
          SFX.uiClick();
          return;
        }
      }
    }
    tryPlaceBuilding();
    return;
  }
  // card picker eats clicks while open
  if (pendingCards) {
    for (let i = 0; i < 3; i++) {
      if (cardRects[i] && pointInRect(mouse, cardRects[i])) { pickCard(i); return; }
    }
    return;
  }
  // cheats panel takes priority
  if (cheatsHeaderRect && pointInRect(mouse, cheatsHeaderRect)) {
    cheatsDrag = { offX: mouse.x - cheatsPanel.x, offY: mouse.y - cheatsPanel.y, moved: false };
    return;
  }
  if (cheatsOpen) {
    // section headers toggle their group open/closed
    for (const sec of cheatSections) {
      if (sec.headerRect && pointInRect(mouse, sec.headerRect)) {
        sec.open = !sec.open;
        SFX.uiClick();
        return;
      }
    }
    // individual cheat buttons
    for (const sec of cheatSections) {
      if (!sec.open) continue;
      for (const c of sec.items) {
        if (c.rect && pointInRect(mouse, c.rect)) { SFX.uiClick(); c.run(); return; }
      }
    }
    // sliders — start a drag and seek the clicked position immediately
    for (const s of cheatSliders) {
      if (s.rect && pointInRect(mouse, s.rect)) {
        sliderDrag = { slider: s };
        s.set(sliderValueAt(s, mouse.x));
        return;
      }
    }
  }
  if (intermission > 0 && pointInRect(mouse, skipBtn)) {
    intermission = 0;
    beginNextWave();
    return;
  }
  if (nearbyGun && nearbyGun.weapon !== player.weapon && pointInRect(mouse, swapBtn)) {
    doSwapWeapon();
    return;
  }
  if (nearbyBladeCrate && nearbyBladeCrate.secondary !== player.secondary && pointInRect(mouse, swapBladeBtn)) {
    doSwapSecondary();
    return;
  }
  mouse.down = true;
});
addEventListener('mouseup', e => {
  if (e.button === 0) mouse.down = false;
  // finish the cheats-header drag — if the mouse never moved, treat it as a toggle click
  if (cheatsDrag) {
    if (!cheatsDrag.moved) { cheatsOpen = !cheatsOpen; SFX.uiClick(); }
    cheatsDrag = null;
  }
  sliderDrag = null;
});
addEventListener('contextmenu', e => e.preventDefault());

// ---------- Shop / Upgrades ----------
const upgrades = [
  { name: 'Max HP +20',     type: 'perm', cost: 25,
    buy() { player.maxHp += 20; player.hp = Math.min(player.maxHp, player.hp + 20); this.cost = Math.ceil(this.cost * 1.5); } },
  { name: 'Move Speed +25', type: 'perm', cost: 35,
    buy() { player.speed += 25; this.cost = Math.ceil(this.cost * 1.5); } },
  { name: 'Damage +5',      type: 'perm', cost: 45,
    buy() { player.damage += 5; this.cost = Math.ceil(this.cost * 1.5); } },
  { name: 'Fire Rate +1',   type: 'perm', cost: 55,
    buy() { player.fireRate += 1; this.cost = Math.ceil(this.cost * 1.5); } },
  { name: 'Pierce +1',      type: 'perm', cost: 90,
    buy() { player.pierce += 1; this.cost = Math.ceil(this.cost * 1.8); } },
  { name: 'Full Heal',      type: 'temp', cost: 18,
    buy() { player.hp = player.maxHp; } },
  { name: 'Triple Shot 15s', type: 'temp', cost: 28,
    buy() { player.buffs.triple = 15; } },
  { name: 'Rapid Fire 15s', type: 'temp', cost: 32,
    buy() { player.buffs.rapid = 15; } },
  { name: 'Nuke (clear)',   type: 'temp', cost: 70,
    buy() { detonateNuke(player.x, player.y); } },
];

function inShop() {
  return player.x > shop.x && player.x < shop.x + shop.w
      && player.y > shop.y && player.y < shop.y + shop.h;
}

function tryBuy(i) {
  const u = upgrades[i];
  if (player.money < u.cost) return;
  player.money -= u.cost;
  u.buy();
}

// ---------- Game logic ----------
function shake(amt) { shakeAmt = Math.max(shakeAmt, amt); }

function addBlood(x, y, scale = 1) {
  decals.push({ x, y, r: 8 * scale + Math.random()*3, color: 'rgba(115, 18, 18, 0.55)', life: 14, max: 14 });
  for (let i = 0; i < 4; i++) {
    const a = Math.random() * Math.PI * 2;
    const d = (4 + Math.random() * 9) * scale;
    decals.push({
      x: x + Math.cos(a)*d, y: y + Math.sin(a)*d,
      r: 3 * scale + Math.random()*2.5,
      color: 'rgba(90, 12, 12, 0.45)',
      life: 10 + Math.random()*3, max: 13,
    });
  }
}

function updateDecals(dt) {
  for (let i = decals.length - 1; i >= 0; i--) {
    decals[i].life -= dt;
    if (decals[i].life <= 0) decals.splice(i, 1);
  }
}

function muzzleFlash(x, y, ang) {
  for (let i = 0; i < 4; i++) {
    const a = ang + (Math.random() - 0.5) * 0.4;
    const s = 240 + Math.random() * 160;
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.07 + Math.random()*0.05, color: '#fff4a8' });
  }
}

function spawnDeathParticles(x, y, col) {
  for (let i = 0; i < 8; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 60 + Math.random() * 180;
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.4 + Math.random()*0.3, color: col });
  }
}

// A short outward burst in the given color — used whenever a loot drop appears,
// so the player's eye is drawn to it.
function dropBurst(x, y, color, n = 14) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 90 + Math.random() * 180;
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.45 + Math.random()*0.2, color });
  }
}

// Handle all the side effects of a zombie reaching hp <= 0. Caller is
// responsible for splicing the zombie out of the zombies array — we do not
// touch the array here so this is safe to call from any iteration order.
function killZombie(z) {
  // Dummies don't count toward kills, don't drop loot, just poof.
  if (z.isDummy) {
    for (let k = 0; k < 18; k++) {
      const a = Math.random() * Math.PI * 2;
      const s = 100 + Math.random() * 180;
      particles.push({ x: z.x, y: z.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.55, color: '#cdd1da' });
    }
    return;
  }
  kills++;
  spawnDeathParticles(z.x, z.y, z.color);
  addBlood(z.x, z.y, z.isBoss ? 2 : 1);
  dropCoinsFor(z);
  tryDropGun(z);
  tryDropPickup(z);
  tryDropBladeCrate(z);
  if (player.special.vampire) {
    player.hp = Math.min(player.maxHp, player.hp + player.special.vampire);
  }
  if (z.isBoss) spawnBossChest(z.x, z.y);
  SFX.zombieDie();
}

// Random chance to drop a blade crate from a killed zombie. Crates are
// auto-collected on contact and swap player.secondary to the contained type.
function tryDropBladeCrate(z) {
  let chance = 0;
  if (z.isBoss)             chance = 1.0;
  else if (z.type === 'tank') chance = 0.10;
  else if (z.type === 'fast') chance = 0.04;
  else                      chance = 0.025;
  if (Math.random() >= chance) return;
  const keys = Object.keys(SECONDARIES);
  const pick = keys[Math.floor(Math.random() * keys.length)];
  bladeCrates.push({ x: z.x, y: z.y, secondary: pick, life: 24 });
  dropBurst(z.x, z.y, SECONDARIES[pick].color, 14);
}

function updateBladeCrates(dt) {
  nearbyBladeCrate = null;
  let bestD2 = 60 * 60; // hover radius
  for (let i = bladeCrates.length - 1; i >= 0; i--) {
    const c = bladeCrates[i];
    c.life -= dt;
    if (c.life <= 0) { bladeCrates.splice(i, 1); continue; }
    const dx = player.x - c.x, dy = player.y - c.y;
    const d2 = dx*dx + dy*dy;
    if (d2 < bestD2) { bestD2 = d2; nearbyBladeCrate = c; }
  }
}

// Swap the player's secondary to the nearby crate's blade. Mirrors doSwapWeapon
// in spirit — confirm prompt, particle burst, drop the old one (for now we just
// discard the previous secondary since they're free-to-find).
function doSwapSecondary() {
  if (!nearbyBladeCrate) return;
  if (nearbyBladeCrate.secondary === player.secondary) return;
  const def = SECONDARIES[nearbyBladeCrate.secondary];
  const cx = nearbyBladeCrate.x, cy = nearbyBladeCrate.y;
  player.secondary = nearbyBladeCrate.secondary;
  player.lastSecondary = -10;
  const idx = bladeCrates.indexOf(nearbyBladeCrate);
  if (idx >= 0) bladeCrates.splice(idx, 1);
  floaters.push({ x: cx, y: cy - 22, text: `Equipped ${def.name}`, life: 2.0, color: def.color });
  for (let k = 0; k < 18; k++) {
    const a = Math.random() * Math.PI * 2;
    const s = 100 + Math.random() * 200;
    particles.push({ x: cx, y: cy, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.5, color: def.color });
  }
  SFX.swap();
  nearbyBladeCrate = null;
}

function dropCoinsFor(z) {
  // greed perk inflates the drop value
  const total = Math.round(z.money * (1 + (player.special.greed || 0)));
  const n = Math.min(6, Math.ceil(total / 3));
  const per = Math.max(1, Math.round(total / n));
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 60 + Math.random() * 100;
    coins.push({ x: z.x, y: z.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, value: per, life: 9 });
  }
  dropBurst(z.x, z.y, '#ffce44', 10);
}

function edgeSpawnPoint() {
  const edge = Math.floor(Math.random() * 4);
  if (edge === 0) return { x: Math.random() * W,  y: -20 };
  if (edge === 1) return { x: W + 20,             y: Math.random() * H };
  if (edge === 2) return { x: Math.random() * W,  y: H + 20 };
  return            { x: -20,             y: Math.random() * H };
}

// Pick a zombie type given the current wave. Tougher mixes show up later.
function rollType() {
  const r = Math.random();
  const tankChance = Math.min(0.28, 0.02 + wave * 0.014);
  const fastChance = Math.min(0.42, 0.06 + wave * 0.020);
  if (wave >= 4 && r < tankChance)               return 'tank';
  if (wave >= 2 && r < tankChance + fastChance)  return 'fast';
  return 'normal';
}

function spawnZombie() {
  if (zombies.length >= 100) return;
  const { x, y } = edgeSpawnPoint();
  const type = rollType();
  const base = {
    normal: { hp: 22, speed: 62,  damage: 14, r: 12, color: '#5e8c4a', money: 3 },
    fast:   { hp: 14, speed: 120, damage: 10, r: 9,  color: '#a85040', money: 5 },
    tank:   { hp: 75, speed: 38,  damage: 26, r: 19, color: '#374827', money: 14 },
  }[type];
  // wave scaling
  const hpMul   = 1 + wave * 0.09;
  const dmgMul  = 1 + wave * 0.025;
  const moneyMul = 1 + wave * 0.04;
  const hp = Math.ceil(base.hp * hpMul);
  zombies.push({
    x, y, type,
    r: base.r, color: base.color, speed: base.speed,
    hp, hpMax: hp,
    damage: base.damage * dmgMul,
    money: Math.ceil(base.money * moneyMul),
    phase: Math.random() * Math.PI * 2,
  });
}

// Cheat helper: spawn a specific zombie type at an arena edge.
function spawnSpecific(type) {
  if (zombies.length >= 100) return;
  const { x, y } = edgeSpawnPoint();
  const base = {
    normal: { hp: 22, speed: 62,  damage: 14, r: 12, color: '#5e8c4a', money: 3 },
    fast:   { hp: 14, speed: 120, damage: 10, r: 9,  color: '#a85040', money: 5 },
    tank:   { hp: 75, speed: 38,  damage: 26, r: 19, color: '#374827', money: 14 },
  }[type];
  if (!base) return;
  const hpMul   = 1 + wave * 0.09;
  const dmgMul  = 1 + wave * 0.025;
  const moneyMul = 1 + wave * 0.04;
  const hp = Math.ceil(base.hp * hpMul);
  zombies.push({
    x, y, type,
    r: base.r, color: base.color, speed: base.speed,
    hp, hpMax: hp,
    damage: base.damage * dmgMul,
    money: Math.ceil(base.money * moneyMul),
    phase: Math.random() * Math.PI * 2,
  });
}

// Trainer dummy — stationary punching bag at the center of the arena. Massive
// HP, no movement, no contact damage. Shows damage floaters when hit so the
// player can see exactly how much each weapon dishes out.
function spawnTrainerDummy() {
  zombies.push({
    x: W / 2, y: H / 2,
    type: 'dummy',
    isDummy: true,
    r: 18,
    color: '#cdd1da',
    speed: 0,
    hp: 99999, hpMax: 99999,
    damage: 0,
    money: 0,
    phase: 0,
  });
}

function spawnBoss() {
  const bossNum = Math.max(1, Math.floor(wave / 20));
  const { x, y } = edgeSpawnPoint();
  const hp = 400 + bossNum * 400;
  zombies.push({
    x, y, type: 'boss', isBoss: true,
    r: 32 + bossNum * 3,
    color: '#9a2828',
    speed: 45 + bossNum * 6,
    hp, hpMax: hp,
    damage: 32 + bossNum * 8,
    money: 150 + bossNum * 90,
    minionTimer: 4 + Math.random() * 1.5,
    phase: Math.random() * Math.PI * 2,
  });
}

function spawnBossMinions(boss, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const dist = boss.r + 12;
    const x = boss.x + Math.cos(a) * dist;
    const y = boss.y + Math.sin(a) * dist;
    const hp = Math.ceil(16 + wave * 0.6);
    zombies.push({
      x, y, type: 'minion',
      r: 9, color: '#8b3a3a', speed: 115,
      hp, hpMax: hp, damage: 12, money: 3,
      phase: Math.random() * Math.PI * 2,
    });
  }
}

function beginNextWave() {
  wave++;
  bestWave = Math.max(bestWave, wave);
  isBossWave = (wave % 20 === 0);
  if (isBossWave) {
    waveZombiesToSpawn = 0;
    spawnBoss();
    SFX.bossSpawn();
  } else {
    waveZombiesToSpawn = 5 + Math.floor(wave * 1.8);
    waveSpawnTimer = 0.4;
    SFX.waveStart();
  }
  // each wave gets a free money crate somewhere in the arena
  spawnMoneyCrate();
  if (wave > 0 && wave % 5 === 0) spawnMoneyCrate(); // bonus every 5 waves
  // ...and a random pickup
  spawnRandomPickup();
  if (wave > 0 && wave % 5 === 0) spawnRandomPickup(); // bonus every 5 waves
}

function endCurrentWave() {
  player.money += 8 + wave * 3;
  intermission = isBossWave ? 12 : 7; // longer breather after a boss
  // every wave offers 3 random perks to pick from
  pendingCards = pickThreeUpgrades();
}

function pickThreeUpgrades() {
  // Fisher–Yates shuffle, take first 3 — guarantees distinct cards in one offer.
  const arr = SPECIAL_KEYS.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr.slice(0, 3);
}

function pickCard(idx) {
  if (!pendingCards) return;
  const key = pendingCards[idx];
  if (!key) return;
  const def = SPECIAL_UPGRADES[key];
  SFX.perkPick();
  def.apply();
  player.specialLevels[key] = (player.specialLevels[key] || 0) + 1;
  // celebratory burst at the picked card
  const r = cardRects[idx];
  if (r) {
    const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
    for (let i = 0; i < 32; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 100 + Math.random() * 280;
      particles.push({ x: cx, y: cy, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.7 + Math.random()*0.3, color: def.color });
    }
    floaters.push({ x: cx, y: cy - 30, text: def.name + (player.specialLevels[key] > 1 ? ` LV ${player.specialLevels[key]}` : ''), life: 2.2, color: def.color });
  }
  shake(6);
  pendingCards = null;
  cardRects = [null, null, null];
}

function updateWave(dt) {
  // Card pick blocks the wave from starting — perk first, then manual start.
  if (pendingCards) return;
  if (intermission > 0) {
    // No auto-advance — the next wave only starts when the player presses
    // Space or clicks START NOW. Stay parked at the current intermission
    // value so the UI keeps the "ready to start" panel visible.
    return;
  }
  // spawn remaining zombies for this wave (boss waves spawn 0)
  if (waveZombiesToSpawn > 0) {
    waveSpawnTimer -= dt;
    while (waveSpawnTimer <= 0 && waveZombiesToSpawn > 0) {
      spawnZombie();
      waveZombiesToSpawn--;
      waveSpawnTimer += Math.max(0.16, 0.85 - wave * 0.013);
    }
  } else if (zombies.every(z => z.isDummy) && wave > 0) {
    // Dummies (training props) don't count toward wave completion
    endCurrentWave();
  }
}

function tryShoot(nowSec) {
  const w = WEAPONS[player.weapon] || WEAPONS.pistol;
  const fr = player.fireRate * w.fireRate * (player.buffs.rapid > 0 ? 2 : 1);
  const interval = 1 / fr;
  if (nowSec - player.lastShot < interval) return;
  player.lastShot = nowSec;
  SFX.shoot(player.weapon);

  const dx = mouse.x - player.x, dy = mouse.y - player.y;
  const baseAng = Math.atan2(dy, dx);
  const extra = player.buffs.triple > 0 ? 2 : 0;          // triple buff = +2 spread shots
  // Multishot perk: rolls once per trigger pull to add a bonus shot.
  let shots = w.shots + extra;
  if (player.special.multishot && Math.random() < player.special.multishot) shots += 1;
  const spread = w.spread + (extra > 0 ? 0.16 : 0);

  // Base per-bullet damage, modified by glass-cannon + berserk perks.
  let dmgBase = player.damage * w.damage;
  dmgBase *= 1 + (player.special.glassCannon || 0);
  if (player.special.berserk && player.hp / player.maxHp < 0.3) {
    dmgBase *= 1 + player.special.berserk;
  }
  const bSpeed = player.bulletSpeed * w.bulletSpeed;
  const pierce = w.pierce + player.pierce;

  const muzzleX = player.x + Math.cos(baseAng) * (player.r + 8);
  const muzzleY = player.y + Math.sin(baseAng) * (player.r + 8);
  muzzleFlash(muzzleX, muzzleY, baseAng);

  // Pattern dispatch: each special weapon picks its own set of fire angles.
  let angles;
  if (w.pattern === 'plus') {
    // 4-arm cross that rotates with the aim direction — the "forward" arm
    // points at the mouse, the other three are 90° offsets from it.
    angles = [baseAng, baseAng + Math.PI / 2, baseAng + Math.PI, baseAng - Math.PI / 2];
    // multishot rolls a 5th forward bullet for fun
    if (shots > w.shots + extra) angles.push(baseAng);
  } else if (w.pattern === 'orbit') {
    // bullets are spawned orbiting the player, evenly spaced around baseAng
    angles = [];
    const n = w.shots;
    for (let i = 0; i < n; i++) angles.push(baseAng + (i / n) * Math.PI * 2);
  } else if (w.pattern === 'twin') {
    // two parallel shots — same angle, offset perpendicular to aim
    angles = [baseAng, baseAng];
  } else {
    // standard fan spread used by every original weapon
    angles = [];
    for (let i = 0; i < shots; i++) {
      angles.push(baseAng + (shots > 1 ? (i - (shots - 1) / 2) * spread : 0));
    }
  }

  let twinIdx = 0;
  for (const a of angles) {
    const isCrit = !!(player.special.crit && Math.random() < player.special.crit);
    const dmg = isCrit ? dmgBase * 2 : dmgBase;
    const isOrbit = w.pattern === 'orbit';
    // perpendicular offset for the twin pistols
    const twinOff = (w.pattern === 'twin') ? ((twinIdx++ === 0) ? -6 : 6) : 0;
    const perpX = -Math.sin(a) * twinOff, perpY = Math.cos(a) * twinOff;
    const sx = isOrbit
      ? player.x + Math.cos(a) * w.orbitRadius
      : player.x + Math.cos(a) * (player.r + 4) + perpX;
    const sy = isOrbit
      ? player.y + Math.sin(a) * w.orbitRadius
      : player.y + Math.sin(a) * (player.r + 4) + perpY;
    bullets.push({
      x: sx, y: sy,
      vx: isOrbit ? 0 : Math.cos(a) * bSpeed,
      vy: isOrbit ? 0 : Math.sin(a) * bSpeed,
      damage: dmg, pierce,
      hits: new Set(),
      life: w.life,
      color: isCrit ? '#fff5a8' : w.color,
      explosive: !!w.explosive,
      blastR: w.blastR || 0,
      blastDmg: w.blastDmg || 0,
      bulletKind: isOrbit ? 'orbit' : (w.bulletKind || null),
      bounces: w.bounces || 0,
      leavesSlick: !!w.leavesSlick,
      spawnChicks: w.spawnChicks || 0,
      // tesla chain-lightning fields
      chains: w.chains || 0,
      chainRange: w.chainRange || 0,
      // orbiter fields
      orbitAngle: isOrbit ? a : 0,
      orbitRadius: isOrbit ? w.orbitRadius : 0,
      orbitSpeed: isOrbit ? w.orbitSpeed : 0,
      isCrit,
    });
  }
}

// ---------- Secondary weapons ----------
// Compute the damage modifier from crit + glass-cannon + berserk perks.
// Returns { dmg, isCrit } so callers can tint visuals on crit.
function rollPerkedDamage(baseDmg) {
  let dmg = baseDmg * (1 + (player.special.glassCannon || 0));
  if (player.special.berserk && player.hp / player.maxHp < 0.3) {
    dmg *= 1 + player.special.berserk;
  }
  const isCrit = !!(player.special.crit && Math.random() < player.special.crit);
  if (isCrit) dmg *= 2;
  return { dmg, isCrit };
}

function useSecondary() {
  const def = player.secondary && SECONDARIES[player.secondary];
  if (!def) return;
  if (gameTime - player.lastSecondary < def.cooldown) return;
  player.lastSecondary = gameTime;
  const ang = Math.atan2(mouse.y - player.y, mouse.x - player.x);
  if (def.kind === 'melee')      swingMelee(def, ang);
  else if (def.kind === 'thrown') throwBlades(def, ang);
  else if (def.kind === 'returning') throwChakram(def, ang);
  else if (def.kind === 'heal')   useHeal(def);
  else if (def.kind === 'decoy')  useDecoy(def);
  else if (def.kind === 'stun')   useStun(def);
  else if (def.kind === 'summon') useSummon(def);
  else if (def.kind === 'field')  useField(def);
}

function useSummon(def) {
  if (def.summon === 'chicken') {
    for (let i = 0; i < def.count; i++) {
      const a = Math.random() * Math.PI * 2;
      summons.push({
        kind: 'chicken',
        x: player.x + Math.cos(a) * 18,
        y: player.y + Math.sin(a) * 18,
        vx: Math.cos(a) * 80, vy: Math.sin(a) * 80,
        hp: 24, hpMax: 24,
        life: 12,
        dmg: 22,        // damage per second on contact
        speed: 165,
      });
    }
  }
  // poof of feathers when the tome opens
  for (let k = 0; k < 22; k++) {
    const a = Math.random() * Math.PI * 2;
    const s = 100 + Math.random() * 180;
    particles.push({ x: player.x, y: player.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.5, color: k % 2 ? '#fff5b8' : '#ffe066' });
  }
  SFX.chestOpen();
}

function useField(def) {
  healFields.push({ x: player.x, y: player.y, r: def.radius, life: def.life, max: def.life, hps: def.hps, color: def.color });
  // spawn ring of soothing particles
  for (let i = 0; i < 20; i++) {
    const a = (i / 20) * Math.PI * 2;
    particles.push({ x: player.x, y: player.y, vx: Math.cos(a)*120, vy: Math.sin(a)*120, life: 0.6, color: def.color });
  }
  SFX.pickup();
}

function updateSummons(dt) {
  for (let i = summons.length - 1; i >= 0; i--) {
    const s = summons[i];
    s.life -= dt;
    if (s.life <= 0 || s.hp <= 0) {
      for (let k = 0; k < 10; k++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 60 + Math.random() * 140;
        particles.push({ x: s.x, y: s.y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 0.5, color: k % 2 ? '#fff5b8' : '#ffe066' });
      }
      summons.splice(i, 1);
      continue;
    }
    // home toward the nearest zombie; if none, wander idly
    let near = null, bd2 = Infinity;
    for (const z of zombies) {
      const dx = z.x - s.x, dy = z.y - s.y;
      const d2 = dx*dx + dy*dy;
      if (d2 < bd2) { bd2 = d2; near = z; }
    }
    if (near) {
      const dx = near.x - s.x, dy = near.y - s.y;
      const d = Math.hypot(dx, dy) || 1;
      s.vx = (dx / d) * s.speed;
      s.vy = (dy / d) * s.speed;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      // pecking contact damage
      if (d < near.r + 9) {
        near.hp -= s.dmg * dt;
        if (near.hp <= 0) {
          const idx = zombies.indexOf(near);
          if (idx >= 0) { killZombie(near); zombies.splice(idx, 1); }
        }
      }
    } else {
      // idle wander
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.vx *= 0.95;
      s.vy *= 0.95;
    }
    s.x = Math.max(6, Math.min(W - 6, s.x));
    s.y = Math.max(6, Math.min(H - 6, s.y));
  }
}

function updateHealFields(dt) {
  for (let i = healFields.length - 1; i >= 0; i--) {
    const f = healFields[i];
    f.life -= dt;
    if (f.life <= 0) { healFields.splice(i, 1); continue; }
    // heal the player if standing on the pad
    const dx = player.x - f.x, dy = player.y - f.y;
    if (dx*dx + dy*dy < f.r * f.r) {
      player.hp = Math.min(player.maxHp, player.hp + f.hps * dt);
    }
  }
}

// Permanent dash — bound to Shift, gated by player.dashCooldown.
function tryDash() {
  if (pendingCards || inShop()) return;
  if (gameTime - player.lastDash < player.dashCooldown) return;
  player.lastDash = gameTime;
  const ang = Math.atan2(mouse.y - player.y, mouse.x - player.x);
  const oldX = player.x, oldY = player.y;
  const tx = player.x + Math.cos(ang) * player.dashDistance;
  const ty = player.y + Math.sin(ang) * player.dashDistance;
  player.x = Math.max(player.r, Math.min(W - player.r, tx));
  player.y = Math.max(player.r, Math.min(H - player.r, ty));
  player.invuln = Math.max(player.invuln, player.dashInvuln);
  for (let k = 0; k < 10; k++) {
    const t = k / 10;
    particles.push({
      x: oldX + (player.x - oldX) * t,
      y: oldY + (player.y - oldY) * t,
      vx: 0, vy: 0,
      life: 0.32 - t * 0.22,
      color: '#5cffec',
    });
  }
  SFX.swing();
  shake(3);
}

// ----- Utility secondaries -----
function useHeal(def) {
  const before = player.hp;
  player.hp = Math.min(player.maxHp, player.hp + def.heal);
  const gained = player.hp - before;
  if (gained > 0) {
    floaters.push({ x: player.x, y: player.y - 22, text: `+${Math.ceil(gained)} HP`, life: 1.6, color: def.color });
    for (let i = 0; i < 18; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 60 + Math.random() * 120;
      particles.push({ x: player.x, y: player.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.55, color: def.color });
    }
  }
  SFX.pickup();
}

function useDecoy(def) {
  decoys.push({ x: player.x, y: player.y, hp: def.hp, hpMax: def.hp, life: def.life });
  // spawn ring
  for (let i = 0; i < 18; i++) {
    const a = (i / 18) * Math.PI * 2;
    particles.push({ x: player.x, y: player.y, vx: Math.cos(a) * 120, vy: Math.sin(a) * 120, life: 0.45, color: def.color });
  }
  SFX.crate();
}

function useStun(def) {
  for (const z of zombies) {
    const dx = z.x - player.x, dy = z.y - player.y;
    if (dx*dx + dy*dy < def.radius * def.radius) {
      z.slowTimer = Math.max(z.slowTimer || 0, def.duration);
    }
  }
  // expanding ring particles
  for (let i = 0; i < 56; i++) {
    const a = (i / 56) * Math.PI * 2;
    const s = 220 + Math.random() * 80;
    particles.push({ x: player.x, y: player.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.65, color: def.color });
  }
  shake(10);
  SFX.unlock();
}

function nearestDecoy(z) {
  let best = null, bd2 = 300 * 300; // zombies only notice decoys within ~300px
  for (const d of decoys) {
    if (d.hp <= 0) continue;
    const dx = d.x - z.x, dy = d.y - z.y;
    const d2 = dx*dx + dy*dy;
    if (d2 < bd2) { bd2 = d2; best = d; }
  }
  return best;
}

function updateDecoys(dt) {
  for (let i = decoys.length - 1; i >= 0; i--) {
    const d = decoys[i];
    d.life -= dt;
    if (d.life <= 0 || d.hp <= 0) {
      // poof
      for (let k = 0; k < 20; k++) {
        const a = Math.random() * Math.PI * 2;
        const s = 80 + Math.random() * 160;
        particles.push({ x: d.x, y: d.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.6, color: '#ffce44' });
      }
      decoys.splice(i, 1);
    }
  }
}

// ---------- Buildings ----------
function snapBuildPos(x, y) {
  const g = 40;
  // grid cells are centered at multiples of g
  return { x: Math.round(x / g) * g, y: Math.round(y / g) * g };
}

function canPlaceBuilding(x, y, def) {
  // canvas bounds
  if (x - def.w/2 < 0 || x + def.w/2 > W) return false;
  if (y - def.h/2 < 0 || y + def.h/2 > H) return false;
  // shop area is off-limits
  if (x + def.w/2 > shop.x - 4 && x - def.w/2 < shop.x + shop.w + 4
   && y + def.h/2 > shop.y - 4 && y - def.h/2 < shop.y + shop.h + 4) return false;
  // overlap with other buildings
  for (const b of buildings) {
    if (Math.abs(x - b.x) < (def.w + b.w) / 2 && Math.abs(y - b.y) < (def.h + b.h) / 2) return false;
  }
  // overlap with player (would trap us)
  if (Math.abs(x - player.x) < def.w/2 + player.r && Math.abs(y - player.y) < def.h/2 + player.r) return false;
  return true;
}

function tryPlaceBuilding() {
  const def = BUILDINGS[buildSelected];
  if (!def) return;
  const { x, y } = snapBuildPos(mouse.x, mouse.y);
  if (!canPlaceBuilding(x, y, def)) return;
  if (player.money < def.cost) return;
  player.money -= def.cost;
  buildings.push({
    type: buildSelected,
    x, y,
    hp: def.hp, hpMax: def.hp,
    w: def.w, h: def.h,
    color: def.color,
    blocks: !!def.blocks,
    fireRate: def.fireRate || 0,
    range: def.range || 0,
    damage: def.damage || 0,
    dps: def.dps || 0,
    lastShot: 0,
    aimAng: 0,
  });
  dropBurst(x, y, def.color, 14);
  SFX.crate();
}

function updateBuildings(dt) {
  for (let i = buildings.length - 1; i >= 0; i--) {
    const b = buildings[i];
    if (b.hp <= 0) {
      for (let k = 0; k < 22; k++) {
        const a = Math.random() * Math.PI * 2;
        const s = 80 + Math.random() * 200;
        particles.push({ x: b.x, y: b.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.6, color: b.color });
      }
      shake(6);
      SFX.explosion();
      buildings.splice(i, 1);
      continue;
    }
    if (b.type === 'turret') {
      b.lastShot -= dt;
      // pick the nearest zombie within range
      let near = null, bd2 = b.range * b.range;
      for (const z of zombies) {
        const dx = z.x - b.x, dy = z.y - b.y;
        const d2 = dx*dx + dy*dy;
        if (d2 < bd2) { bd2 = d2; near = z; }
      }
      if (near) {
        b.aimAng = Math.atan2(near.y - b.y, near.x - b.x);
        if (b.lastShot <= 0) {
          b.lastShot = 1 / b.fireRate;
          const ang = b.aimAng;
          bullets.push({
            x: b.x + Math.cos(ang) * 18,
            y: b.y + Math.sin(ang) * 18,
            vx: Math.cos(ang) * 760,
            vy: Math.sin(ang) * 760,
            damage: b.damage,
            pierce: 0,
            hits: new Set(),
            life: 1.0,
            color: b.color,
            explosive: false, blastR: 0, blastDmg: 0,
            bulletKind: null,
            bounces: 0, leavesSlick: false, spawnChicks: 0,
            chains: 0, chainRange: 0,
            orbitAngle: 0, orbitRadius: 0, orbitSpeed: 0,
            isCrit: false,
          });
          SFX.shoot('pistol');
        }
      }
    } else if (b.type === 'spike') {
      // damage zombies standing on the trap
      for (let j = zombies.length - 1; j >= 0; j--) {
        const z = zombies[j];
        if (Math.abs(z.x - b.x) < b.w/2 + z.r && Math.abs(z.y - b.y) < b.h/2 + z.r) {
          z.hp -= b.dps * dt;
          if (z.hp <= 0) {
            killZombie(z);
            zombies.splice(j, 1);
          }
        }
      }
    }
  }
}

function swingMelee(def, ang) {
  // damage every zombie inside the arc in front of the player
  for (let i = zombies.length - 1; i >= 0; i--) {
    const z = zombies[i];
    const dx = z.x - player.x, dy = z.y - player.y;
    const d = Math.hypot(dx, dy);
    if (d > def.range + z.r) continue;
    const zAng = Math.atan2(dy, dx);
    let da = zAng - ang;
    while (da >  Math.PI) da -= Math.PI*2;
    while (da < -Math.PI) da += Math.PI*2;
    if (Math.abs(da) > def.arc / 2) continue;

    const { dmg, isCrit } = rollPerkedDamage(def.damage);
    const dealt = Math.min(dmg, z.hp);
    z.hp -= dmg;
    if (player.special.lifesteal) {
      player.hp = Math.min(player.maxHp, player.hp + dealt * player.special.lifesteal);
    }
    if (player.special.slow) {
      z.slowTimer = Math.max(z.slowTimer || 0, player.special.slow);
    }
    // knockback — push the zombie away from the player
    if (def.knockback) {
      const k = def.knockback / Math.max(d, 1);
      z.x += (dx / d) * def.knockback * 0.02; // small immediate displacement
      z.y += (dy / d) * def.knockback * 0.02;
    }
    if (z.hp <= 0) {
      killZombie(z);
      zombies.splice(i, 1);
    }
    if (isCrit) {
      for (let p = 0; p < 6; p++) {
        const a = Math.random() * Math.PI * 2;
        const s = 100 + Math.random() * 180;
        particles.push({ x: z.x, y: z.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.4, color: '#fff5a8' });
      }
    }
  }
  slashes.push({ x: player.x, y: player.y, ang, life: 0.22, max: 0.22, range: def.range, arc: def.arc, color: def.color });
  shake(4);
  SFX.swing();
}

function throwBlades(def, ang) {
  SFX.throwBlade();
  for (let i = 0; i < def.shots; i++) {
    const a = ang + (i - (def.shots - 1) / 2) * def.spread;
    const { dmg, isCrit } = rollPerkedDamage(def.damage);
    bullets.push({
      x: player.x + Math.cos(a) * (player.r + 4),
      y: player.y + Math.sin(a) * (player.r + 4),
      vx: Math.cos(a) * def.speed,
      vy: Math.sin(a) * def.speed,
      damage: dmg,
      pierce: def.pierce,
      hits: new Set(),
      life: def.life,
      color: isCrit ? '#fff5a8' : def.color,
      explosive: false, blastR: 0, blastDmg: 0,
      bulletKind: 'kunai',
      bounces: 0, leavesSlick: false, spawnChicks: 0,
      isCrit,
    });
  }
}

function throwChakram(def, ang) {
  SFX.throwBlade();
  const { dmg, isCrit } = rollPerkedDamage(def.damage);
  bullets.push({
    x: player.x + Math.cos(ang) * (player.r + 6),
    y: player.y + Math.sin(ang) * (player.r + 6),
    vx: Math.cos(ang) * def.speed,
    vy: Math.sin(ang) * def.speed,
    damage: dmg,
    pierce: def.pierce,
    hits: new Set(),
    life: def.life,
    color: isCrit ? '#fff5a8' : def.color,
    explosive: false, blastR: 0, blastDmg: 0,
    bulletKind: 'chakram',
    bounces: 0, leavesSlick: false, spawnChicks: 0,
    chakramTimer: 0, returning: false, outTime: def.outTime,
    isCrit,
  });
}

function updateSlashes(dt) {
  for (let i = slashes.length - 1; i >= 0; i--) {
    slashes[i].life -= dt;
    if (slashes[i].life <= 0) slashes.splice(i, 1);

}

function updateSparks(dt) {
  for (let i = sparks.length - 1; i >= 0; i--) {
    sparks[i].life -= dt;
    if (sparks[i].life <= 0) sparks.splice(i, 1);
  }
}

// Tesla chain — jump damage from a starting zombie to up to `count` nearby
// zombies within `range`, scaling damage down per hop. Each hop spawns a
// short-lived spark for the visual.
function chainLightning(fromZ, baseDmg, count, range) {
  const visited = new Set([fromZ]);
  let lastX = fromZ.x, lastY = fromZ.y;
  let dmg = baseDmg * 0.7;
  for (let h = 0; h < count; h++) {
    let best = null, bestD2 = range * range;
    for (const z of zombies) {
      if (visited.has(z)) continue;
      const dx = z.x - lastX, dy = z.y - lastY;
      const d2 = dx*dx + dy*dy;
      if (d2 < bestD2) { bestD2 = d2; best = z; }
    }
    if (!best) break;
    sparks.push({ x1: lastX, y1: lastY, x2: best.x, y2: best.y, life: 0.18, max: 0.18 });
    const dealt = Math.min(dmg, best.hp);
    best.hp -= dmg;
    if (player.special.lifesteal) {
      player.hp = Math.min(player.maxHp, player.hp + dealt * player.special.lifesteal);
    }
    if (player.special.slow) {
      best.slowTimer = Math.max(best.slowTimer || 0, player.special.slow);
    }
    if (best.hp <= 0) {
      const idx = zombies.indexOf(best);
      if (idx >= 0) { killZombie(best); zombies.splice(idx, 1); }
    } else {
      visited.add(best);
      lastX = best.x; lastY = best.y;
      dmg *= 0.7;
    }
  }
}

function explode(x, y, radius, dmg) {
  // damage zombies in radius
  for (let j = zombies.length - 1; j >= 0; j--) {
    const z = zombies[j];
    const dx = z.x - x, dy = z.y - y;
    if (dx*dx + dy*dy < radius * radius) {
      const dmgDealt = Math.min(dmg, z.hp);
      z.hp -= dmg;
      if (player.special.lifesteal) {
        player.hp = Math.min(player.maxHp, player.hp + dmgDealt * player.special.lifesteal);
      }
      if (player.special.slow) {
        z.slowTimer = Math.max(z.slowTimer || 0, player.special.slow);
      }
      if (z.hp <= 0) {
        killZombie(z);
        zombies.splice(j, 1);
      }
    }
  }
  for (let i = 0; i < 24; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 120 + Math.random() * 220;
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.5 + Math.random()*0.3, color: '#ff8040' });
  }
  shake(14);
  SFX.explosion();
}

function detonateNuke(x, y) {
  for (const z of zombies) {
    kills++;
    spawnDeathParticles(z.x, z.y, z.color);
    addBlood(z.x, z.y, z.isBoss ? 2 : 1);
    dropCoinsFor(z);
  }
  zombies.length = 0;
  for (let i = 0; i < 40; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 200 + Math.random() * 300;
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.6, color: '#ffd166' });
  }
  shake(20);
  flashRed = Math.max(flashRed, 0.25);
}

function spawnPickupAt(x, y, type) {

  if (!def) return;
  pickups.push({ x, y, type, life: 30 });
  dropBurst(x, y, def.color, 16);
}

function spawnRandomPickup() {
  const type = PICKUP_KEYS[Math.floor(Math.random() * PICKUP_KEYS.length)];
  for (let tries = 0; tries < 25; tries++) {
    const x = 80 + Math.random() * (W - 160);
    const y = 80 + Math.random() * (H - 160);
    if (x > shop.x - 20 && x < shop.x + shop.w + 20 &&
        y > shop.y - 20 && y < shop.y + shop.h + 20) continue;
    if (Math.hypot(x - player.x, y - player.y) < 140) continue;
    spawnPickupAt(x, y, type);
    return;

}

function tryDropPickup(z) {
  let chance = 0;
  if (z.isBoss)            chance = 1.0;
  else if (z.type === 'tank') chance = 0.18;
  else if (z.type === 'fast') chance = 0.09;
  else                     chance = 0.05;
  if (Math.random() >= chance) return;
  const type = PICKUP_KEYS[Math.floor(Math.random() * PICKUP_KEYS.length)];
  spawnPickupAt(z.x, z.y, type);
}

function updatePickups(dt) {
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    p.life -= dt;
    if (p.life <= 0) { pickups.splice(i, 1); continue; }
    const def = PICKUP_TYPES[p.type];
    const dx = player.x - p.x, dy = player.y - p.y;
    if (dx*dx + dy*dy < (player.r + 14) * (player.r + 14)) {
      def.apply();
      SFX.pickup();
      for (let k = 0; k < 18; k++) {
        const a = Math.random() * Math.PI * 2;
        const s = 100 + Math.random() * 200;
        particles.push({ x: p.x, y: p.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.55, color: def.color });
      }
      pickups.splice(i, 1);
    }
  }
}

function dropGunAt(x, y, weapon, life) {

}

// Boss-defeat chest. Spawned when a boss dies; opens on contact and grants
// a random permanent upgrade for free.
function spawnBossChest(x, y) {

  dropBurst(x, y, '#ffd166', 28);
  shake(6);
}

function openChest(c) {
  SFX.chestOpen();
  const perms = upgrades.filter(u => u.type === 'perm');
  const pick = perms[Math.floor(Math.random() * perms.length)];
  pick.buy(); // applies effect AND bumps cost — consistent with shop purchases
  floaters.push({ x: c.x, y: c.y - 8, text: pick.name + '  (FREE)', life: 2.4, color: '#ffe066' });

  }
  shake(10);
  flashRed = Math.max(flashRed, 0); // intentionally no red flash for a reward
}

function updateChests(dt) {
  for (let i = chests.length - 1; i >= 0; i--) {
    const c = chests[i];
    const dx = player.x - c.x, dy = player.y - c.y;

      openChest(c);
      chests.splice(i, 1);

}

function updateFloaters(dt) {
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.life -= dt;
    f.y -= 28 * dt;
    if (f.life <= 0) floaters.splice(i, 1);
