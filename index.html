}

function tryDropGun(z) {
  // bosses always drop, tanks have higher chance, regulars rare
  let chance = 0;
  if (z.isBoss)            chance = 1.0;
  else if (z.type === 'tank') chance = 0.10;
  else if (z.type === 'fast') chance = 0.02;
  else                     chance = 0.012;
  if (Math.random() >= chance) return;
  const weapon = DROPPABLE_WEAPONS[Math.floor(Math.random() * DROPPABLE_WEAPONS.length)];
  dropGunAt(z.x, z.y, weapon, 22);
}

function updatePlayer(dt) {
  let dx = 0, dy = 0;
  if (keys['KeyW'] || keys['ArrowUp'])    dy -= 1;
  if (keys['KeyS'] || keys['ArrowDown'])  dy += 1;
  if (keys['KeyA'] || keys['ArrowLeft'])  dx -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) dx += 1;
  const len = Math.hypot(dx, dy);
  if (len > 0) { dx /= len; dy /= len; }
  const sp = player.speed * (player.buffs.fast > 0 ? 1.5 : 1);
  player.x = Math.max(player.r, Math.min(W - player.r, player.x + dx * sp * dt));
  player.y = Math.max(player.r, Math.min(H - player.r, player.y + dy * sp * dt));

  if (player.invuln > 0) player.invuln -= dt;

  for (const k in player.buffs) {
    if (k === 'shield') continue;
    if (player.buffs[k] > 0) {
      player.buffs[k] -= dt;
      if (player.buffs[k] < 0) player.buffs[k] = 0;
    }
  }

  // Regen perk — passive HP recovery
  if (player.special.regen) {
    player.hp = Math.min(player.maxHp, player.hp + player.special.regen * dt);
  }
}

function zombieCanEnter(x, y, r) {
  // shop area is impassable
  if (x + r > shop.x && x - r < shop.x + shop.w
   && y + r > shop.y && y - r < shop.y + shop.h) return false;
  // blocking buildings (walls + turrets) act as solid AABBs
  for (const b of buildings) {
    if (!b.blocks) continue;
    if (x + r > b.x - b.w/2 && x - r < b.x + b.w/2
     && y + r > b.y - b.h/2 && y - r < b.y + b.h/2) return false;
  }
  return true;
}

function updateZombies(dt) {
  for (let i = zombies.length - 1; i >= 0; i--) {
    const z = zombies[i];
    // Dummies don't move, don't attack, don't aggro on anything.
    if (z.isDummy) continue;
    // Aggro toward the nearest decoy if there is one, else the player.
    const lure = nearestDecoy(z);
    const tx = lure ? lure.x : player.x;
    const ty = lure ? lure.y : player.y;
    const dx = tx - z.x, dy = ty - z.y;
    const d = Math.hypot(dx, dy) || 1;
    // banana slicks slow whoever's on top of them
    let speedMul = 1;
    for (const s of slicks) {
      const sx = z.x - s.x, sy = z.y - s.y;
      if (sx*sx + sy*sy < s.r * s.r) { speedMul = 0.35; break; }
    }
    // cold-bullets slow timer
    if (z.slowTimer && z.slowTimer > 0) {
      z.slowTimer -= dt;
      speedMul = Math.min(speedMul, 0.45);
    }
    const effSpeed = z.speed * speedMul;
    const nx = z.x + (dx / d) * effSpeed * dt;
    const ny = z.y + (dy / d) * effSpeed * dt;
    if (zombieCanEnter(nx, z.y, z.r)) z.x = nx;
    if (zombieCanEnter(z.x, ny, z.r)) z.y = ny;

    // boss periodically summons minions
    if (z.isBoss) {
      z.minionTimer -= dt;
      if (z.minionTimer <= 0) {
        z.minionTimer = 4 + Math.random() * 2;
        spawnBossMinions(z, 3);
      }
    }

    // contact damage to player + thorns retaliation
    // dx/dy/d above point toward whatever the zombie is chasing (player or
    // decoy). Recompute against the player specifically for damage.
    const pdx = player.x - z.x, pdy = player.y - z.y;
    const pd = Math.hypot(pdx, pdy) || 1;
    const rr = z.r + player.r;
    const inContact = pdx*pdx + pdy*pdy < rr*rr;
    if (inContact && player.invuln <= 0 && !godMode) {
      if (player.buffs.shield > 0) {
        player.buffs.shield = 0;
        const knock = 12 / pd;
        player.x -= pdx * knock;
        player.y -= pdy * knock;
        player.invuln = 0.6;
        shake(8);
      } else {
        player.hp -= z.damage * dt;
        flashRed = Math.max(flashRed, Math.min(0.35, z.damage * dt * 0.03));
        SFX.playerHurt();
      }
    }
    // Thorns hits any zombie touching the player, even through invuln/shield.
    if (inContact && player.special.thorns) {
      z.hp -= player.special.thorns * dt;
      if (z.hp <= 0) {
        killZombie(z);
        zombies.splice(i, 1);
        continue;
      }
    }
    // Decoy contact damage — zombies tear into the decoy when in range.
    for (const dc of decoys) {
      const ddx = dc.x - z.x, ddy = dc.y - z.y;
      const drr = z.r + 14;
      if (ddx*ddx + ddy*ddy < drr*drr) {
        dc.hp -= z.damage * dt;
      }
    }
    // Building contact damage — zombies bash at walls/turrets they can't pass.
    for (const b of buildings) {
      if (Math.abs(z.x - b.x) < b.w/2 + z.r && Math.abs(z.y - b.y) < b.h/2 + z.r) {
        b.hp -= z.damage * dt * 0.5;
      }
    }
  }
}

function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    // chakram: flies out, then loops back to the player
    if (b.bulletKind === 'chakram') {
      b.chakramTimer = (b.chakramTimer || 0) + dt;
      if (!b.returning && b.chakramTimer >= b.outTime) {
        b.returning = true;
        b.hits.clear();
      }
      if (b.returning) {
        const tgtA = Math.atan2(player.y - b.y, player.x - b.x);
        const curA = Math.atan2(b.vy, b.vx);
        let da = tgtA - curA;
        while (da >  Math.PI) da -= Math.PI*2;
        while (da < -Math.PI) da += Math.PI*2;
        const turn = Math.sign(da) * Math.min(Math.abs(da), 9 * dt);
        const newA = curA + turn;
        const sp = Math.hypot(b.vx, b.vy);
        b.vx = Math.cos(newA) * sp;
        b.vy = Math.sin(newA) * sp;
        const ddx = player.x - b.x, ddy = player.y - b.y;
        if (ddx*ddx + ddy*ddy < 30 * 30) {
          bullets.splice(i, 1);
          continue;
        }
      }
    }
    // homing chicks adjust velocity toward nearest zombie
    if (b.homing) {
      let near = null, bd2 = Infinity;
      for (const z of zombies) {
        const dx = z.x - b.x, dy = z.y - b.y;
        const d2 = dx*dx + dy*dy;
        if (d2 < bd2) { bd2 = d2; near = z; }
      }
      if (near) {
        const tgtA = Math.atan2(near.y - b.y, near.x - b.x);
        const curA = Math.atan2(b.vy, b.vx);
        let da = tgtA - curA;
        while (da >  Math.PI) da -= Math.PI*2;
        while (da < -Math.PI) da += Math.PI*2;
        const turn = Math.sign(da) * Math.min(Math.abs(da), 9 * dt);
        const newA = curA + turn;
        const sp = Math.hypot(b.vx, b.vy);
        b.vx = Math.cos(newA) * sp;
        b.vy = Math.sin(newA) * sp;
      }
    }
    // orbiter: position is computed from the player + orbit angle each frame
    if (b.bulletKind === 'orbit') {
      b.orbitAngle += b.orbitSpeed * dt;
      b.x = player.x + Math.cos(b.orbitAngle) * b.orbitRadius;
      b.y = player.y + Math.sin(b.orbitAngle) * b.orbitRadius;
      // clear hit set every short interval so the same zombie can be hit on
      // each pass — otherwise an orbit just brushes everyone once.
      b.orbitHitClear = (b.orbitHitClear || 0) - dt;
      if (b.orbitHitClear <= 0) {
        b.hits.clear();
        b.orbitHitClear = 0.35;
      }
    } else {
      b.x += b.vx * dt;
      b.y += b.vy * dt;
    }
    b.life -= dt;
    if (b.life <= 0 || (b.bulletKind !== 'orbit' && (b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20))) {
      // banana drops a slick where it dies
      if (b.leavesSlick && b.x > 0 && b.x < W && b.y > 0 && b.y < H) addSlick(b.x, b.y);
      bullets.splice(i, 1);
      continue;
    }
    let consumed = false;
    for (let j = zombies.length - 1; j >= 0; j--) {
      const z = zombies[j];
      if (b.hits.has(z)) continue;
      const dx = z.x - b.x, dy = z.y - b.y;
      const rr = z.r + 3;
      if (dx*dx + dy*dy < rr*rr) {
        if (b.explosive) {
          explode(b.x, b.y, b.blastR, b.damage + b.blastDmg);
          if (b.spawnChicks > 0) spawnChicks(b.x, b.y, b.spawnChicks, b.damage * 0.5);
          consumed = true;
          break;
        }
        const dmgDealt = Math.min(b.damage, z.hp);
        z.hp -= b.damage;
        b.hits.add(z);
        SFX.zombieHit();
        // Trainer dummy shows a damage floater so you can read the numbers
        if (z.isDummy) {
          floaters.push({
            x: z.x + (Math.random() - 0.5) * 16,
            y: z.y - 14,
            text: (b.isCrit ? 'CRIT ' : '') + Math.round(b.damage).toString(),
            life: 0.8,
            color: b.isCrit ? '#fff5a8' : '#dfe2e8',
          });
        }
        // Tesla: chain to nearby zombies after the direct hit.
        if (b.bulletKind === 'lightning' && b.chains > 0) {
          chainLightning(z, b.damage, b.chains, b.chainRange);
        }
        // lifesteal — heal a fraction of damage actually dealt
        if (player.special.lifesteal) {
          player.hp = Math.min(player.maxHp, player.hp + dmgDealt * player.special.lifesteal);
        }
        // cold bullets — slow the target briefly
        if (player.special.slow) {
          z.slowTimer = Math.max(z.slowTimer || 0, player.special.slow);
        }
        if (z.hp <= 0) {
          killZombie(z);
          if (z.isBoss) shake(18);
          zombies.splice(j, 1);
        }
        // rubber duck: bounce off the zombie instead of being consumed
        if (b.bounces > 0) {
          b.bounces--;
          b.damage *= 0.75;
          b.hits.clear();
          const sp = Math.hypot(b.vx, b.vy);
          const newA = Math.atan2(b.vy, b.vx) + (Math.random() - 0.5) * 1.8 + Math.PI; // mostly reversed + scatter
          b.vx = Math.cos(newA) * sp;
          b.vy = Math.sin(newA) * sp;
          // tiny squeak puff
          for (let k = 0; k < 5; k++) {
            const a = Math.random() * Math.PI * 2;
            const s = 60 + Math.random() * 120;
            particles.push({ x: b.x, y: b.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.3, color: '#fff5b8' });
          }
          break;
        }
        // banana: leave a slick where it lands
        if (b.leavesSlick) {
          addSlick(b.x, b.y);
        }
        if (b.pierce <= 0) { consumed = true; break; }
        b.pierce--;
      }
    }
    if (consumed) bullets.splice(i, 1);
  }
}

function addSlick(x, y) {
  slicks.push({ x, y, r: 24, life: 8, max: 8, ang: Math.random() * Math.PI * 2 });
}

function updateSlicks(dt) {
  for (let i = slicks.length - 1; i >= 0; i--) {
    slicks[i].life -= dt;
    if (slicks[i].life <= 0) slicks.splice(i, 1);
  }
}

// Used by the Chicken Launcher: small homing chicks scatter from the explosion.
function spawnChicks(x, y, n, dmg) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 260 + Math.random() * 120;
    bullets.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      damage: Math.max(4, dmg),
      pierce: 0,
      hits: new Set(),
      life: 0.9,
      color: '#fff5b8',
      explosive: false,
      blastR: 0,
      blastDmg: 0,
      bulletKind: 'chick',
      homing: true,
      bounces: 0,
      leavesSlick: false,
      spawnChicks: 0,
    });
  }
  // burst of feathers
  for (let i = 0; i < 24; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 60 + Math.random() * 200;
    particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 0.7 + Math.random()*0.4, color: i % 2 ? '#fff5b8' : '#ffe066' });
  }
}

function updateGuns(dt) {
  nearbyGun = null;
  let bestD2 = 50 * 50; // hover radius
  for (let i = guns.length - 1; i >= 0; i--) {
    const g = guns[i];
    g.life -= dt;
    if (g.life <= 0) { guns.splice(i, 1); continue; }
    const dx = player.x - g.x, dy = player.y - g.y;
    const d2 = dx*dx + dy*dy;
    if (d2 < bestD2) { nearbyGun = g; bestD2 = d2; }
  }
}

function doSwapWeapon() {
  if (!nearbyGun || nearbyGun.weapon === player.weapon) return;
  SFX.swap();
  const old = player.weapon;
  const gx = nearbyGun.x, gy = nearbyGun.y;
  const newCol = WEAPONS[nearbyGun.weapon].color;
  player.weapon = nearbyGun.weapon;
  const idx = guns.indexOf(nearbyGun);
  if (idx >= 0) guns.splice(idx, 1);
  // drop old weapon at the player's feet (skip pistol — it's infinite ammo default)
  if (old !== 'pistol') {
    dropGunAt(player.x, player.y, old, 30);
  }
  for (let k = 0; k < 16; k++) {
    const a = Math.random() * Math.PI * 2;
    const s = 80 + Math.random() * 160;
    particles.push({ x: gx, y: gy, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.5, color: newCol });
  }
  nearbyGun = null;
}

function updateCrates(dt) {
  for (let i = crates.length - 1; i >= 0; i--) {
    const cr = crates[i];
    const dx = player.x - cr.x, dy = player.y - cr.y;
    if (dx*dx + dy*dy < (player.r + 14) * (player.r + 14)) {
      player.money += cr.value;
      SFX.crate();
      for (let k = 0; k < 14; k++) {
        const a = Math.random() * Math.PI * 2;
        const s = 80 + Math.random() * 180;
        particles.push({ x: cr.x, y: cr.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.6, color: '#ffce44' });
      }
      crates.splice(i, 1);
    }
  }
}

function spawnMoneyCrate() {
  for (let tries = 0; tries < 25; tries++) {
    const x = 80 + Math.random() * (W - 160);
    const y = 80 + Math.random() * (H - 160);
    if (x > shop.x - 20 && x < shop.x + shop.w + 20 &&
        y > shop.y - 20 && y < shop.y + shop.h + 20) continue;
    if (Math.hypot(x - player.x, y - player.y) < 160) continue;
    crates.push({ x, y, value: 20 + Math.floor(Math.random() * 30) + Math.floor(wave * 1.5) });
    dropBurst(x, y, '#ffce44', 18);
    return;
  }
}

function updateCoins(dt) {
  for (let i = coins.length - 1; i >= 0; i--) {
    const k = coins[i];
    // friction
    const f = Math.pow(0.001, dt);
    k.vx *= f; k.vy *= f;
    k.x += k.vx * dt;
    k.y += k.vy * dt;
    k.life -= dt;

    const dx = player.x - k.x, dy = player.y - k.y;
    const d = Math.hypot(dx, dy);
    const magnetR = 80 * (1 + (player.special.magnet || 0));
    if (d < magnetR) {
      // magnetize
      const pull = 280;
      k.x += (dx / d) * pull * dt;
      k.y += (dy / d) * pull * dt;
    }
    if (d < player.r + 5) {
      player.money += k.value;
      SFX.coin();
      coins.splice(i, 1);
    } else if (k.life <= 0) {
      coins.splice(i, 1);
    }
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= Math.pow(0.01, dt);
    p.vy *= Math.pow(0.01, dt);
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function checkDeath() {
  if (player.hp > 0) return;

  deaths++;
  bestKills = Math.max(bestKills, kills);
  SFX.death();

  // drop weapon (pistol is infinite default, not a real drop)
  if (player.weapon !== 'pistol') {
    dropGunAt(player.x, player.y, player.weapon, 60);
    player.weapon = 'pistol';
  }
  // drop money as a small shower of coins
  const drop = player.money;
  player.money = 0;
  if (drop > 0) {
    dropBurst(player.x, player.y, '#ffce44', 12);
    const n = Math.min(20, Math.max(4, Math.ceil(drop / 10)));
    const per = Math.max(1, Math.round(drop / n));
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 60 + Math.random() * 140;
      coins.push({ x: player.x, y: player.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, value: per, life: 60 });
    }
  }
  addBlood(player.x, player.y, 1.4);

  // reset player state
  player.hp = player.maxHp;
  player.x = SPAWN.x; player.y = SPAWN.y;
  for (const k in player.buffs) player.buffs[k] = 0;
  player.invuln = 2.0;

  // visual feedback
  shake(28);
  flashRed = 0.85;

  // restart the current wave from the beginning
  zombies.length = 0;
  bullets.length = 0;
  if (wave > 0) {
    if (isBossWave) {
      spawnBoss();
      waveZombiesToSpawn = 0;
    } else {
      waveZombiesToSpawn = 5 + Math.floor(wave * 1.8);
      waveSpawnTimer = 1.0;
    }
  }
}

function hardReset() {
  player.x = SPAWN.x; player.y = SPAWN.y;
  player.hp = player.maxHp = 100;
  player.money = 0;
  player.speed = 220;
  player.damage = 10;
  player.fireRate = 4;
  player.bulletSpeed = 700;
  player.pierce = 0;
  player.invuln = 0;
  player.lastShot = 0;
  for (const k in player.buffs) player.buffs[k] = 0;
  player.special = {};
  player.specialLevels = {};
  pendingCards = null;
  cardRects = [null, null, null];
  bullets.length = 0;
  zombies.length = 0;
  coins.length = 0;
  particles.length = 0;
  guns.length = 0;
  crates.length = 0;
  pickups.length = 0;
  slicks.length = 0;
  chests.length = 0;
  floaters.length = 0;
  slashes.length = 0;
  sparks.length = 0;
  decoys.length = 0;
  buildings.length = 0;
  buildMode = false;
  bladeCrates.length = 0;
  summons.length = 0;
  healFields.length = 0;
  decals.length = 0;
  shakeAmt = 0; flashRed = 0; nearbyGun = null;
  player.weapon = 'pistol';
  player.secondary = 'katana';
  player.lastSecondary = -10;
  player.lastDash = -10;
  kills = 0; deaths = 0; bestKills = 0; bestWave = 0;
  gameTime = 0;
  wave = 0; isBossWave = false; waveZombiesToSpawn = 0;
  waveSpawnTimer = 0; intermission = 3;
  // restore upgrade costs
  const base = [25, 35, 45, 55, 90, 18, 28, 32, 70];
  upgrades.forEach((u, i) => u.cost = base[i]);
}

// ---------- Render ----------
function render() {
  ctx.clearRect(0, 0, W, H);

  // screen shake offsets the world layer
  const sx = shakeAmt > 0 ? (Math.random() - 0.5) * shakeAmt : 0;
  const sy = shakeAmt > 0 ? (Math.random() - 0.5) * shakeAmt : 0;
  ctx.save();
  ctx.translate(sx, sy);

  // floor grid
  ctx.strokeStyle = '#181a22';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) {
    ctx.beginPath(); ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); ctx.stroke();
  }

  // blood decals (between grid and entities so zombies walk over them)
  for (const d of decals) {
    const a = Math.max(0, Math.min(1, d.life / (d.max || 12)));
    ctx.globalAlpha = a;
    ctx.fillStyle = d.color;
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // healing-field pads — drawn on the floor under entities
  for (const f of healFields) {
    const t = f.life / f.max;
    const pulse = 1 + Math.sin(gameTime * 5) * 0.06;
    ctx.save();
    ctx.globalAlpha = 0.55 * t;
    const grad = ctx.createRadialGradient(f.x, f.y, 4, f.x, f.y, f.r * pulse);
    grad.addColorStop(0, f.color);
    grad.addColorStop(1, f.color + '00');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r * pulse, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = t;
    ctx.strokeStyle = f.color;
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = f.color;
    ctx.fillRect(f.x - 2, f.y - 8, 4, 16);
    ctx.fillRect(f.x - 8, f.y - 2, 16, 4);
    ctx.restore();
  }

  // banana slicks
  for (const s of slicks) {
    const a = Math.min(1, s.life / 2);
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.ang);
    ctx.globalAlpha = a * 0.85;
    // smear underlayer (slippery sheen)
    ctx.fillStyle = '#ffe98a';
    ctx.beginPath(); ctx.ellipse(0, 0, s.r * 0.95, s.r * 0.55, 0, 0, Math.PI*2); ctx.fill();
    // banana peel shape on top
    ctx.fillStyle = '#ffd942';
    ctx.beginPath();
    ctx.moveTo(-s.r * 0.9, 2);
    ctx.quadraticCurveTo(-s.r * 0.4, -s.r * 0.55, s.r * 0.5, -s.r * 0.3);
    ctx.quadraticCurveTo(s.r * 0.95, 0, s.r * 0.45, s.r * 0.4);
    ctx.quadraticCurveTo(-s.r * 0.4, s.r * 0.55, -s.r * 0.9, 2);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#a07e1c';
    ctx.lineWidth = 1;
    ctx.stroke();
    // little stem
    ctx.fillStyle = '#6a4a0a';
    ctx.fillRect(s.r * 0.55, -3, 4, 3);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // shop zone
  ctx.fillStyle = 'rgba(96, 140, 220, 0.10)';
  ctx.fillRect(shop.x, shop.y, shop.w, shop.h);
  ctx.strokeStyle = '#5a87c4';
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 6]);
  ctx.strokeRect(shop.x, shop.y, shop.w, shop.h);
  ctx.setLineDash([]);
  ctx.fillStyle = '#88aadd';
  ctx.font = 'bold 14px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('SHOP', shop.x + shop.w / 2, shop.y - 8);

  // coins
  for (const k of coins) {
    const a = Math.min(1, k.life / 2);
    const bob = Math.sin(gameTime * 5 + k.x * 0.17) * 0.9;
    const cy = k.y + bob;
    ctx.globalAlpha = a;
    // soft outer glow
    const glow = ctx.createRadialGradient(k.x, cy, 1, k.x, cy, 11);
    glow.addColorStop(0, 'rgba(255, 224, 110, 0.55)');
    glow.addColorStop(1, 'rgba(255, 206, 68, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(k.x, cy, 11, 0, Math.PI*2); ctx.fill();
    // body gradient (top light → bottom dark gives a metallic feel)
    const body = ctx.createRadialGradient(k.x - 1.5, cy - 2, 0.5, k.x, cy, 5);
    body.addColorStop(0, '#fff2a8');
    body.addColorStop(0.6, '#ffce44');
    body.addColorStop(1, '#c69a1a');
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.arc(k.x, cy, 5, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#8a6c12';
    ctx.lineWidth = 1;
    ctx.stroke();
    // $ engraving
    ctx.fillStyle = '#5c4408';
    ctx.font = 'bold 7px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('$', k.x, cy + 2.5);
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
  }

  // particles
  for (const p of particles) {
    const a = Math.max(0, Math.min(1, p.life * 2));
    ctx.fillStyle = p.color;
    ctx.globalAlpha = a;
    ctx.beginPath(); ctx.arc(p.x, p.y, 2.5, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // buildings — walls, turrets, spike traps (drawn under zombies so a swarm
  // can visually overlap them when bashing)
  for (const b of buildings) {
    drawBuilding(b);
  }

  // decoys — colored dummy figure with HP bar above
  for (const dc of decoys) {
    const pulse = 1 + Math.sin(gameTime * 6 + dc.x * 0.1) * 0.1;
    // aura
    const aura = ctx.createRadialGradient(dc.x, dc.y, 4, dc.x, dc.y, 30 * pulse);
    aura.addColorStop(0, 'rgba(255, 206, 68, 0.5)');
    aura.addColorStop(1, 'rgba(255, 206, 68, 0)');
    ctx.fillStyle = aura;
    ctx.beginPath(); ctx.arc(dc.x, dc.y, 30 * pulse, 0, Math.PI*2); ctx.fill();
    // body
    ctx.fillStyle = '#ffce44';
    ctx.beginPath(); ctx.arc(dc.x, dc.y, 11, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = 2;
    ctx.stroke();
    // exclamation mark indicating "look at me"
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(dc.x - 1.5, dc.y - 5, 3, 7);
    ctx.fillRect(dc.x - 1.5, dc.y + 4, 3, 3);
    // HP bar
    if (dc.hp < dc.hpMax) {
      ctx.fillStyle = '#222';
      ctx.fillRect(dc.x - 14, dc.y - 22, 28, 4);
      ctx.fillStyle = '#5cd86b';
      ctx.fillRect(dc.x - 14, dc.y - 22, 28 * Math.max(0, dc.hp / dc.hpMax), 4);
    }
    // life timer ring (small gold tick at top)
    const lifeT = dc.life / 9;
    ctx.strokeStyle = '#a07e1c';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(dc.x, dc.y, 13, -Math.PI/2, -Math.PI/2 + Math.PI * 2 * lifeT);
    ctx.stroke();
  }

  // zombies
  for (const z of zombies) {
    if (z.isDummy) {
      // wooden bullseye target on a stand — friendlier than a zombie
      ctx.fillStyle = '#f4e4b5';
      ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#3a2810';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.strokeStyle = '#d63030';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(z.x, z.y, z.r * 0.65, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = '#d63030';
      ctx.beginPath(); ctx.arc(z.x, z.y, z.r * 0.28, 0, Math.PI*2); ctx.fill();
      // little stand below
      ctx.fillStyle = '#3a2810';
      ctx.fillRect(z.x - 2, z.y + z.r, 4, 10);
      ctx.fillRect(z.x - 8, z.y + z.r + 10, 16, 3);
      continue;
    }
    if (z.isBoss) {
      // pulsing aura
      const pulse = 1 + Math.sin(gameTime * 4) * 0.08;
      const grad = ctx.createRadialGradient(z.x, z.y, z.r * 0.6, z.x, z.y, z.r * 2.2 * pulse);
      grad.addColorStop(0, 'rgba(255, 60, 60, 0.35)');
      grad.addColorStop(1, 'rgba(255, 60, 60, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(z.x, z.y, z.r * 2.2 * pulse, 0, Math.PI*2); ctx.fill();
      // body
      ctx.fillStyle = z.color;
      ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, Math.PI*2); ctx.fill();
      // dark core
      ctx.fillStyle = '#3a0f0f';
      ctx.beginPath(); ctx.arc(z.x, z.y, z.r * 0.55, 0, Math.PI*2); ctx.fill();
      // glowing eyes
      ctx.fillStyle = '#ff5050';
      const eo = z.r * 0.35;
      ctx.beginPath(); ctx.arc(z.x - eo, z.y - eo*0.3, 4, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(z.x + eo, z.y - eo*0.3, 4, 0, Math.PI*2); ctx.fill();
    } else {
      ctx.fillStyle = z.color;
      ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#1a1a1a';
      const eo = z.r * 0.3;
      ctx.beginPath(); ctx.arc(z.x - eo, z.y - eo*0.3, 1.5, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(z.x + eo, z.y - eo*0.3, 1.5, 0, Math.PI*2); ctx.fill();
      if (z.hp < z.hpMax) {
        const bw = z.r * 2;
        ctx.fillStyle = '#222';
        ctx.fillRect(z.x - bw/2, z.y - z.r - 7, bw, 3);
        ctx.fillStyle = '#d24';
        ctx.fillRect(z.x - bw/2, z.y - z.r - 7, bw * (z.hp / z.hpMax), 3);
      }
    }
  }

  // bullets
  for (const b of bullets) {
    drawBullet(b);
  }

  // chicken summons (drawn above bullets so they're easy to track)
  for (const s of summons) {
    if (s.kind === 'chicken') {
      const ang = Math.atan2(s.vy, s.vx);
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(ang);
      // body
      ctx.fillStyle = '#fff5b8';
      ctx.beginPath(); ctx.ellipse(0, 0, 7, 5.5, 0, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#15151a';
      ctx.lineWidth = 1;
      ctx.stroke();
      // comb
      ctx.fillStyle = '#d63030';
      ctx.beginPath(); ctx.arc(-1, -5, 1.5, 0, Math.PI*2);
      ctx.arc(1, -5, 1.5, 0, Math.PI*2); ctx.fill();
      // beak
      ctx.fillStyle = '#ff9d3a';
      ctx.beginPath();
      ctx.moveTo(6, -1); ctx.lineTo(11, 0); ctx.lineTo(6, 2); ctx.closePath();
      ctx.fill();
      // eye
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath(); ctx.arc(3, -1, 0.9, 0, Math.PI*2); ctx.fill();
      ctx.restore();
      // life ring
      if (s.life < 4) {
        ctx.strokeStyle = '#ffe066';
        ctx.lineWidth = 1.5;
        ctx.globalAlpha = 0.4;
        ctx.beginPath(); ctx.arc(s.x, s.y, 10, 0, Math.PI*2); ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }
  }

  // tesla chain sparks — jagged white-on-blue lines, drawn briefly
  for (const sp of sparks) {
    const a = sp.life / sp.max;
    const dx = sp.x2 - sp.x1, dy = sp.y2 - sp.y1;
    const dist = Math.hypot(dx, dy) || 1;
    const nx = -dy / dist, ny = dx / dist; // perpendicular for jitter
    // outer glow
    ctx.globalAlpha = a * 0.5;
    ctx.strokeStyle = '#7ec8ff';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(sp.x1, sp.y1);
    ctx.lineTo(sp.x2, sp.y2);
    ctx.stroke();
    // jagged core
    ctx.globalAlpha = a;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(sp.x1, sp.y1);
    const segs = 4;
    for (let k = 1; k < segs; k++) {
      const t = k / segs;
      const jx = sp.x1 + dx * t + nx * (Math.random() - 0.5) * 12;
      const jy = sp.y1 + dy * t + ny * (Math.random() - 0.5) * 12;
      ctx.lineTo(jx, jy);
    }
    ctx.lineTo(sp.x2, sp.y2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // katana swing arcs — drawn over bullets so the slash reads on top
  for (const s of slashes) {
    const t = s.life / s.max;       // 1 → 0
    const trail = 1 - t;             // 0 → 1, used to fade the trailing edge
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.ang);
    // outer bright sweep
    ctx.globalAlpha = Math.min(1, t * 1.6);
    const grad = ctx.createRadialGradient(0, 0, s.range * 0.35, 0, 0, s.range);
    grad.addColorStop(0, 'rgba(255,255,255,0)');
    grad.addColorStop(0.7, s.color + 'aa');
    grad.addColorStop(1, s.color + '00');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, s.range, -s.arc / 2 + trail * 0.1, s.arc / 2 - trail * 0.1);
    ctx.closePath();
    ctx.fill();
    // sharp blade edge along the leading arc
    ctx.globalAlpha = t;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, s.range, -s.arc / 2 + trail * 0.15, s.arc / 2 - trail * 0.15);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // money crates
  for (const cr of crates) {
    const bob = Math.sin(gameTime * 3 + cr.x) * 2;
    const cy = cr.y + bob;
    // aura
    const aura = ctx.createRadialGradient(cr.x, cy, 4, cr.x, cy, 30);
    aura.addColorStop(0, 'rgba(255, 206, 68, 0.55)');
    aura.addColorStop(1, 'rgba(255, 206, 68, 0)');
    ctx.fillStyle = aura;
    ctx.beginPath(); ctx.arc(cr.x, cy, 30, 0, Math.PI*2); ctx.fill();
    // wooden frame
    ctx.fillStyle = '#5a3a14';
    ctx.fillRect(cr.x - 14, cy - 12, 28, 24);
    ctx.strokeStyle = '#2a1808';
    ctx.lineWidth = 1;
    ctx.strokeRect(cr.x - 14, cy - 12, 28, 24);
    // gold face with subtle vertical gradient
    const face = ctx.createLinearGradient(cr.x, cy - 10, cr.x, cy + 10);
    face.addColorStop(0, '#ffe98a');
    face.addColorStop(1, '#d6a020');
    ctx.fillStyle = face;
    ctx.fillRect(cr.x - 12, cy - 10, 24, 20);
    ctx.strokeStyle = '#a07e1c';
    ctx.strokeRect(cr.x - 12, cy - 10, 24, 20);
    // coin stack icon on top of crate
    for (let i = 0; i < 3; i++) {
      const sy = cy - 14 - i * 2;
      ctx.fillStyle = '#ffce44';
      ctx.beginPath(); ctx.ellipse(cr.x, sy, 5, 1.6, 0, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#8a6c12';
      ctx.lineWidth = 0.8;
      ctx.stroke();
    }
    // $ engraving on face
    ctx.fillStyle = '#3a2810';
    ctx.font = 'bold 14px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('$', cr.x, cy + 5);
    ctx.textAlign = 'left';
  }

  // boss-defeat chests
  for (const c of chests) {
    const bob = Math.sin(gameTime * 2.4 + c.x * 0.07) * 1.6;
    const pulse = 1 + Math.sin(gameTime * 5) * 0.12;
    const cy = c.y + bob;
    // strong aura — this is a big reward
    const aura = ctx.createRadialGradient(c.x, cy, 4, c.x, cy, 44 * pulse);
    aura.addColorStop(0, 'rgba(255, 220, 110, 0.6)');
    aura.addColorStop(1, 'rgba(255, 220, 110, 0)');
    ctx.fillStyle = aura;
    ctx.beginPath(); ctx.arc(c.x, cy, 44 * pulse, 0, Math.PI*2); ctx.fill();
    // wooden chest base
    ctx.fillStyle = '#5a3a14';
    ctx.fillRect(c.x - 18, cy - 6, 36, 18);
    ctx.strokeStyle = '#2a1808';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(c.x - 18, cy - 6, 36, 18);
    // lid (rounded)
    ctx.fillStyle = '#7a4e1c';
    ctx.beginPath();
    ctx.moveTo(c.x - 18, cy - 4);
    ctx.quadraticCurveTo(c.x, cy - 16, c.x + 18, cy - 4);
    ctx.lineTo(c.x + 18, cy);
    ctx.lineTo(c.x - 18, cy);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // gold bands
    ctx.fillStyle = '#ffce44';
    ctx.fillRect(c.x - 18, cy - 1, 36, 2);
    ctx.fillRect(c.x - 18, cy + 9, 36, 2);
    // gold lock
    ctx.fillStyle = '#ffe066';
    ctx.fillRect(c.x - 4, cy + 2, 8, 6);
    ctx.strokeStyle = '#8a6c12';
    ctx.lineWidth = 1;
    ctx.strokeRect(c.x - 4, cy + 2, 8, 6);
    // keyhole
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.arc(c.x, cy + 4.5, 1, 0, Math.PI*2); ctx.fill();
    // little sparkle on the lid
    ctx.fillStyle = '#fff5b8';
    const sx = c.x - 6 + Math.sin(gameTime * 2) * 2;
    const sy2 = cy - 8 + Math.cos(gameTime * 2) * 1;
    ctx.beginPath(); ctx.arc(sx, sy2, 1.6, 0, Math.PI*2); ctx.fill();
  }

  // gun pickups
  for (const g of guns) {
    const w = WEAPONS[g.weapon];
    const flash = g.life < 5 && Math.floor(g.life * 6) % 2 === 0;
    const bob = Math.sin(gameTime * 3 + g.x) * 2;
    const highlighted = g === nearbyGun;
    const cy = g.y + bob;
    // aura
    const auraR = highlighted ? 36 : 28;
    const aura = ctx.createRadialGradient(g.x, cy, 4, g.x, cy, auraR);
    aura.addColorStop(0, w.color + 'cc');
    aura.addColorStop(1, w.color + '00');
    ctx.fillStyle = aura;
    ctx.beginPath(); ctx.arc(g.x, cy, auraR, 0, Math.PI*2); ctx.fill();
    // crate-style box
    const bw = 30, bh = 28;
    ctx.fillStyle = flash ? '#fff' : w.color;
    ctx.fillRect(g.x - bw/2, cy - bh/2, bw, bh);
    ctx.strokeStyle = highlighted ? '#fff' : '#1a1a1a';
    ctx.lineWidth = highlighted ? 3 : 2;
    ctx.strokeRect(g.x - bw/2, cy - bh/2, bw, bh);
    // inner darker rim for depth
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 1;
    ctx.strokeRect(g.x - bw/2 + 3, cy - bh/2 + 3, bw - 6, bh - 6);
    // gun silhouette (drawn horizontally, slightly left of center so it fits)
    ctx.save();
    ctx.translate(g.x - 8, cy);
    drawGun(g.weapon, 7);
    ctx.restore();
    // small tag chip in the bottom-right corner
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(g.x + bw/2 - 10, cy + bh/2 - 9, 9, 8);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 8px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(w.tag, g.x + bw/2 - 5.5, cy + bh/2 - 2);
    ctx.textAlign = 'left';
  }

  // blade crates — hover to inspect, F or click to equip
  for (const c of bladeCrates) {
    const def = SECONDARIES[c.secondary];
    const flash = c.life < 5 && Math.floor(c.life * 6) % 2 === 0;
    const bob = Math.sin(gameTime * 3 + c.x * 0.07) * 2;
    const cy = c.y + bob;
    const highlighted = c === nearbyBladeCrate;
    // aura — stronger when nearby
    const auraR = highlighted ? 36 : 28;
    const aura = ctx.createRadialGradient(c.x, cy, 4, c.x, cy, auraR);
    aura.addColorStop(0, def.color + 'cc');
    aura.addColorStop(1, def.color + '00');
    ctx.fillStyle = aura;
    ctx.beginPath(); ctx.arc(c.x, cy, auraR, 0, Math.PI*2); ctx.fill();
    // crate shape — wooden box with a colored ribbon across
    const bw = 28, bh = 22;
    ctx.fillStyle = '#3a2410';
    ctx.fillRect(c.x - bw/2, cy - bh/2, bw, bh);
    ctx.strokeStyle = highlighted ? '#fff' : '#1a0e04';
    ctx.lineWidth = highlighted ? 3 : 1.5;
    ctx.strokeRect(c.x - bw/2, cy - bh/2, bw, bh);
    // ribbon
    ctx.fillStyle = flash ? '#fff' : def.color;
    ctx.fillRect(c.x - bw/2, cy - 4, bw, 8);
    ctx.strokeStyle = '#0a0a0a';
    ctx.lineWidth = 1;
    ctx.strokeRect(c.x - bw/2, cy - 4, bw, 8);
    // tag letter (so the player can read what's inside)
    ctx.fillStyle = '#1a1a1a';
    ctx.font = 'bold 11px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(def.tag, c.x, cy + 4);
    ctx.textAlign = 'left';
  }

  // random pickups
  for (const p of pickups) {
    const def = PICKUP_TYPES[p.type];
    const flash = p.life < 5 && Math.floor(p.life * 6) % 2 === 0;
    const bob = Math.sin(gameTime * 3.4 + p.x * 0.13) * 2.5;
    const pulse = 1 + Math.sin(gameTime * 4 + p.x) * 0.08;
    const cy = p.y + bob;
    // aura
    const auraR = 24 * pulse;
    const aura = ctx.createRadialGradient(p.x, cy, 3, p.x, cy, auraR);
    aura.addColorStop(0, def.color + 'cc');
    aura.addColorStop(1, def.color + '00');
    ctx.fillStyle = aura;
    ctx.beginPath(); ctx.arc(p.x, cy, auraR, 0, Math.PI*2); ctx.fill();
    // base disc
    ctx.fillStyle = flash ? '#fff' : def.color;
    ctx.beginPath(); ctx.arc(p.x, cy, 12, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = 2;
    ctx.stroke();
    // inner highlight crescent (top-left) for a glassy/coin look
    ctx.save();
    ctx.beginPath(); ctx.arc(p.x, cy, 12, 0, Math.PI*2); ctx.clip();
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(p.x - 4, cy - 4, 7, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    // type-specific icon on top
    drawPickupIcon(p.type, p.x, cy, 9);
  }

  // player
  if (player.invuln > 0 && Math.floor(player.invuln * 12) % 2 === 0) {
    // flicker — skip drawing
  } else {
    const dx = mouse.x - player.x, dy = mouse.y - player.y;
    const m = Math.hypot(dx, dy) || 1;
    const cosA = dx / m, sinA = dy / m;
    const facing = Math.atan2(dy, dx);

    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.32)';
    ctx.beginPath();
    ctx.ellipse(player.x, player.y + player.r * 0.55, player.r * 0.78, player.r * 0.28, 0, 0, Math.PI*2);
    ctx.fill();

    // shield ring
    if (player.buffs.shield > 0) {
      ctx.strokeStyle = '#7ec8ff';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(player.x, player.y, player.r + 6, 0, Math.PI*2); ctx.stroke();
    }

    // body
    ctx.fillStyle = '#ebebef';
    ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#2c2c34';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // eyes facing mouse
    const eyeOff = player.r * 0.36;
    const eyeFwd = player.r * 0.4;
    const ex = player.x + cosA * eyeFwd;
    const ey = player.y + sinA * eyeFwd;
    const epx = -sinA * eyeOff, epy = cosA * eyeOff;
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.arc(ex + epx, ey + epy, 1.8, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(ex - epx, ey - epy, 1.8, 0, Math.PI*2); ctx.fill();

    // gun held out front — model varies per weapon
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(facing);
    drawGun(player.weapon, player.r);
    ctx.restore();
  }

  // build-mode ghost preview at the cursor (in world coords)
  drawBuildMode();

  // floating reward text (above everything in the world)
  for (const f of floaters) {
    const a = Math.max(0, Math.min(1, f.life / 1.2));
    ctx.font = 'bold 13px system-ui';
    ctx.textAlign = 'center';
    ctx.fillStyle = `rgba(0,0,0,${0.7 * a})`;
    ctx.fillText(f.text, f.x + 1, f.y + 1);
    ctx.fillStyle = f.color;
    ctx.globalAlpha = a;
    ctx.fillText(f.text, f.x, f.y);
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }

  // end world (shake) layer
  ctx.restore();

  // vignette — drawn over world, under HUD
  const vg = ctx.createRadialGradient(W/2, H/2, Math.min(W, H) * 0.42, W/2, H/2, Math.max(W, H) * 0.72);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  // red damage flash
  if (flashRed > 0) {
    ctx.fillStyle = `rgba(220, 24, 24, ${flashRed * 0.6})`;
    ctx.fillRect(0, 0, W, H);
  }

  // HUD
  drawHud();
  drawStats();
  drawWaveBanner();
  drawCheats();
  if (nearbyGun && nearbyGun.weapon !== player.weapon) drawSwapPrompt();
  if (nearbyBladeCrate && nearbyBladeCrate.secondary !== player.secondary) drawBladeSwapPrompt();
  if (inShop()) drawShop();
  drawBuildToolbar();
  drawCardPicker(); // sits on top of everything when active
}

// ----- Building visuals -----
function drawBuilding(b) {
  const x = b.x - b.w / 2, y = b.y - b.h / 2;
  if (b.type === 'wall') {
    // metal-grey base + colored trim
    ctx.fillStyle = '#1d2230';
    ctx.fillRect(x, y, b.w, b.h);
    ctx.strokeStyle = '#0a0a0a';
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, b.w, b.h);
    ctx.fillStyle = b.color;
    ctx.fillRect(x + 3, y + 3, b.w - 6, 5);
    ctx.fillRect(x + 3, y + b.h - 8, b.w - 6, 5);
    // bolts
    ctx.fillStyle = '#5a5d66';
    ctx.beginPath(); ctx.arc(x + 6, y + 6, 1.6, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + b.w - 6, y + 6, 1.6, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 6, y + b.h - 6, 1.6, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + b.w - 6, y + b.h - 6, 1.6, 0, Math.PI*2); ctx.fill();
  } else if (b.type === 'turret') {
    // base
    ctx.fillStyle = '#22252e';
    ctx.fillRect(x, y, b.w, b.h);
    ctx.strokeStyle = '#0a0a0a';
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, b.w, b.h);
    // rotating head
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.aimAng);
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#15151a';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    // barrel
    ctx.fillStyle = '#15151a';
    ctx.fillRect(6, -2, 14, 4);
    ctx.fillStyle = b.color;
    ctx.fillRect(18, -2.5, 4, 5);
    ctx.restore();
  } else if (b.type === 'spike') {
    // plate + zigzag spikes
    ctx.fillStyle = '#3a3d44';
    ctx.fillRect(x, y, b.w, b.h);
    ctx.strokeStyle = '#0a0a0a';
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, b.w, b.h);
    ctx.fillStyle = b.color;
    ctx.beginPath();
    for (let k = 0; k < 5; k++) {
      const sx = x + 3 + k * 7;
      ctx.moveTo(sx, y + b.h - 4);
      ctx.lineTo(sx + 3, y + 4);
      ctx.lineTo(sx + 6, y + b.h - 4);
      ctx.closePath();
    }
    ctx.fill();
    ctx.strokeStyle = '#15151a';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  // HP bar (only when wounded)
  if (b.hpMax && b.hp < b.hpMax) {
    const f = Math.max(0, b.hp / b.hpMax);
    ctx.fillStyle = '#222';
    ctx.fillRect(b.x - b.w/2, b.y - b.h/2 - 7, b.w, 3);
    ctx.fillStyle = f > 0.5 ? '#5cb85c' : f > 0.25 ? '#e0a233' : '#d33';
    ctx.fillRect(b.x - b.w/2, b.y - b.h/2 - 7, b.w * f, 3);
  }
}

function drawBuildMode() {
  if (!buildMode) return;
  // ghost preview at snapped grid position
  const def = BUILDINGS[buildSelected];
  const { x, y } = snapBuildPos(mouse.x, mouse.y);
  const ok = canPlaceBuilding(x, y, def) && player.money >= def.cost;
  ctx.save();
  ctx.globalAlpha = 0.55;
  ctx.fillStyle = ok ? def.color : '#d33';
  ctx.fillRect(x - def.w/2, y - def.h/2, def.w, def.h);
  ctx.strokeStyle = ok ? '#ffffff' : '#d33';
  ctx.lineWidth = 2;
  ctx.setLineDash([4, 4]);
  ctx.strokeRect(x - def.w/2, y - def.h/2, def.w, def.h);
  ctx.setLineDash([]);
  // turret aim hint — show range circle
  if (def.range) {
    ctx.strokeStyle = ok ? '#ffffff' : '#d33';
    ctx.globalAlpha = 0.18;
    ctx.beginPath(); ctx.arc(x, y, def.range, 0, Math.PI*2); ctx.stroke();
  }
  ctx.restore();
}

function drawBuildToolbar() {
  if (!buildMode) { buildToolbarRects = null; return; }
  // small toolbar centered horizontally below the boss-bar zone
  const slots = BUILDING_KEYS.length;
  const sw = 130, sh = 64, gap = 10;
  const totalW = slots * sw + (slots - 1) * gap;
  const startX = (W - totalW) / 2;
  const y = 44;
  buildToolbarRects = [];
  // backdrop
  ctx.fillStyle = 'rgba(10, 12, 18, 0.92)';
  ctx.fillRect(startX - 14, y - 22, totalW + 28, sh + 36);
  ctx.strokeStyle = '#5a87c4';
  ctx.lineWidth = 1;
  ctx.strokeRect(startX - 14, y - 22, totalW + 28, sh + 36);
  // title
  ctx.fillStyle = '#88aadd';
  ctx.font = 'bold 12px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText('BUILD  ·  [B] exit  ·  click to place', startX + totalW / 2, y - 8);

  for (let i = 0; i < slots; i++) {
    const key = BUILDING_KEYS[i];
    const def = BUILDINGS[key];
    const x = startX + i * (sw + gap);
    const rect = { x, y, w: sw, h: sh };
    buildToolbarRects.push(rect);
    const selected = key === buildSelected;
    const canAfford = player.money >= def.cost;
    const hover = pointInRect(mouse, rect);
    // body
    ctx.fillStyle = selected ? '#1a3a5a' : (hover ? '#1c2030' : '#13151c');
    ctx.fillRect(x, y, sw, sh);
    ctx.strokeStyle = selected ? def.color : (canAfford ? '#33363f' : '#5a3030');
    ctx.lineWidth = selected ? 3 : 1.5;
    ctx.strokeRect(x, y, sw, sh);
    // little visual swatch
    ctx.fillStyle = def.color;
    ctx.fillRect(x + 10, y + 12, 32, 32);
    ctx.strokeStyle = '#15151a';
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 10, y + 12, 32, 32);
    // name + cost
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px system-ui';
    ctx.textAlign = 'left';
    ctx.fillText(def.name, x + 52, y + 26);
    ctx.fillStyle = canAfford ? '#ffce44' : '#d33';
    ctx.font = 'bold 12px system-ui';
    ctx.fillText(`$${def.cost}`, x + 52, y + 44);
    // hotkey
    ctx.fillStyle = '#5a5d66';
    ctx.font = '10px system-ui';
    ctx.textAlign = 'right';
    ctx.fillText(`[${i + 1}]`, x + sw - 8, y + 14);
    ctx.textAlign = 'left';
  }
}

// ----- Menus -----
function drawMenuButton(rect, label, hint, accent) {
  const hover = pointInRect(mouse, rect);
  ctx.fillStyle = hover ? '#1f2330' : '#13151c';
  ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
  ctx.strokeStyle = hover ? accent : '#33363f';
  ctx.lineWidth = hover ? 3 : 2;
  ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 22px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText(label, rect.x + rect.w / 2, rect.y + 34);
  if (hint) {
    ctx.fillStyle = '#9aa0ab';
    ctx.font = '12px system-ui';
    ctx.fillText(hint, rect.x + rect.w / 2, rect.y + 54);
  }
  ctx.textAlign = 'left';
}

function drawMainMenu() {
  // dark overlay
  ctx.fillStyle = 'rgba(6, 8, 12, 0.78)';
  ctx.fillRect(0, 0, W, H);

  // title — bigger version of the in-page header
  ctx.fillStyle = '#ff5050';
  ctx.font = 'bold 84px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText('D E A D Z O N E', W / 2, H / 2 - 110);
  ctx.fillStyle = '#9aa0ab';
  ctx.font = '14px system-ui';
  ctx.fillText('wave-based zombie survival', W / 2, H / 2 - 76);
  if (bestWave > 0) {
    ctx.fillStyle = '#88aadd';

// Menu button click dispatch — called from mousedown when a menu is active.
function handleMenuClick() {
  for (const r of menuButtons) {
    if (!pointInRect(mouse, r)) continue;
    SFX.uiClick();
    handleMenuAction(r.id);
    return true;
  }
  return false;
}

function handleMenuAction(id) {
  switch (id) {
    case 'resume':
      gameState = 'playing';
      break;
    case 'play':
      hardReset();
      trainingMode = false;
      hasGame = true;
      gameState = 'playing';
      break;
    case 'training':
      hardReset();
      trainingMode = true;
      cheatsUnlocked = true;
      cheatsOpen = true;
      hasGame = true;
      gameState = 'playing';
      spawnTrainerDummy();
      break;
    case 'settings':
      gameState = 'settings';
      break;
    case 'menu':
      gameState = 'menu';
      break;
    case 'back':
      gameState = hasGame ? 'paused' : 'menu';
      break;
    case 'mute':
      soundMuted = !soundMuted;
      applyMusicMute();
      break;
  }
  updateMusicForState();
}

function drawCheats() {
  // hidden until the player enters the unlock code
  if (!cheatsUnlocked) {
    cheatsHeaderRect = null;
    for (const sec of cheatSections) {
      sec.headerRect = null;
      for (const c of sec.items) c.rect = null;
    }
    for (const s of cheatSliders) s.rect = null;
    return;
  }
  const x = cheatsPanel.x, y = cheatsPanel.y;
  const w = cheatsPanel.w, btnH = 22, header = 24, secH = 18, sliderH = 22;
  // Compute height by walking the same layout we'll use below
  let bodyH = 0;
  if (cheatsOpen) {
    for (const sec of cheatSections) {
      bodyH += secH + 2;
      if (sec.open) bodyH += sec.items.length * (btnH + 3) + 4;
    }
    bodyH += cheatSliders.length * (sliderH + 2) + 18;
  }
  const h = cheatsOpen ? header + bodyH + 6 : header;
  ctx.fillStyle = 'rgba(8, 10, 16, 0.92)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = godMode ? '#8be08b' : '#5a87c4';
  ctx.lineWidth = 1;
  ctx.strokeRect(x, y, w, h);

  // header — also a drag handle
  ctx.fillStyle = cheatsDrag ? '#1c2030' : '#0e1018';
  ctx.fillRect(x, y, w, header);
  ctx.fillStyle = '#5a87c4';
  for (let k = 0; k < 3; k++) {
    ctx.fillRect(x + 5, y + 8 + k * 4, 3, 2);
    ctx.fillRect(x + 11, y + 8 + k * 4, 3, 2);
  }
  ctx.fillStyle = '#88aadd';
  ctx.font = 'bold 11px system-ui';
  ctx.textAlign = 'left';
  ctx.fillText('CHEATS', x + 22, y + 16);
  ctx.fillStyle = '#9aa0ab';
  ctx.textAlign = 'right';
  ctx.fillText(cheatsOpen ? '▾' : '▸', x + w - 10, y + 16);
  ctx.textAlign = 'left';

  cheatsHeaderRect = { x, y, w, h: header };

  if (!cheatsOpen) {
    for (const sec of cheatSections) {
      sec.headerRect = null;
      for (const c of sec.items) c.rect = null;
    }
    for (const s of cheatSliders) s.rect = null;
    return;
  }

  let by = y + header + 4;
  // Render each section: collapsible header + (when open) buttons
  for (const sec of cheatSections) {
    const secRect = { x: x + 8, y: by, w: w - 16, h: secH, sec };
    sec.headerRect = secRect;
    const hover = pointInRect(mouse, secRect);
    ctx.fillStyle = hover ? '#1c2030' : '#11141c';
    ctx.fillRect(secRect.x, secRect.y, secRect.w, secRect.h);
    ctx.strokeStyle = '#33363f';
    ctx.lineWidth = 1;
    ctx.strokeRect(secRect.x, secRect.y, secRect.w, secRect.h);
    ctx.fillStyle = '#88aadd';
    ctx.font = 'bold 10px system-ui';
    ctx.textAlign = 'left';
    ctx.fillText(sec.name.toUpperCase(), secRect.x + 8, secRect.y + 12);
    ctx.fillStyle = '#9aa0ab';
    ctx.textAlign = 'right';
    ctx.fillText(sec.open ? '▾' : '▸', secRect.x + secRect.w - 8, secRect.y + 12);
    ctx.textAlign = 'left';
    by += secH + 2;
    if (!sec.open) {
      for (const c of sec.items) c.rect = null;
      continue;
    }
    for (const c of sec.items) {
      const isOn = c.toggle ? c.toggle() : false;
      const rect = { x: x + 14, y: by, w: w - 28, h: btnH };
      c.rect = rect;
      const bhov = pointInRect(mouse, rect);
      ctx.fillStyle = isOn ? '#2e5a2e' : (bhov ? '#262b36' : '#1c1f28');
      ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
      ctx.strokeStyle = isOn ? '#8be08b' : (bhov ? '#7ec8ff' : '#33363f');
      ctx.lineWidth = 1;
      ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 11px system-ui';
      ctx.textAlign = 'center';
      const labelStr = typeof c.label === 'function' ? c.label() : c.label;
      ctx.fillText(
        c.toggle ? `${labelStr}: ${isOn ? 'ON' : 'OFF'}` : labelStr,
        rect.x + rect.w / 2, rect.y + 15);
      by += btnH + 3;
    }
    by += 2;
  }

  // Stats section header
  by += 6;
  ctx.fillStyle = '#22252e';
  ctx.fillRect(x + 8, by, w - 16, 1);
  by += 4;
  ctx.fillStyle = '#88aadd';
  ctx.font = 'bold 10px system-ui';
  ctx.textAlign = 'left';
  ctx.fillText('STATS', x + 10, by + 9);
  by += 12;

  // Sliders
  const trackX = x + 60, trackW = w - 60 - 36, knobR = 5;
  ctx.font = 'bold 10px system-ui';
  for (const s of cheatSliders) {
    const rect = { x: x + 8, y: by, w: w - 16, h: sliderH, trackX, trackW, trackY: by + 11 };
    s.rect = rect;
    // label
    ctx.fillStyle = '#9aa0ab';
    ctx.textAlign = 'left';
    ctx.fillText(s.label, x + 10, by + 14);
    // track
    ctx.fillStyle = '#1c1f28';
    ctx.fillRect(trackX, by + 8, trackW, 6);
    ctx.strokeStyle = '#33363f';
    ctx.strokeRect(trackX, by + 8, trackW, 6);
    // fill + knob
    const val = s.get();
    const t = Math.max(0, Math.min(1, (val - s.min) / (s.max - s.min)));
    ctx.fillStyle = '#5a87c4';
    ctx.fillRect(trackX, by + 8, trackW * t, 6);
    ctx.fillStyle = sliderDrag && sliderDrag.slider === s ? '#fff' : '#88aadd';
    ctx.beginPath();
    ctx.arc(trackX + trackW * t, by + 11, knobR, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#0a0a0a';
    ctx.lineWidth = 1;
    ctx.stroke();
    // value
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'right';
    const display = s.step < 1 ? val.toFixed(1) : Math.round(val).toString();
    ctx.fillText(display, x + w - 8, by + 14);
    ctx.textAlign = 'left';
    by += sliderH + 2;
  }
}

// Convert a slider's mouse-x into its bound value, snapped to its step.
function sliderValueAt(s, mx) {
  const t = Math.max(0, Math.min(1, (mx - s.rect.trackX) / s.rect.trackW));
  let v = s.min + t * (s.max - s.min);
  v = Math.round(v / s.step) * s.step;
  if (s.step < 1) v = parseFloat(v.toFixed(2));
  return v;
}

    ctx.fillRect(bx, by, barW, barH);
    ctx.fillStyle = ratio >= 1 ? '#5cffec' : '#5a5d66';
    ctx.fillRect(bx, by, barW * ratio, barH);
  }
}

function drawWaveBanner() {
  // Boss HP bar — shown whenever any boss is alive (covers cheat-spawned bosses too)
  {
    const boss = zombies.find(z => z.isBoss);
    if (boss) {
      const bw = 540, bh = 18;
      const bx = (W - bw) / 2, by = 14;
      ctx.fillStyle = 'rgba(20, 5, 5, 0.85)';
      ctx.fillRect(bx, by, bw, bh);
      ctx.fillStyle = '#ff3838';
      ctx.fillRect(bx, by, bw * Math.max(0, boss.hp) / boss.hpMax, bh);
      ctx.strokeStyle = '#ff8080';
      ctx.lineWidth = 2;
      ctx.strokeRect(bx, by, bw, bh);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 12px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText(`BOSS — WAVE ${wave}`, W / 2, by + 13);
      ctx.textAlign = 'left';
    }
  }
  // Intermission countdown — center of screen, big.
  // While a perk pick is pending, the card UI takes over this space, so skip it here.
  if (intermission > 0 && !pendingCards) {
    ctx.fillStyle = 'rgba(0,0,0,0.42)';
    const tw = 400, th = 80;
    ctx.fillRect((W - tw) / 2, H / 2 - th / 2 - 100, tw, th);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 22px system-ui';
    ctx.textAlign = 'center';
    const next = wave + 1;
    const label = (next % 20 === 0) ? `BOSS WAVE ${next}` : `Wave ${next}`;
    ctx.fillText(label, W / 2, H / 2 - 100);
    ctx.fillStyle = '#9aa0ab';
    ctx.font = '13px system-ui';
    ctx.fillText(`Ready when you are  ·  go to shop, then start`, W / 2, H / 2 - 78);
    ctx.textAlign = 'left';

    // Skip button
    const hovered = pointInRect(mouse, skipBtn);
    ctx.fillStyle = hovered ? '#3a7a3a' : '#2a4a2a';
    ctx.fillRect(skipBtn.x, skipBtn.y, skipBtn.w, skipBtn.h);
    ctx.strokeStyle = hovered ? '#8be08b' : '#5cb85c';
    ctx.lineWidth = 2;
    ctx.strokeRect(skipBtn.x, skipBtn.y, skipBtn.w, skipBtn.h);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('START NOW  ▶', skipBtn.x + skipBtn.w / 2, skipBtn.y + 25);
    ctx.fillStyle = '#9aa0ab';
    ctx.font = '10px system-ui';
    ctx.fillText('click or press Space', W / 2, skipBtn.y + skipBtn.h + 16);
    ctx.textAlign = 'left';
  }
}

function drawHud() {
  // HP
  const hpW = 220, hpH = 14;
  ctx.fillStyle = '#1d1f26';
  ctx.fillRect(14, 14, hpW, hpH);
  const frac = Math.max(0, player.hp / player.maxHp);
  ctx.fillStyle = frac > 0.5 ? '#5cb85c' : frac > 0.25 ? '#e0a233' : '#d33';
  ctx.fillRect(14, 14, hpW * frac, hpH);
  ctx.strokeStyle = '#33363f';
  ctx.strokeRect(14, 14, hpW, hpH);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 11px system-ui';
  ctx.textAlign = 'left';
  ctx.fillText(`${Math.ceil(Math.max(0, player.hp))} / ${player.maxHp}`, 20, 25);

  // Money
  ctx.fillStyle = '#ffce44';
  ctx.font = 'bold 20px system-ui';
  ctx.fillText(`$${player.money}`, 14, 56);

  // Wave line
  ctx.fillStyle = isBossWave ? '#ff7070' : '#7ec8ff';
  ctx.font = 'bold 15px system-ui';
  const waveLabel = wave === 0
    ? 'Get ready'
    : (isBossWave ? `Wave ${wave} — BOSS` : `Wave ${wave}`);
  ctx.fillText(waveLabel, 14, 78);
  ctx.fillStyle = '#9aa0ab';
  ctx.font = '11px system-ui';
  let sub;
  if (intermission > 0)              sub = `Press SPACE to start`;
  else if (waveZombiesToSpawn > 0)   sub = `${waveZombiesToSpawn + zombies.length} left`;
  else                               sub = `${zombies.length} left`;
  ctx.fillText(sub, 14, 94);

  // Stats line
  ctx.fillStyle = '#9aa0ab';
  ctx.font = '11px system-ui';
  ctx.fillText(
    `Kills ${kills}  ·  Deaths ${deaths}  ·  Best wave ${Math.max(bestWave, wave)}`,
    14, 112);

  // Active buffs
  let by = 132;
  const buffLabels = { triple: 'Triple', rapid: 'Rapid', fast: 'Speed', shield: 'Shield' };
  for (const k of Object.keys(player.buffs)) {
    const v = player.buffs[k];
    if (v > 0) {
      ctx.fillStyle = '#7ec8ff';
      ctx.font = 'bold 11px system-ui';
      const txt = k === 'shield' ? buffLabels[k] : `${buffLabels[k]} ${v.toFixed(1)}s`;
      ctx.fillText(txt, 14, by);
      by += 14;
    }
  }
  // Picked perks (tomes)
  const perkKeys = Object.keys(player.specialLevels).filter(k => player.specialLevels[k] > 0);
  if (perkKeys.length) {
    by += 4;
    ctx.fillStyle = '#c47eff';
    ctx.font = 'bold 10px system-ui';
    ctx.fillText('PERKS', 14, by);
    by += 12;
    for (const k of perkKeys) {
      const def = SPECIAL_UPGRADES[k];
      const lv = player.specialLevels[k];
      ctx.fillStyle = def.color;
      ctx.fillRect(14, by - 8, 8, 8);
      ctx.fillStyle = '#dfe2e8';
      ctx.font = 'bold 11px system-ui';
      ctx.fillText(`${def.name}${lv > 1 ? ' ×' + lv : ''}`, 26, by);
      by += 13;
    }
  }
}

function drawCardPicker() {
  if (!pendingCards) return;

  // dim the world behind the tomes
  ctx.fillStyle = 'rgba(0, 0, 0, 0.62)';
  ctx.fillRect(0, 0, W, H);

  // title (serif, like an arcane proclamation)
  ctx.fillStyle = '#f4e4b5';
  ctx.font = 'bold 28px Georgia, serif';
  ctx.textAlign = 'center';
  ctx.fillText('A T O M E   B E C K O N S', W / 2, 104);
  ctx.fillStyle = '#9aa0ab';
  ctx.font = '13px Georgia, serif';
  ctx.fillText('claim one  ·  click  or  press 1 / 2 / 3', W / 2, 130);

  const cw = 220, ch = 296, gap = 30;
  const totalW = 3 * cw + 2 * gap;
  const startX = (W - totalW) / 2;
  const yBase = (H - ch) / 2 + 30;

  for (let i = 0; i < 3; i++) {
    const key = pendingCards[i];
    const def = SPECIAL_UPGRADES[key];
    const lvl = player.specialLevels[key] || 0;
    const baseX = startX + i * (cw + gap);
    const hoverRect = { x: baseX, y: yBase, w: cw, h: ch };
    cardRects[i] = hoverRect;
    const hover = pointInRect(mouse, hoverRect);
    // hover lift + idle bobble
    const float = Math.sin(gameTime * 2.2 + i * 1.3) * 2 + (hover ? -6 : 0);

    ctx.save();
    ctx.translate(baseX, yBase + float);

    // magical aura behind the tome — stronger when hovered
    const auraR = hover ? 170 : 120;
    const aura = ctx.createRadialGradient(cw/2, ch/2, 24, cw/2, ch/2, auraR);
    aura.addColorStop(0, def.color + (hover ? '66' : '33'));
    aura.addColorStop(1, def.color + '00');
    ctx.fillStyle = aura;
    ctx.fillRect(-40, -40, cw + 80, ch + 80);

    // ----- TOME -----
    // back cover shadow
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(4, 6, cw, ch);

    // leather cover (dark, slight gradient)
    const cover = ctx.createLinearGradient(0, 0, 0, ch);
    cover.addColorStop(0, '#3a2410');
    cover.addColorStop(0.5, '#5a3818');
    cover.addColorStop(1, '#2a1808');
    ctx.fillStyle = cover;
    ctx.fillRect(0, 0, cw, ch);
    // outer stroke
    ctx.strokeStyle = '#1a0e04';
    ctx.lineWidth = 2;
    ctx.strokeRect(0, 0, cw, ch);
    // inner inset (cover frame)
    ctx.strokeStyle = '#8a6620';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(8, 8, cw - 16, ch - 16);
    ctx.strokeStyle = '#5a4014';
    ctx.lineWidth = 1;
    ctx.strokeRect(12, 12, cw - 24, ch - 24);

    // spine accents at top & bottom (gold bands)
    ctx.fillStyle = '#a88828';
    ctx.fillRect(0, 18, cw, 3);
    ctx.fillRect(0, ch - 21, cw, 3);

    // ribbon bookmark hanging out the top, in the perk's color
    ctx.fillStyle = def.color;
    ctx.fillRect(cw - 42, -10, 9, 38);
    // forked V end
    ctx.beginPath();
    ctx.moveTo(cw - 42, 28);
    ctx.lineTo(cw - 37, 36);
    ctx.lineTo(cw - 33, 28);
    ctx.closePath();
    ctx.fill();
    // ribbon shadow line
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(cw - 36, -10, 3, 38);

    // PARCHMENT PAGE inset in the middle
    const px = 22, py = 32, pw = cw - 44, ph = ch - 64;
    const page = ctx.createLinearGradient(0, py, 0, py + ph);
    page.addColorStop(0, '#f4e4b5');
    page.addColorStop(0.5, '#e8d294');
    page.addColorStop(1, '#c4a578');
    ctx.fillStyle = page;
    ctx.fillRect(px, py, pw, ph);
    // page edge shadow
    ctx.strokeStyle = '#7a5a20';
    ctx.lineWidth = 1;
    ctx.strokeRect(px, py, pw, ph);
    // age staining (faint dark splotches)
    ctx.globalAlpha = 0.08;
    ctx.fillStyle = '#5a3010';
    ctx.beginPath(); ctx.arc(px + 18, py + 22, 8, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(px + pw - 30, py + ph - 38, 12, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    // gold corner flourishes on the parchment
    ctx.strokeStyle = '#a88828';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(px + 8, py); ctx.lineTo(px, py); ctx.lineTo(px, py + 8);
    ctx.moveTo(px + pw - 8, py); ctx.lineTo(px + pw, py); ctx.lineTo(px + pw, py + 8);
    ctx.moveTo(px, py + ph - 8); ctx.lineTo(px, py + ph); ctx.lineTo(px + 8, py + ph);
    ctx.moveTo(px + pw, py + ph - 8); ctx.lineTo(px + pw, py + ph); ctx.lineTo(px + pw - 8, py + ph);
    ctx.stroke();

    // TITLE on the page
    ctx.fillStyle = '#2a1808';
    ctx.font = 'bold 17px Georgia, serif';
    ctx.textAlign = 'center';
    ctx.fillText(def.name, cw / 2, py + 28);
    // decorative rule
    ctx.strokeStyle = '#a88828';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(px + 18, py + 38); ctx.lineTo(px + pw - 18, py + 38);
    ctx.stroke();
    // tiny diamond on the rule
    ctx.fillStyle = '#a88828';
    ctx.beginPath();
    ctx.moveTo(cw / 2, py + 35); ctx.lineTo(cw / 2 + 3, py + 38);
    ctx.lineTo(cw / 2, py + 41); ctx.lineTo(cw / 2 - 3, py + 38);
    ctx.closePath(); ctx.fill();

    // RUNE CIRCLE in the page middle, glowing in the perk's color
    const rcx = cw / 2, rcy = py + 92;
    // outer rings
    ctx.strokeStyle = '#a88828';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(rcx, rcy, 30, 0, Math.PI*2); ctx.stroke();
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(rcx, rcy, 35, 0, Math.PI*2); ctx.stroke();
    // tick marks around the outer ring (cardinal points)
    for (let t = 0; t < 4; t++) {
      const a = t * Math.PI / 2;
      const x1 = rcx + Math.cos(a) * 30, y1 = rcy + Math.sin(a) * 30;
      const x2 = rcx + Math.cos(a) * 35, y2 = rcy + Math.sin(a) * 35;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
    // inner glow
    const runeGlow = ctx.createRadialGradient(rcx, rcy, 1, rcx, rcy, 28);
    runeGlow.addColorStop(0, def.color);
    runeGlow.addColorStop(0.7, def.color + '55');
    runeGlow.addColorStop(1, def.color + '00');
    ctx.fillStyle = runeGlow;
    ctx.beginPath(); ctx.arc(rcx, rcy, 28, 0, Math.PI*2); ctx.fill();
    // 8-pointed star sigil (rotating slowly)
    const rot = gameTime * 0.6 + i;
    ctx.save();
    ctx.translate(rcx, rcy);
    ctx.rotate(rot);
    ctx.fillStyle = def.color;
    ctx.strokeStyle = '#3a2010';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (let k = 0; k < 8; k++) {
      const a = (k / 8) * Math.PI * 2;
      const r = (k % 2 === 0) ? 13 : 5;
      const sx = Math.cos(a) * r, sy = Math.sin(a) * r;
      if (k === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    }
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // central pip
    ctx.fillStyle = '#fff5b8';
    ctx.beginPath(); ctx.arc(0, 0, 1.8, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    // DESCRIPTION text on the lower half of the page
    ctx.fillStyle = '#2a1808';
    ctx.font = 'italic 13px Georgia, serif';
    ctx.textAlign = 'center';
    wrapText(def.desc, cw / 2, py + 156, pw - 16, 17);

    // PICK NUMBER medallion (top-left of cover)
    ctx.fillStyle = '#1a0e04';
    ctx.beginPath(); ctx.arc(20, 22, 13, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#a88828';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#f4e4b5';
    ctx.font = 'bold 14px Georgia, serif';
    ctx.fillText(`${i + 1}`, 20, 27);

    // LEVEL plaque if already owned (top-right of cover)
    if (lvl > 0) {
      ctx.fillStyle = '#1a0e04';
      ctx.fillRect(cw - 70, 8, 50, 18);
      ctx.strokeStyle = '#a88828';
      ctx.lineWidth = 1.2;
      ctx.strokeRect(cw - 70, 8, 50, 18);
      ctx.fillStyle = '#ffd166';
      ctx.font = 'bold 10px Georgia, serif';
      ctx.fillText(`Lv ${lvl} → ${lvl + 1}`, cw - 45, 21);
    }

    // hover ring
    if (hover) {
      ctx.strokeStyle = def.color;
      ctx.lineWidth = 3;
      ctx.strokeRect(-2, -2, cw + 4, ch + 4);
      ctx.fillStyle = '#f4e4b5';
      ctx.font = 'italic bold 11px Georgia, serif';
      ctx.fillText('— claim this tome —', cw / 2, ch - 12);
    } else {
      ctx.fillStyle = '#a88828';
      ctx.font = 'italic 11px Georgia, serif';
      ctx.fillText(`press [${i + 1}]`, cw / 2, ch - 12);
    }

    ctx.restore();
  }
  ctx.textAlign = 'left';
}

// Minimal word-wrapper used by the card picker. Centers each line at x.
function wrapText(text, x, y, maxWidth, lineHeight) {
  const words = text.split(' ');
  let line = '';
  let cy = y;
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxWidth && line) {
      ctx.fillText(line, x, cy);
      line = w;
      cy += lineHeight;
    } else {
      line = test;
    }
  }
  if (line) ctx.fillText(line, x, cy);
}

function drawShop() {
  const w = 320, h = 380;
  const x = 18, y = H - h - 18;
  ctx.fillStyle = 'rgba(8, 10, 16, 0.92)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = '#5a87c4';
  ctx.lineWidth = 2;
  ctx.strokeRect(x, y, w, h);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 18px system-ui';
  ctx.fillText('SHOP', x + 14, y + 26);
  ctx.fillStyle = '#888c95';
  ctx.font = '11px system-ui';
  ctx.fillText('Press number to buy', x + 14, y + 42);

  let ly = y + 70;
  for (let i = 0; i < upgrades.length; i++) {
    const u = upgrades[i];
    const can = player.money >= u.cost;
    ctx.fillStyle = can ? '#fff' : '#5a5d66';
    ctx.font = 'bold 13px system-ui';
    ctx.fillText(`${i + 1}.  ${u.name}`, x + 14, ly);
    ctx.fillStyle = u.type === 'perm' ? '#7ec8ff' : '#ffb070';
    ctx.font = '9px system-ui';
    ctx.fillText(u.type.toUpperCase(), x + 14, ly + 14);
    ctx.textAlign = 'right';
    ctx.fillStyle = can ? '#ffce44' : '#666';
    ctx.font = 'bold 13px system-ui';
    ctx.fillText(`$${u.cost}`, x + w - 14, ly);
    ctx.textAlign = 'left';
    ly += 32;
  }
}

// ---------- Loop ----------
let lastT = performance.now();
function tick() {
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (gameState === 'playing') {
    gameTime += dt;
    updatePlayer(dt);
    if (mouse.down && !inShop() && !pendingCards) tryShoot(gameTime);
    updateBullets(dt);
    updateZombies(dt);
    updateCoins(dt);
    updateGuns(dt);
    updateCrates(dt);
    updatePickups(dt);
    updateSlicks(dt);
    updateChests(dt);
    updateFloaters(dt);
    updateSlashes(dt);
    updateSparks(dt);
    updateDecoys(dt);
    updateBuildings(dt);
    updateBladeCrates(dt);
    updateSummons(dt);
    updateHealFields(dt);
    updateParticles(dt);
    updateDecals(dt);
    updateWave(dt);
    // decay visual effects only while playing
    if (shakeAmt > 0) {
      shakeAmt -= 60 * dt;
      if (shakeAmt < 0) shakeAmt = 0;
    }
    if (flashRed > 0) {
      flashRed -= 1.4 * dt;
      if (flashRed < 0) flashRed = 0;
    }
    checkDeath();
  }

  render();
  // Overlay menus (game world is still rendered as a backdrop)
  if (gameState === 'menu') drawMainMenu();
  else if (gameState === 'paused') drawPauseMenu();
  else if (gameState === 'settings') drawSettingsMenu();
  if (trainingMode && gameState === 'playing') drawTrainingBanner();

  requestAnimationFrame(tick);
}
tick();
</script>
